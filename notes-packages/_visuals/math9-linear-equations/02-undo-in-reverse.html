section: Section 1
anchor: <p><strong>Why undo in reverse order?</strong>
where: after
caption: Build the expression forwards, then undo it backwards, like taking off socks and shoes: the last thing done is the first thing undone.

<svg viewBox="0 0 540 164" aria-label="Forwards: start with x, multiply by 2, subtract 5, get 9. Backwards: start with 9, add 5 to get 14, divide by 2 to get x equals a blank, 7.">
<text x="20" y="22" class="dg-label">Building 2x − 5:</text>
<rect x="20" y="32" width="64" height="36" rx="7" class="dg-fill-accent"/>
<text x="52" y="56" text-anchor="middle" class="dg-pt">x</text>
<arrow x1="88" y1="50" x2="148" y2="50" kind="plain"/>
<text x="118" y="42" text-anchor="middle" class="dg-label">× 2</text>
<rect x="152" y="32" width="64" height="36" rx="7" class="dg-boundary"/>
<text x="184" y="56" text-anchor="middle" class="dg-math">2x</text>
<arrow x1="220" y1="50" x2="280" y2="50" kind="plain"/>
<text x="250" y="42" text-anchor="middle" class="dg-label">− 5</text>
<rect x="284" y="32" width="64" height="36" rx="7" class="dg-boundary"/>
<text x="316" y="56" text-anchor="middle" class="dg-math">9</text>
<text x="20" y="104" class="dg-label">Solving, in reverse:</text>
<rect x="284" y="114" width="64" height="36" rx="7" class="dg-boundary"/>
<text x="316" y="138" text-anchor="middle" class="dg-math">9</text>
<arrow x1="280" y1="132" x2="220" y2="132" kind="accent"/>
<text x="250" y="124" text-anchor="middle" class="dg-label-accent">+ 5</text>
<rect x="152" y="114" width="64" height="36" rx="7" class="dg-boundary"/>
<text x="184" y="138" text-anchor="middle" class="dg-math">14</text>
<arrow x1="148" y1="132" x2="88" y2="132" kind="accent"/>
<text x="118" y="124" text-anchor="middle" class="dg-label-accent">÷ 2</text>
<text x="44" y="138" text-anchor="end" class="dg-math">x =</text>
<tag x="49" y="117" w="36" h="30">7</tag>
<text x="384" y="55" class="dg-label-sm">last step done: − 5</text>
<text x="384" y="137" class="dg-label-sm">so undo it first: + 5</text>
</svg>
