section: Section 1
anchor: <p><strong>Why undo in reverse order?</strong>
where: after
caption: Build the expression forwards, then undo it backwards, like taking off socks and shoes: the last thing done is the first thing undone.
tikz: operation-chain | x*2-5=9 | inverse
---
<svg viewBox="0 0 540 160" aria-label="Forwards: start with x, multiply by 2, subtract 5, get 9. Backwards: start with 9, add 5 to get 14, divide by 2 to get x equals a blank, 7.">
<text x="20" y="22" class="dg-label">Building 2x − 5:</text>
<rect x="20" y="32" width="60" height="34" rx="6" class="dg-fill-accent"/><text x="50" y="54" text-anchor="middle" class="dg-math">x</text>
<arrow x1="84" y1="49" x2="146" y2="49" kind="plain"/><text x="115" y="42" text-anchor="middle" class="dg-label">× 2</text>
<rect x="150" y="32" width="60" height="34" rx="6" class="dg-boundary"/><text x="180" y="54" text-anchor="middle" class="dg-math">2x</text>
<arrow x1="214" y1="49" x2="276" y2="49" kind="plain"/><text x="245" y="42" text-anchor="middle" class="dg-label">− 5</text>
<rect x="280" y="32" width="60" height="34" rx="6" class="dg-boundary"/><text x="310" y="54" text-anchor="middle" class="dg-math">9</text>
<text x="20" y="98" class="dg-label">Solving, in reverse:</text>
<rect x="280" y="108" width="60" height="34" rx="6" class="dg-boundary"/><text x="310" y="130" text-anchor="middle" class="dg-math">9</text>
<arrow x1="276" y1="125" x2="214" y2="125" kind="accent"/><text x="245" y="118" text-anchor="middle" class="dg-label-accent">+ 5</text>
<rect x="150" y="108" width="60" height="34" rx="6" class="dg-boundary"/><text x="180" y="130" text-anchor="middle" class="dg-math">14</text>
<arrow x1="146" y1="125" x2="84" y2="125" kind="accent"/><text x="115" y="118" text-anchor="middle" class="dg-label-accent">÷ 2</text>
<text x="40" y="130" text-anchor="end" class="dg-math">x =</text>
<tag x="44" y="112" w="36" h="26">7</tag>
<text x="380" y="54" class="dg-label-sm">last step done: − 5</text>
<text x="380" y="130" class="dg-label-sm">so undo it first: + 5</text>
</svg>
