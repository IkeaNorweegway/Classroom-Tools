<section id="statement" data-transition="fade" style="background:#1B2A3A;color:#F7F5F0;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px;display:flex;flex-direction:row;gap:64px">
<!-- Replace all [BRACKETED] items with real content. Layout: dark statement with a large visual (map, diagram) on the right. Use for a "connection" or callout box in the notes. Labels go in <p> tags pinned over the drawing, never in SVG <text>. A hand-drawn map says "Schematic, not to scale" and places points from real coordinates. -->
<div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px">
<p style="font-size:28px;font-weight:600;color:#E9A07A;letter-spacing:4px;text-transform:uppercase">[CALLOUT LABEL FROM THE NOTES]</p>
<h2 style="font-family:'Source Serif 4', Georgia, serif;font-size:80px;font-weight:600;line-height:1.15">[ONE-SENTENCE STATEMENT]</h2>
<p style="font-size:30px;line-height:1.4;color:#BFCBD6">[TWO SHORT SENTENCES OF SUPPORT]</p>
<p style="font-size:30px;font-weight:600;line-height:1.4">[QUESTION FOR THE CLASS]</p>
<div style="display:flex;flex-direction:column;gap:6px;background:#243649;padding:24px 28px;border-left:6px solid #E9A07A;border-radius:8px">
<p style="font-size:24px;font-weight:600;color:#E9A07A;letter-spacing:3px;text-transform:uppercase">Notebook key word</p>
<p style="font-size:28px;font-weight:600">[VOCAB TERM]</p>
<p style="font-size:24px;line-height:1.35;color:#BFCBD6">[DEFINITION]</p>
</div>
</div>
<div style="width:620px;display:flex;flex-direction:column;gap:16px">
<div style="position:relative;width:620px;height:440px">
<svg aria-label="[DESCRIBE THE VISUAL]" viewBox="0 0 620 440" style="width:620px;height:440px">
<rect x="0" y="0" width="620" height="440" fill="#243649" stroke="#BFCBD6" stroke-width="3"/>
<circle cx="[X]" cy="[Y]" r="12" fill="#F7F5F0"/>
</svg>
<p style="position:absolute;left:24px;top:16px;font-size:28px;font-weight:600;color:#BFCBD6;letter-spacing:4px">[MAP OR DIAGRAM TITLE]</p>
<p style="position:absolute;left:[X+20]px;top:[Y-18]px;width:180px;font-size:28px;font-weight:600">[LABEL]</p>
</div>
<p style="font-size:24px;line-height:1.4;color:#BFCBD6">[LEGEND]. Schematic, not to scale.</p>
</div>
