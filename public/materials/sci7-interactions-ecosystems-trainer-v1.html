<!-- =====================================================================
   ECOSYSTEMS TRAINER (narrow trainer format, see _sims-context.md)
   Science 7 | Interactions and Ecosystems | LO 7-1-01 to 7-1-04. Used after the lesson: it does not teach,
   it points back to the notes (Sections 1–5). One narrow skill per tab, 10 items a round:
     7-1-01 Biotic?       sort a card: biotic (living) or abiotic (non-living); soil counts as abiotic, as in the notes
     7-1-02 Role          producer, consumer or decomposer
     7-1-02 Level         the yellow card in an Alberta food chain: producer, primary, secondary or tertiary consumer
     7-1-02 Arrow         "lynx eats hare": which way the arrow points (food to eater, the way energy flows)
     7-1-02 Food web      one species removed from a boreal web: a directly linked one goes up or down
     §3     10% rule      energy pyramid: one level up keeps 1/10 (÷ 10), one level down × 10
     7-1-03 Biodiversity  two plots: the one with more kinds (species), not more living things
     7-1-04 Change        natural disturbance or human-caused change
   Model: food-web effects are first effects on a directly linked species only (less food: down; fewer predators: up).
   The 10% rule is the notes' rule of thumb (5–15% is realistic).
   Named mistakes: the producer counted as a consumer, arrows drawn as "eats", energy growing up the pyramid, 90% passed

   ?debug=1 puts DRILL (and MODEL) on window, turns off saving and motion.

<style>

  .dots span.now { border-color: var(--text); }
  .dots .g { background: var(--green); border-color: var(--green); }
  .dots .y { background: var(--yellow); border-color: var(--yellow); }

<script>
const DEBUG = /[?&]debug=1/.test(location.search);

/* ===== DRILL KIT START (no DOM): exact fractions and seeded random ===== */
const Q = (() => {
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);
  const q = (n, d) => { d = d == null ? 1 : d; if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return { n: n / g, d: d / g }; };
  const of = v => typeof v === 'number' ? (Number.isInteger(v) ? q(v) : dec(String(v))) : v;
  const add = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d + b.n * a.d, a.d * b.d); };
  const sub = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d - b.n * a.d, a.d * b.d); };
  const mul = (a, b) => { a = of(a); b = of(b); return q(a.n * b.n, a.d * b.d); };
  const div = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d, a.d * b.n); };
  const neg = a => { a = of(a); return q(-a.n, a.d); };
  const eq = (a, b) => { if (a == null || b == null) return false; a = of(a); b = of(b); return a.n === b.n && a.d === b.d; };
  const val = a => { a = of(a); return a.n / a.d; };
  const isInt = a => of(a).d === 1;
  function dec(s) { const m = /^(-?)(\d*)\.?(\d*)$/.exec(s); if (!m) return null; const f = m[3] || ''; return q((m[1] ? -1 : 1) * parseInt((m[2] || '0') + f, 10), Math.pow(10, f.length)); }
  // Text a student typed -> fraction, '' for blank, or null if it is not a number.
  function parse(s) {
    s = String(s == null ? '' : s).replace(/[−–—]/g, '-').replace(/\s+/g, '').replace(/^\+/, '');
    if (s === '') return '';
    if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');
    if (/^-?\d+(\.\d+)?$/.test(s) || /^-?\d*\.\d+$/.test(s)) return dec(s);
    const m = /^(-?)\(?(-?\d+)\)?\/\(?(-?\d+)\)?$/.exec(s);
    if (m) { const d = parseInt(m[3], 10); if (d === 0) return null; return q((m[1] ? -1 : 1) * parseInt(m[2], 10), d); }
    return null;
  }
  const str = a => { a = of(a); return (a.n < 0 ? '−' : '') + (a.d === 1 ? Math.abs(a.n) : Math.abs(a.n) + '/' + a.d); };
  let rand = Math.random;
  function seed(n) { let a = n >>> 0; rand = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rnd = (lo, hi) => lo + Math.floor(rand() * (hi - lo + 1));
  const pick = arr => arr[rnd(0, arr.length - 1)];
  const nz = (lo, hi) => { let k; do { k = rnd(lo, hi); } while (k === 0); return k; };
  const chance = p => rand() < p;
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  return { gcd, lcm, q, of, add, sub, mul, div, neg, eq, val, isInt, parse, str, seed, rnd, pick, nz, chance, shuffle };
})();
/* ===== DRILL KIT END ===== */

/* ===================== MODEL START (no DOM) ===================== */
const MODEL = (() => {
  const { rnd, pick, chance, shuffle } = Q;

  /* 7-1-01 biotic or abiotic (notes: soil is abiotic) */
  const BIOTIC = [
    ['Wolf', '🐺'], ['Aspen tree', '🌳'], ['Mushroom', '🍄'], ['Bacteria', '🦠'], ['Grass', '🌾'], ['Beaver', '🦫'],
    ['Great horned owl', '🦉'], ['Wood frog', '🐸'], ['Bull trout', '🐟'], ['White spruce', '🌲'], ['Bumblebee', '🐝'],
    ['Snowshoe hare', '🐇'], ['Mosquito', '🦟'], ['Earthworm', '🪱'], ['Wild rose', '🌹']
  ].map(([t, i]) => ({ t, i, a: 'bio' })).concat([
    ['Sunlight', '☀️'], ['Water', '💧'], ['Soil', '🟫'], ['Temperature', '🌡️'], ['Air', '💨'], ['Rock', '🪨'],
    ['Snow', '❄️'], ['Rain', '🌧️'], ['Wind', '🌬️'], ['Minerals', '💎']
  ].map(([t, i]) => ({ t, i, a: 'abio' })));
  const BIOTIC_CUES = { bio: 'It is alive: biotic', abio: 'Not alive: abiotic' };

  /* 7-1-02 producer, consumer or decomposer */
  const ROLE = [
    ['Grass', '🌾'], ['Aspen tree', '🌳'], ['White spruce', '🌲'], ['Wild rose', '🌹'], ['Willow', '🌿'], ['Saskatoon bush', '🫐']
  ].map(([t, i]) => ({ t, i, a: 'prod' })).concat([
    ['Snowshoe hare', '🐇'], ['Lynx', '🐈'], ['Wolf', '🐺'], ['Elk', '🦌'], ['Great horned owl', '🦉'], ['Grasshopper', '🦗'],
    ['Red fox', '🦊'], ['Golden eagle', '🦅'], ['Beaver', '🦫'], ['Black bear', '🐻'], ['Bull trout', '🐟']
  ].map(([t, i]) => ({ t, i, a: 'cons' }))).concat([
    ['Mushroom', '🍄'], ['Bacteria', '🦠'], ['Shelf fungus', '🍄'], ['Soil bacteria', '🦠'], ['Mould', '🦠']
  ].map(([t, i]) => ({ t, i, a: 'decomp' })));
  const ROLE_CUES = { prod: 'Makes its own food: producer', cons: 'Eats other living things: consumer', decomp: 'Breaks down dead things: decomposer' };

  /* 7-1-02 food chains, food first. Arrows mean "is eaten by". */
  const CHAINS = [
    [['Grass', '🌾'], ['Grasshopper', '🦗'], ['Meadowlark', '🐦'], ['Hawk', '🦅']],
    [['Grass', '🌾'], ['Grasshopper', '🦗'], ['Frog', '🐸'], ['Garter snake', '🐍']],
    [['Grass', '🌾'], ['Mouse', '🐭'], ['Garter snake', '🐍'], ['Great horned owl', '🦉']],
    [['Aspen', '🌳'], ['Snowshoe hare', '🐇'], ['Lynx', '🐈']],
    [['Grass', '🌾'], ['Deer', '🦌'], ['Wolf', '🐺']],
    [['Aspen', '🌳'], ['Beaver', '🦫'], ['Wolf', '🐺']],
    [['Pond algae', '🌿'], ['Insect larva', '🐛'], ['Trout', '🐟'], ['Osprey', '🦅']],
    [['Clover', '🍀'], ['Ground squirrel', '🐿️'], ['Ferruginous hawk', '🦅']],
    [['Willow', '🌿'], ['Snowshoe hare', '🐇'], ['Red fox', '🦊']]
  ];
  const LEVELS = ['prod', 'pri', 'sec', 'ter'];
  function genLevel() { const c = rnd(0, CHAINS.length - 1), k = rnd(0, CHAINS[c].length - 1); return { c, k, a: LEVELS[k] }; }
  function checkLevel(it, r) {
    if (r.v === it.a) return { ok: true };
    const p = LEVELS.indexOf(r.v);
    if (it.k === 0) return { code: 'prod', cue: 'Plants make food: producer' };
    if (p === it.k + 1) return { code: 'counted-producer', cue: 'The producer is not a consumer' };
    if (p === 0) return { code: 'not-prod', cue: 'It eats something: a consumer' };
    return { code: 'count', cue: 'Count the eaters from the producer' };
  }

  /* 7-1-02 which way does the arrow point? Food on the left half the time. */
  function genArrow() {
    const c = rnd(0, CHAINS.length - 1), k = rnd(0, CHAINS[c].length - 2), foodLeft = chance(.5);
    return { c, k, foodLeft, a: foodLeft ? 'r' : 'l' };
  }
  const checkArrow = (it, r) => r.v === it.a ? { ok: true } : { code: 'eats', cue: 'Arrow points to the eater' };

  /* 7-1-02 food web: remove one, what happens to a directly linked one? */
  const WEB = {
    nodes: { lynx: ['Lynx', '🐈'], owl: ['Owl', '🦉'], wolf: ['Wolf', '🐺'], fox: ['Fox', '🦊'],
      hare: ['Hare', '🐇'], moose: ['Moose', '🦌'], beaver: ['Beaver', '🦫'], mouse: ['Mouse', '🐭'],

const T_ENERGY = {
  id: 'energy', code: '7-1-02', name: '10% rule', sec: 3, q: 'Energy at the ? level', kind: 'slots',
  gen: MODEL.genEnergy, typeOf: it => 'steps' + (it.a - it.g),
  slots: () => ['=', { k: 'v', label: 'energy units', wide: true }, 'units'],
  check: MODEL.checkEnergy, answer: it => ({ v: Q.q(it.v) }),
  draw(A, it, V) {
    const fin = done(V), names = ['Producers', 'Primary consumers', 'Secondary consumers', 'Tertiary consumers'];
    const fmtN = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '), cx = 300, h = 74, yb = 392, w = [500, 380, 260, 140];
    for (let L = 0; L < 4; L++) {
      const y = yb - (L + 1) * h, wb = w[L], wt = L < 3 ? w[L + 1] : 40, show = fin || L === it.g, ask = L === it.a;
      A.el('polygon', { points: [[cx - wb / 2, y + h], [cx + wb / 2, y + h], [cx + wt / 2, y], [cx - wt / 2, y]].map(p => p.join(',')).join(' '), fill: ask ? (fin ? '#13301c' : '#262110') : C.panel, stroke: ask ? (fin ? C.green : C.yellow) : C.edge, 'stroke-width': ask ? 3 : 2 }, A.svg);
      A.tx(A.svg, cx, y + h / 2 - (L < 3 ? 12 : 0), show ? fmtN(L === it.a || fin ? it.base / Math.pow(10, L) : it.given) : ask ? '?' : '', { 'font-size': L < 3 ? 22 : 17, fill: ask ? (fin ? C.green : C.yellow) : C.text, class: fin && L !== it.g ? 'fade' : null });
      if (L < 3) A.tx(A.svg, cx, y + h / 2 + 14, names[L], { 'font-size': 13, fill: C.muted });
      else A.tx(A.svg, cx + 100, y + h / 2, names[L], { 'font-size': 13, fill: C.muted, 'text-anchor': 'start' });
    }
    if (V.phase === 'ask') return;
    for (let L = 0; L < 3; L++) {
      const y = yb - (L + 1) * h;
      A.tx(A.svg, cx + w[L] / 2 + 34, y + 2, '÷ 10', { 'font-size': 18, fill: C.gold, class: 'fade', 'text-anchor': 'start' });
      S.emo(A.svg, cx - w[L] / 2 - 26, y + 6, '🔥', 22, { class: 'fade' });
    }
    A.tx(A.svg, 18, 40, '🔥 about 90% lost as heat at each step', { 'font-size': 15, fill: C.muted, 'text-anchor': 'start', class: 'fade' });
  }
};

/* 7-1-03 which plot has more biodiversity */
const T_BIOD = {
  id: 'biodiv', code: '7-1-03', name: 'Biodiversity', sec: 4, q: 'More biodiversity?', kind: 'choice',
  gen: MODEL.genBio, typeOf: () => 'bio',
  choices: () => [{ v: 'A', label: 'A' }, { v: 'B', label: 'B' }],
  check: MODEL.checkBio, answer: it => ({ v: it.a }),
  draw(A, it, V) {
    const fin = done(V);
    [['A', it.A, it.nA, 165], ['B', it.B, it.nB, 475]].forEach(([nm, list, n, x]) => {
      const good = fin && nm === it.a;
      A.el('rect', { x: x - 140, y: 30, width: 280, height: 270, rx: 18, fill: good ? '#13301c' : C.panel, stroke: good ? C.green : C.edge, 'stroke-width': good ? 3 : 2 }, A.svg);
      A.tx(A.svg, x - 118, 54, nm, { 'font-size': 22, fill: C.muted });
      const cols = 4, rows = Math.ceil(list.length / cols);
      list.forEach((k, j) => S.emo(A.svg, x - 96 + (j % cols) * 64 + ((Math.floor(j / cols) % 2) * 14), 92 + Math.floor(j / cols) * (rows > 4 ? 46 : 56), k, 34));
      if (!fin) return;
      const kinds = [...new Set(list)];
      kinds.forEach((k, j) => S.emo(A.svg, x - (kinds.length - 1) * 19 + j * 38, 330, k, 28, { class: 'pop' }));
      A.tx(A.svg, x, 370, n + (n === 1 ? ' kind' : ' kinds') + ' · ' + list.length + ' living things', { 'font-size': 17, fill: good ? C.green : C.muted, class: 'fade' });
    });
    if (fin) A.tx(A.svg, 320, 402, 'Biodiversity counts kinds (species)', { 'font-size': 15, fill: C.muted, class: 'fade' });
  }
};
