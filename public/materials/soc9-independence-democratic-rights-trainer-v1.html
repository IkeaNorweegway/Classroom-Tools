<!-- =====================================================================
   INDEPENDENCE TRAINER (narrow trainer format, see _sims-context.md)
   Social Studies 9 | Canada's Independence and Democratic Rights | notes Sections 1–2.
   Used after the lesson: it does not teach, it points back to the notes. One narrow skill per tab, 10 items a round:
     §1 Balfour or Westminster?  the 1926 statement of equal status, or the 1931 law that made it binding
     §1 Why the change?          war exhaustion, Dominion pressure, or cooperation instead of force
     §1 Colony or nation?        who decides: Britain (a colony) or Canada (a sovereign nation)
     §2 Vote or office?          a right to vote, or a right to hold office (elected or appointed)
     §2 Persons Case             true or false about the 1929 case
     §1–2 Which came first?      two dated events from 1914 to 1960; a timeline places both
     §1–2 Words                  sovereignty, Dominion, foreign policy, suffrage, legal person, precedent
   Model: the notes' facts and dates, plus a few well-known Alberta firsts (1916 provincial vote, Louise McKinney 1917,
   Agnes Macphail 1921, Cairine Wilson 1930) to make the vote/office sort big enough.
   Named mistakes: the Persons Case read as winning the vote; Balfour and Westminster swapped; "women" treated as one
   group that won rights together; independence read as a single break with Britain.
   ?debug=1 puts DRILL (and MODEL) on window, turns off saving and motion.
   ===================================================================== -->

  .dots span { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--edge); }
  .dots span.now { border-color: var(--text); }
  .dots .g { background: var(--green); border-color: var(--green); }
  .dots .y { background: var(--yellow); border-color: var(--yellow); }
  .dots .r { background: var(--red); border-color: var(--red); }
  .done { text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: stretch; }

  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .7s ease-out forwards; }

  @media (max-width: 1150px) { .brand { display: none; } .app { grid-template-columns: minmax(0, 1fr) 330px; } .tab { padding: 2px 11px; } }

  @media (prefers-reduced-motion: reduce) {
    .draw { animation: none; stroke-dashoffset: 0; } .fade, .pop, .pulse { animation: none; }
  }

<script>
const DEBUG = /[?&]debug=1/.test(location.search);

/* ===== DRILL KIT START (no DOM): exact fractions and seeded random ===== */
const Q = (() => {
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);
  const q = (n, d) => { d = d == null ? 1 : d; if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return { n: n / g, d: d / g }; };
  const of = v => typeof v === 'number' ? (Number.isInteger(v) ? q(v) : dec(String(v))) : v;
  const add = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d + b.n * a.d, a.d * b.d); };
  const sub = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d - b.n * a.d, a.d * b.d); };
  const mul = (a, b) => { a = of(a); b = of(b); return q(a.n * b.n, a.d * b.d); };
  const div = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d, a.d * b.n); };
  const neg = a => { a = of(a); return q(-a.n, a.d); };
  const eq = (a, b) => { if (a == null || b == null) return false; a = of(a); b = of(b); return a.n === b.n && a.d === b.d; };
  const val = a => { a = of(a); return a.n / a.d; };
  const isInt = a => of(a).d === 1;
  function dec(s) { const m = /^(-?)(\d*)\.?(\d*)$/.exec(s); if (!m) return null; const f = m[3] || ''; return q((m[1] ? -1 : 1) * parseInt((m[2] || '0') + f, 10), Math.pow(10, f.length)); }
  // Text a student typed -> fraction, '' for blank, or null if it is not a number.
  function parse(s) {
    s = String(s == null ? '' : s).replace(/[−–—]/g, '-').replace(/\s+/g, '').replace(/^\+/, '');
    if (s === '') return '';
    if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');
    if (/^-?\d+(\.\d+)?$/.test(s) || /^-?\d*\.\d+$/.test(s)) return dec(s);
    const m = /^(-?)\(?(-?\d+)\)?\/\(?(-?\d+)\)?$/.exec(s);
    if (m) { const d = parseInt(m[3], 10); if (d === 0) return null; return q((m[1] ? -1 : 1) * parseInt(m[2], 10), d); }
    return null;
  }
  const str = a => { a = of(a); return (a.n < 0 ? '−' : '') + (a.d === 1 ? Math.abs(a.n) : Math.abs(a.n) + '/' + a.d); };
  let rand = Math.random;
  function seed(n) { let a = n >>> 0; rand = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rnd = (lo, hi) => lo + Math.floor(rand() * (hi - lo + 1));
  const pick = arr => arr[rnd(0, arr.length - 1)];
  const nz = (lo, hi) => { let k; do { k = rnd(lo, hi); } while (k === 0); return k; };
  const chance = p => rand() < p;
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  return { gcd, lcm, q, of, add, sub, mul, div, neg, eq, val, isInt, parse, str, seed, rnd, pick, nz, chance, shuffle };
})();
/* ===== DRILL KIT END ===== */

/* ===================== MODEL START (no DOM) ===================== */
const MODEL = (() => {
  const mk = (a, list) => list.map(([t, i, why]) => ({ t, i, a, why }));

  /* §1 Balfour Declaration (1926) or Statute of Westminster (1931) */
  const BW = mk('bal', [
    ['Said Britain and the Dominions are equal in status', '🤝'], ['Said no Dominion is under another', '⚖️'],
    ['Came first, in 1926', '1️⃣'], ['A statement, not yet a law', '💬'], ['Agreed at a conference of leaders in London', '🗣️']
  ]).concat(mk('wes', [
    ['Made equal status legally binding', '🔏'], ['Passed in 1931', '2️⃣'], ['A law passed by the British Parliament', '📜'],
    ['Made Canada a fully sovereign nation in law', '🍁'], ['Britain can no longer make laws for Canada on its own', '🚫']
  ]));
  const BW_CUES = { bal: '1926 statement: Balfour', wes: '1931 law: Westminster' };

  /* §1 the three forces behind the change */
  const WHY = mk('war', [
    ['Britain was worn out by the First World War', '😩'], ['Britain owed huge war debts', '💸'],
    ['Four years of war drained the empire', '⚔️'], ['Britain could not afford another fight', '🪙']
  ]).concat(mk('press', [
    ['Canada\'s prime minister demanded equal status', '📣'], ['Dominion leaders pushed hard at conferences', '🗣️'],
    ['Dominions asked to sign their own treaties', '✍️'], ['South Africa and Ireland pressed for more freedom', '🌍']
  ])).concat(mk('coop', [
    ['Britain kept influence by working with the Dominions', '🤝'], ['Partners by choice, not by force', '🕊️'],
    ['Better to share power than lose the Dominions', '🔗'], ['Friendly ties kept trade and loyalty going', '📦']
  ]));
  const WHY_CUES = { war: 'Tired from war: war exhaustion', press: 'Dominions pushed: diplomatic pressure', coop: 'Working together, not force' };

  /* §1 colony or sovereign nation: who decides? Pairs on the same decision. */
  const SOV = mk('col', [
    ['Britain declares war, so Canada is at war', '⚔️'], ['Britain signs treaties for Canada', '✍️'],
    ['A British law can override Canada\'s', '📜'], ['Canada needs London\'s OK for a trade deal', '📦'],
    ['Britain chooses Canada\'s allies', '🤝'], ['Britain speaks for Canada abroad', '🗣️']
  ]).concat(mk('nat', [
    ['Canada\'s Parliament decides on war', '🏛️'], ['Canada signs its own treaties', '🖊️'],
    ['Only Canada makes Canada\'s laws', '🍁'], ['Canada makes its own trade deals', '🚢'],
    ['Canada picks its own allies', '🌐'], ['Canada sends its own ambassadors', '🧳']
  ]));
  const SOV_CUES = { col: 'Britain decides: a colony', nat: 'Canada decides: sovereign nation' };

  /* §2 the vote or the right to hold office */
  const WON = mk('vote', [
    ['Most women win the federal vote (1918)', '🗳️'], ['Alberta women win the provincial vote (1916)', '🗳️'],
    ['Quebec women win the provincial vote (1940)', '🗳️'], ['First Nations vote federally, keeping status (1960)', '🗳️'],
    ['Chinese Canadians win the federal vote (1947)', '🗳️']
  ]).concat(mk('office', [
    ['The Persons Case (1929)', '⚖️', null], ['Women can be named to the Senate', '🏛️'],
    ['Cairine Wilson becomes the first woman senator (1930)', '🏛️'], ['Agnes Macphail elected the first woman MP (1921)', '🏛️'],
    ['Louise McKinney elected to Alberta\'s legislature (1917)', '🏛️']
  ]));
  WON.find(x => /Persons Case/.test(x.t)).cue = 'Persons Case: office, not voting';
  const WON_CUES = { vote: 'Choosing who governs: the vote', office: 'Serving in government: office' };

  /* §2 Persons Case: true or false */
  const PC = mk('t', [
    ['Five Alberta women brought the case', '👩'], ['It said women are legal persons', '⚖️'], ['It opened the Senate to women', '🏛️'],
    ['It was decided in 1929', '📅'], ['It set a precedent for equality', '📏'], ['Emily Murphy was one of the Famous Five', '✍️']
  ]).concat(mk('f', [
    ['It gave women the right to vote', '🗳️'], ['It gave every woman equal rights at once', '👥'],
    ['Women could already sit in the Senate before it', '🪑'], ['It came before women could vote federally', '⏪'],
    ['It reached Indigenous women right away', '⏩'], ['It was about Canada\'s independence from Britain', '🍁']
  ]));
  const PC_CUES = { t: 'True: check §2', f: 'False: check §2' };
  PC.find(x => /right to vote/.test(x.t)).cue = 'False: it was about office';
  PC.find(x => /before women could vote/.test(x.t)).cue = 'False: the vote came first';

  /* §1–2 timeline */
  const ORDER = [
    ['First World War begins', '⚔️', 1914], ['Alberta women win the provincial vote', '🗳️', 1916],
    ['Most women win the federal vote', '🗳️', 1918], ['Balfour Declaration', '🤝', 1926], ['Persons Case', '⚖️', 1929],
    ['Statute of Westminster', '📜', 1931], ['Newfoundland joins Canada', '🗺️', 1949],
    ['First Nations vote federally, keeping status', '🗳️', 1960]
  ].map(([t, i, y]) => ({ t, i, y, yl: String(y) }));

  /* §1–2 vocabulary */
  const TERMS = {

  const linkOf = () => tab.link ? Object.assign({}, tab, tab.link(item)) : tab;
  function setTab(id) {
    tab = PAGE.tabs.find(t => t.id === id) || PAGE.tabs[0];
    save.tab = tab.id; store(); marks = []; lastKey = '';
    tabsBar();

  function boot(P) {

    if (RM) document.body.classList.add('nomo');
    if (P.sans) document.body.classList.add('sans');

      fill: vals => { $('ans').querySelectorAll('.slot').forEach(inp => { inp.value = vals[inp.dataset.k] != null ? vals[inp.dataset.k] : ''; }); },

      keyOf: (it, t) => { const cur = tab; if (t) tab = t; try { return keyOf(it); } finally { tab = cur; } }, weights: () => Object.assign({}, scores()), resetWeights: () => { save.w[tab.id] = {}; }, setScore: (k, s) => { scores()[k] = s; } };

/* ===== SCIENCE KIT START (Science 7 narrow trainers only; needs DRILL) =====
   Icon + label + arrow pictures, not drawings of real objects (see the icon-flowchart rule in _sims-context.md).
     S.emo(p, x, y, icon, size, a)          an emoji icon
     S.lines(p, x, y, text, n, a)           text wrapped at n characters, centred on (x, y)
     S.card(p, o)                           an icon card {x, y, w, h, icon, label, col, fill, size, fs, n, cls}
     S.arrow(p, x1, y1, x2, y2, col, key)   a straight arrow; key = marker colour letter (Y yellow, N green, R red, …)
     S.curve(p, d, col, key)                an arrow along an SVG path
     S.sorter(A, it, V, cats, o)            the sorting picture: the item card on top, one bin per choice below;
                                            after the answer an arrow drops the card into its bin, and each bin shows
                                            what it means. cats: [{v, label, means, glyph(g, x, y)}]
     S.classTab(o)                          a whole tap-to-sort tab from a bank (S.sortGen, S.sortCheck) */
const S = (() => {
  const { C, el, tx } = DRILL;
  const done = V => V.phase === 'right' || V.phase === 'show';
  function emo(p, x, y, ch, size, a) { return tx(p, x, y, ch, Object.assign({ 'font-size': size || 48 }, a, { class: 'emo' + (a && a.class ? ' ' + a.class : '') })); }
  function wrap(s, n) {
    const out = []; let line = '';
    String(s).split(' ').forEach(w => { if (line && (line + ' ' + w).length > n) { out.push(line); line = w; } else line = line ? line + ' ' + w : w; });
    if (line) out.push(line); return out;
  }
  function lines(p, x, y, s, n, a) {
    const L = wrap(s, n || 22), fs = (a && a['font-size']) || 18, lh = fs * 1.22, g = el('g', { class: a && a.gcls || null }, p);
    L.forEach((l, i) => tx(g, x, y + (i - (L.length - 1) / 2) * lh, l, Object.assign({}, a, { gcls: null })));
    return g;
  }
  // Label lines sit at the bottom (o.lb padding); the icon is centred in the space above them.
  function card(p, o) {
    const g = el('g', { class: o.cls || null }, p), w = o.w || 150, h = o.h || 130, hasL = o.label != null && o.label !== '';
    el('rect', { x: o.x - w / 2, y: o.y - h / 2, width: w, height: h, rx: 16, fill: o.fill || C.panel, stroke: o.col || C.edge, 'stroke-width': o.sw || 2.5 }, g);
    const fs = o.fs || 17, n = o.n || Math.round(w / 9.5), L = hasL ? wrap(o.label, n).length : 0, lh = fs * 1.22;
    const labTop = hasL ? o.y + h / 2 - (o.lb || 12) - L * lh : o.y + h / 2, top = o.y - h / 2;
    if (o.icon) emo(g, o.x, (top + labTop) / 2 + 2, o.icon, Math.min(o.size || 999, (labTop - top) * .78, w * .6));
    if (hasL) lines(g, o.x, labTop + L * lh / 2, o.label, n, { 'font-size': fs, fill: o.tcol || C.text });
    return g;
  }
  function arrow(p, x1, y1, x2, y2, col, key, a) {
    return el('line', Object.assign({ x1, y1, x2, y2, stroke: col, 'stroke-width': 4, 'stroke-linecap': 'round', 'marker-end': 'url(#a' + (key || 'W') + ')' }, a), p);
  }
  function curve(p, d, col, key, a) {
    return el('path', Object.assign({ d, stroke: col, 'stroke-width': 4, fill: 'none', 'stroke-linecap': 'round', 'marker-end': 'url(#a' + (key || 'W') + ')' }, a), p);
  }
  // A small pill label with a dark backing, for notes on a picture.
  function chip(p, x, y, s, col, a) {
    const g = el('g', { class: a && a.cls || null }, p), fs = (a && a.fs) || 16, w = String(s).length * fs * .56 + 22;
    el('rect', { x: x - w / 2, y: y - fs * .9, width: w, height: fs * 1.8, rx: fs * .9, fill: C.stage, stroke: col, 'stroke-width': 2 }, g);
    tx(g, x, y, s, { 'font-size': fs, fill: col });
    return g;
  }

  function sorter(A, it, V, cats, o) {
    o = o || {};
    const n = cats.length, by = o.by || 335, bh = o.bh || 118, gap = 14, bw = Math.min(190, (600 - gap * (n - 1)) / n);
    const span = n * bw + (n - 1) * gap, bx = i => 320 - span / 2 + bw / 2 + i * (bw + gap);
    const fin = done(V), ai = cats.findIndex(c => c.v === it.a), pi = cats.findIndex(c => c.v === (V.resp && V.resp.v));
    cats.forEach((c, i) => {
      const x = bx(i), good = fin && i === ai, bad = fin && i === pi && pi !== ai, g = el('g', {}, A.svg);
      el('rect', { x: x - bw / 2, y: by - bh / 2, width: bw, height: bh, rx: 16, fill: good ? '#13301c' : bad ? '#331417' : C.panel, stroke: good ? C.green : bad ? C.red : C.edge, 'stroke-width': good || bad ? 3 : 2, 'stroke-dasharray': good || bad ? null : '7 6' }, g);
      const lab = lines(g, x, fin && c.means ? by - bh / 2 + 26 : by, c.label, Math.round(bw / 10.5), { 'font-size': n > 3 ? 17 : 19, fill: good ? C.green : bad ? '#ff9a90' : C.text });
      if (fin && c.means) lines(g, x, by + 22, c.means, Math.round(bw / 8.5), { 'font-size': 14.5, fill: good ? C.text : C.muted, gcls: 'fade' });
      if (fin && good && c.glyph) c.glyph(g, x, by + bh / 2 + 4);
    });
    const cw = o.cw || 320, ch = o.ch || 156, cy = o.cy || 108;
    card(A.svg, { x: 320, y: cy, w: cw, h: ch, icon: it.i, label: it.t, size: o.size || 64, fs: o.fs || 21, n: o.n || 26, col: fin ? (pi === ai || V.phase === 'show' && pi < 0 ? C.green : C.edge) : C.yellow, sw: 3, lb: 16 });
    if (fin && it.why) chip(A.svg, 320, cy + ch / 2 + 24, it.why, C.green, { cls: 'pop', fs: 15 });
    if (!fin) return;
    const y0 = cy + ch / 2 + (it.why ? 44 : 8), y1 = by - bh / 2 - 8;
    if (pi >= 0 && pi !== ai) arrow(A.svg, 320 + (bx(pi) - 320) * .25, y0, bx(pi), y1, C.red, 'R', { 'stroke-dasharray': '6 6', 'stroke-width': 3, class: 'fade' });
    arrow(A.svg, 320 + (bx(ai) - 320) * .25, y0, bx(ai), y1, C.green, 'N', { class: 'draw', pathLength: 1 });
  }

  // Bank items: {t: label, i: icon, a: answer, why?: note shown after, cue?: own cue}. No DOM.
  // Each answer comes up equally often, whatever the bank sizes.
  const sortGen = bank => { const a = Q.pick([...new Set(bank.map(b => b.a))]); return Object.assign({}, Q.pick(bank.filter(b => b.a === a))); };
  const sortCheck = (it, r, cues) => r.v === it.a ? { ok: true } : { code: 'is-' + it.a, cue: it.cue || (cues && cues[it.a]) || 'Not quite' };

  // A tap-to-sort tab. o: {id, code, name, sec, q, cats, bank, cues, cols, pic} — the bank and cues come from MODEL.
  function classTab(o) {
    return {
      id: o.id, code: o.code, name: o.name, sec: o.sec, q: o.q, kind: 'choice', cols: o.cols,
      typeOf: it => it.t,  // a missed item comes back more often
      gen: () => sortGen(o.bank),
      choices: () => o.cats.map(c => ({ v: c.v, label: c.label })),
      check: (it, r) => sortCheck(it, r, o.cues), answer: it => ({ v: it.a }),
      draw(A, it, V) { sorter(A, it, V, o.cats, o.pic); }
    };
  }
  return { emo, wrap, lines, card, arrow, curve, chip, sorter, classTab, sortGen, sortCheck, done };
})();
/* ===== SCIENCE KIT END ===== */

/* ===== SOCIAL KIT START (Social 9 narrow trainers only; needs DRILL and the science kit S) =====
   Three more tab types, all tap choices (one try):
     S.orderTab(o)  "Which came first?" Two dated event cards; after the answer a timeline places both.
                    o: {id, code, name, sec, bank: [{t, i, y, yl}]}  y = a sortable number (1939.67), yl = the label shown
     S.pickTab(o)   One card and o.n term choices (default 3) drawn from a longer term list, so the choices change.
                    The bins show what each term means after the answer.
                    o: {id, code, name, sec, q, terms: {v: {label, means, cue}}, bank: [{t, i, a, why?}], pic?}
     S.chainTab(o)  A chain (or a loop) of steps with one blank: pick the missing step from three.
                    o: {id, code, name, sec, q, steps: [{t, i}], loop?} */
(() => {
  const { C, el, tx } = DRILL, done = S.done;

  /* ---- Which came first? ---- */
  function orderTab(o) {
    const B = o.bank;
    return {
      id: o.id, code: o.code, name: o.name, sec: o.sec, q: o.q || 'Which came first?', kind: 'choice', order: B,
      typeOf: it => B[it.first].t,
      gen() {
        let a, b;
        do { a = Q.rnd(0, B.length - 1); b = Q.rnd(0, B.length - 1); } while (a === b || B[a].y === B[b].y);
        const first = B[a].y < B[b].y ? a : b, left = Q.chance(.5) ? a : b, right = left === a ? b : a;
        return { L: left, R: right, first, a: first === left ? 'L' : 'R' };
      },
      choices: it => [{ v: 'L', label: B[it.L].t }, { v: 'R', label: B[it.R].t }],
      check: (it, r) => r.v === it.a ? { ok: true }
        : { code: 'order', cue: B[it.first].yl + ' comes before ' + B[it.first === it.L ? it.R : it.L].yl },
      answer: it => ({ v: it.a }),
      draw(A, it, V) {
        const fin = done(V), cards = [[it.L, 165], [it.R, 475]];
        cards.forEach(([k, x]) => {
          const good = fin && k === it.first;
          S.card(A.svg, { x, y: 130, w: 270, h: 190, icon: B[k].i, label: B[k].t, size: 64, fs: 19, n: 24, lb: 16, col: good ? C.green : fin ? C.edge : C.text, sw: good ? 3.5 : 2.5 });
        });
        if (!fin) { A.tx(A.svg, 320, 130, '?', { 'font-size': 44, fill: C.yellow }); return; }
        // The timeline: both years placed to scale, a little padding either side.
        const y1 = B[it.first].y, y2 = B[it.first === it.L ? it.R : it.L].y, pad = Math.max(2, (y2 - y1) * .25);
        const lo = y1 - pad, hi = y2 + pad, X = y => 70 + (y - lo) / (hi - lo) * 500, ly = 330;
        S.arrow(A.svg, 50, ly, 600, ly, C.muted, 'M', { 'stroke-width': 3, class: 'fade' });
        A.tx(A.svg, 608, ly + 26, 'time', { 'font-size': 14, fill: C.muted, 'text-anchor': 'end', class: 'fade' });
        const close = Math.abs(X(y2) - X(y1)) < 130;  // same month: stack the later label lower
        cards.forEach(([k, x]) => {
          const px = X(B[k].y), good = k === it.first;
          el('line', { x1: x, y1: 228, x2: px, y2: ly - 10, stroke: good ? C.green : C.muted, 'stroke-width': 2, 'stroke-dasharray': '5 6', class: 'fade' }, A.svg);
          el('circle', { cx: px, cy: ly, r: 9, fill: good ? C.green : C.muted, class: 'pop' }, A.svg);
          A.tx(A.svg, px + (close ? (good ? -40 : 40) : 0), ly + (close && !good ? 58 : 32), B[k].yl, { 'font-size': 19, fill: good ? C.green : C.text, class: 'fade' });
        });
        S.chip(A.svg, X(y1), ly - 42, '1st', C.green, { cls: 'pop', fs: 15 });
      }
    };
  }

  /* ---- Pick the term ---- */
  function pickTab(o) {
    const T = o.terms, keys = Object.keys(T), n = o.n || 3;
    const cues = {}; keys.forEach(k => { cues[k] = T[k].cue || 'This is ' + T[k].label.toLowerCase(); });
    return {
      id: o.id, code: o.code, name: o.name, sec: o.sec, q: o.q, kind: 'choice', cols: o.cols, pick: true,
      typeOf: it => it.t,
      gen() {
        const it = S.sortGen(o.bank), others = Q.shuffle(keys.filter(k => k !== it.a)).slice(0, n - 1);
        it.opts = Q.shuffle([it.a].concat(others));
        return it;
      },
      choices: it => it.opts.map(v => ({ v, label: T[v].label })),
      check: (it, r) => S.sortCheck(it, r, cues), answer: it => ({ v: it.a }),
      draw(A, it, V) { S.sorter(A, it, V, it.opts.map(v => ({ v, label: T[v].label, means: T[v].means })), o.pic); }
    };
  }

  /* ---- Missing step in a chain or loop ---- */
  function chainPos(n, loop) {
    if (loop) return Array.from({ length: n }, (_, k) => { const a = -Math.PI / 2 + k * 2 * Math.PI / n; return [320 + 225 * Math.cos(a), 200 + 135 * Math.sin(a)]; });
    if (n <= 4) { const w = 150, gap = (600 - n * w) / Math.max(1, n - 1), x0 = 20 + w / 2; return Array.from({ length: n }, (_, k) => [x0 + k * (w + gap), 205]); }
    const top = Math.ceil(n / 2), bot = n - top, step = 560 / top, out = [];
    for (let k = 0; k < top; k++) out.push([50 + step / 2 + k * step, 110]);
    for (let k = 0; k < bot; k++) out.push([50 + step / 2 + (top - 1 - k) * step - (top === bot ? 0 : step / 2), 305]);
    return out;
  }
  function chainTab(o) {
    const St = o.steps, n = St.length;
    return {
      id: o.id, code: o.code, name: o.name, sec: o.sec, q: o.q || 'The missing step', kind: 'choice',
      typeOf: it => 'k' + it.k,
      gen() {
        const k = Q.rnd(0, n - 1), others = Q.shuffle(St.map((_, j) => j).filter(j => j !== k)).slice(0, 2);
        return { k, opts: Q.shuffle([k].concat(others)), a: String(k) };
      },
      choices: it => it.opts.map(j => ({ v: String(j), label: St[j].t })),
      check: (it, r) => {
        if (r.v === it.a) return { ok: true };
        const j = +r.v, d = j - it.k;
        if (!o.loop && d > 0) return { code: 'later', cue: 'That step comes later' };
        if (!o.loop && d < 0) return { code: 'earlier', cue: 'That step came earlier' };
        return { code: 'loop', cue: 'Follow the arrows round' };
      },
      answer: it => ({ v: it.a }),
      draw(A, it, V) {
        const fin = done(V), P = chainPos(n, o.loop), w = o.loop ? 160 : n <= 4 ? 150 : Math.min(150, 560 / Math.ceil(n / 2) - 22), h = o.loop ? 92 : 120;
        const edge = (a, b) => {
          const [x1, y1] = P[a], [x2, y2] = P[b], dx = x2 - x1, dy = y2 - y1;
          // Leave from the card edge, not the centre.
          const cut = (ddx, ddy) => { const sx = Math.abs(ddx) > 1e-6 ? (w / 2 + 6) / Math.abs(ddx) : 1e9, sy = Math.abs(ddy) > 1e-6 ? (h / 2 + 6) / Math.abs(ddy) : 1e9; return Math.min(sx, sy); };
          const c = cut(dx, dy);
          S.arrow(A.svg, x1 + dx * c, y1 + dy * c, x2 - dx * c, y2 - dy * c, C.muted, 'M', { 'stroke-width': 3 });
        };
        for (let k = 0; k < n - 1; k++) edge(k, k + 1);
        if (o.loop) edge(n - 1, 0);
        St.forEach((s, k) => {
          const blank = k === it.k, [x, y] = P[k];
          if (blank && !fin) {
            el('rect', { x: x - w / 2, y: y - h / 2, width: w, height: h, rx: 16, fill: '#262110', stroke: C.yellow, 'stroke-width': 3, 'stroke-dasharray': '8 6' }, A.svg);
            A.tx(A.svg, x, y, '?', { 'font-size': 40, fill: C.yellow });
          } else S.card(A.svg, { x, y, w, h, icon: s.i, label: s.t, size: 34, fs: 14.5, n: Math.round(w / 8.4), lb: 8, col: blank ? C.green : C.edge, sw: blank ? 3.5 : 2, cls: blank ? 'pop' : null });
          if (!o.loop) A.tx(A.svg, x - w / 2 + 14, y - h / 2 + 14, String(k + 1), { 'font-size': 13, fill: blank ? (fin ? C.green : C.yellow) : C.muted });
        });
        if (o.loop && o.hub) A.tx(A.svg, 320, 200, o.hub, { 'font-size': 16, fill: C.muted });
      }
    };
  }

  Object.assign(S, { orderTab, pickTab, chainTab });
})();
/* ===== SOCIAL KIT END ===== */
