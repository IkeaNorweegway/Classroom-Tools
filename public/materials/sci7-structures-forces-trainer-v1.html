<!-- =====================================================================
   STRUCTURES TRAINER (narrow trainer format, see _sims-context.md)
   Science 7 | Structures and Forces | LO 7-4-01 to 7-4-04. Used after the lesson: it does not teach,
   it points back to the notes (Sections 1–5). One narrow skill per tab, 10 items a round:
     7-4-01 Type         solid, frame or shell
     7-4-02 Load         dead, live or dynamic (snow is left out: the notes call it both live and dead)
     7-4-02 Forces       compression, tension, shear or torsion, from an arrow picture or an example
     7-4-02 Beam         a loaded beam: top squeezed (compression), bottom stretched (tension); where concrete cracks, where rebar goes
     7-4-03 Stable?      two blocks with the centre of gravity marked: the larger tipping angle is more stable
     7-4-04 Lever class  what is in the middle: fulcrum (1st), load (2nd), effort (3rd)
     7-4-04 MA           type load ÷ effort; the fulcrum is drawn where effort arm ÷ load arm = MA
     7-4-04 Machines     lever, wheel and axle, pulley, inclined plane, wedge or screw
   Model: the blocks are uniform, so the CoG is exact; tipping angle = atan(half the base ÷ CoG height).
   Not covered here: Section 6 (materials) needs reading and stays on paper.
   Named mistakes: compression and tension mixed up, MA upside down, MA by subtracting, a heavy-looking or wide-topped
   block judged stable, a screwdriver called a screw.
   ?debug=1 puts DRILL (and MODEL) on window, turns off saving and motion.
   ===================================================================== -->
<style>
/* ===== DRILL SHELL CSS START (same in every narrow trainer; see _sims-context.md "Narrow trainer format") ===== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  :root {
    --bg: #070a10; --panel: #0f1520; --panel2: #151d2b; --stage: #0b0f17; --edge: #263246;
    --text: #f5f7fb; --muted: #a7b4c8;
    --blue: #58c4dd; --yellow: #f7d96f; --teal: #5cd0b3; --gold: #f0ac5f; --green: #83c167; --red: #fc6255; --pink: #ef7fc6;
    --math: 'Cambria Math', 'STIX Two Math', 'Latin Modern Math', Cambria, Georgia, serif;
  }
  html, body { height: 100%; }
  body { font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; font-size: 16px; line-height: 1.4; color: var(--text); background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .35; }
  :focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .math { font-family: var(--math); }
  .math i { font-style: italic; }
  .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .72em; line-height: 1.05; margin: 0 .1em; }
  .fr > span:first-child { border-bottom: .07em solid currentColor; padding: 0 .12em; }
  .cM { color: var(--gold); } .cB { color: var(--teal); } .cY { color: var(--yellow); } .cR { color: var(--red); } .cBl { color: var(--blue); }

  /* top bar: name, concept tabs, notes link */
  .top { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--edge); flex-shrink: 0; }
  .brand { display: flex; flex-direction: column; line-height: 1.15; flex-shrink: 0; }
  .brand small { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); }
  .brand b { font-size: 17px; font-weight: 650; }
  .tabs { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; justify-content: center; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex-shrink: 0; min-height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px 14px; border: 1px solid var(--edge); border-radius: 12px; background: var(--panel2); font-weight: 650; font-size: 15px; line-height: 1.1; color: var(--muted); position: relative; }
  .tab small { font-size: 10px; font-weight: 700; letter-spacing: .08em; opacity: .75; }
  .tab:hover { border-color: var(--blue); color: var(--text); }
  .tab[aria-selected="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
  .tab .star { position: absolute; top: 4px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  .notes { flex-shrink: 0; min-height: 46px; display: flex; align-items: center; gap: 6px; padding: 4px 12px; border: 1px solid var(--edge); border-radius: 12px; background: var(--panel2); color: var(--gold); font-weight: 700; text-decoration: none; }
  .notes:hover { border-color: var(--gold); }
  .notes svg { width: 20px; height: 20px; }

  /* picture on the left, one answer area on the right */
  .app { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
  .stage { min-width: 0; min-height: 0; padding: 12px; display: flex; }
  .stage svg { flex: 1; min-width: 0; width: 100%; height: 100%; display: block; background: var(--stage); border: 1px solid var(--edge); border-radius: 18px; touch-action: manipulation; }
  .stage svg text { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 600; paint-order: stroke; stroke: var(--stage); stroke-width: 5px; stroke-linejoin: round; }
  .stage svg text.m { font-family: var(--math); font-weight: 400; }
  .stage svg .hit { cursor: pointer; }
  .stage svg text.emo { stroke: none; font-family: 'Segoe UI Emoji', 'Noto Color Emoji', 'Apple Color Emoji', sans-serif; font-weight: 400; }
  .sans .prompt { font-family: inherit; font-weight: 650; font-size: 26px; }
  .sans .choice { font-size: 19px; line-height: 1.15; padding: 4px 8px; }
  .side { min-height: 0; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--edge); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .q { font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--yellow); text-align: center; }
  .prompt { font-family: var(--math); font-size: 34px; line-height: 1.25; text-align: center; min-height: 44px; }
  .prompt:empty { display: none; }
  .ans { display: flex; flex-direction: column; gap: 10px; }
  .slots { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; font-family: var(--math); font-size: 30px; }
  .slot { width: 2.7em; min-height: 56px; text-align: center; background: var(--stage); border: 2px solid var(--edge); border-radius: 12px; font-family: var(--math); font-size: 28px; padding: 2px 4px; }
  .slot.wide { width: 3.6em; }
  .slot.n { width: 2.1em; font-size: 26px; }
  .slot.sup { width: 1.9em; min-height: 40px; font-size: 20px; align-self: flex-start; margin-left: -2px; }
  .slots:has(.slot.n) { font-size: 26px; gap: 4px; }
  .slot.tM { border-color: #7a5a33; } .slot.tB { border-color: #2f6a5d; }
  .slot:focus { border-color: var(--yellow); outline: none; box-shadow: 0 0 0 3px rgba(247, 217, 111, .25); }
  .slot.ok { border-color: var(--green); color: var(--green); }
  .slot.bad { border-color: var(--red); }
  .slot.shown { border-color: var(--muted); color: var(--muted); }
  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; }
  .choices.two { grid-template-columns: 1fr 1fr; }
  .choices.three { grid-template-columns: repeat(3, 1fr); }
  .choices.one { grid-template-columns: 1fr; gap: 8px; }
  .choices.one .choice { min-height: 54px; }
  .choices.one .choice.math { font-size: 26px; }
  .choice { min-height: 68px; border: 2px solid var(--edge); border-radius: 14px; background: var(--panel2); font-size: 20px; font-weight: 650; }
  .choice.math { font-family: var(--math); font-size: 36px; font-weight: 400; }
  .choice:hover:not(:disabled) { border-color: var(--blue); }
  .choice.ok { border-color: var(--green); background: #13301c; color: var(--green); opacity: 1; }
  .choice.bad { border-color: var(--red); background: #331417; opacity: 1; }
  .seg { display: flex; gap: 8px; justify-content: center; }
  .seg button { min-width: 72px; min-height: 56px; border: 2px solid var(--edge); border-radius: 14px; background: var(--panel2); font-size: 26px; }
  .seg button[aria-pressed="true"] { border-color: var(--yellow); color: var(--yellow); background: #262110; }
  .acts { display: flex; gap: 8px; }
  .btn { min-height: 52px; border: 1px solid var(--edge); background: var(--panel2); border-radius: 12px; padding: 6px 16px; font-size: 17px; font-weight: 650; }
  .btn:hover:not(:disabled) { border-color: var(--blue); }
  .btn.primary { flex: 1; background: var(--blue); border-color: var(--blue); color: #04121a; }
  .btn.primary:hover:not(:disabled) { background: #7fd3e7; }
  .btn.go { background: var(--green); border-color: var(--green); color: #0b1a06; }
  .btn.icon { width: 56px; padding: 0; display: grid; place-items: center; color: var(--muted); }
  .btn.icon svg { width: 24px; height: 24px; }
  .fb { display: flex; align-items: center; gap: 10px; min-height: 54px; font-size: 17px; font-weight: 600; }
  .fb .mark { font-size: 32px; font-weight: 800; width: 38px; text-align: center; flex-shrink: 0; }
  .fb.ok { color: var(--green); } .fb.bad { color: #ff9a90; } .fb.info { color: var(--muted); }
  .dots { display: flex; gap: 7px; justify-content: center; margin-top: auto; padding-top: 4px; }
  .dots span { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--edge); }
  .dots span.now { border-color: var(--text); }
  .dots .g { background: var(--green); border-color: var(--green); }
  .dots .y { background: var(--yellow); border-color: var(--yellow); }
  .dots .r { background: var(--red); border-color: var(--red); }
  .done { text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
  .done .score { font-family: var(--math); font-size: 64px; line-height: 1; }
  .done .score small { font-size: 30px; color: var(--muted); }
  .keypad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .keypad button { min-height: 46px; border: 1px solid var(--edge); border-radius: 10px; background: var(--stage); font-family: var(--math); font-size: 22px; }

  /* motion: lines draw themselves in, marks fade or pop in */
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .7s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .fade { animation: fade .45s ease-out both; }
  @keyframes fade { from { opacity: 0; } }
  .pop { transform-box: fill-box; transform-origin: center; animation: pop .4s cubic-bezier(.3, 1.6, .6, 1) both; }
  @keyframes pop { from { opacity: 0; transform: scale(.3); } }
  .pulse { animation: pulse 1.2s ease-in-out 2; }
  @keyframes pulse { 50% { opacity: .35; } }
  .nomo .draw { animation: none; stroke-dashoffset: 0; }
  .nomo .fade, .nomo .pop, .nomo .pulse { animation: none; }

  @media (max-width: 1150px) { .brand { display: none; } .app { grid-template-columns: minmax(0, 1fr) 330px; } .tab { padding: 2px 11px; } }
  @media (max-height: 700px) {
    .top { padding: 5px 12px; } .tab, .notes { min-height: 42px; }
    .stage { padding: 8px; } .side { padding: 12px 14px; gap: 10px; }
    .prompt { font-size: 30px; } .slot { min-height: 50px; } .choice { min-height: 58px; } .btn { min-height: 48px; } .fb { min-height: 46px; }
  }
  @media (max-width: 760px) {
    html, body { height: auto; } body { overflow: auto; display: block; }
    .top { flex-wrap: wrap; } .tabs { order: 3; flex-basis: 100%; justify-content: flex-start; } .notes { margin-left: auto; }
    .app { display: block; }
    .stage { height: 52vh; min-height: 260px; }
    .side { border-left: none; border-top: 1px solid var(--edge); overflow: visible; }
  }
  @media (prefers-reduced-motion: reduce) {
    .draw { animation: none; stroke-dashoffset: 0; } .fade, .pop, .pulse { animation: none; }
  }
/* ===== DRILL SHELL CSS END ===== */
</style>

<body>

<header class="top">
  <div class="brand"><small id="course"></small><b id="title"></b></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Skills"></nav>
  <a class="notes" id="notes" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg><span id="notesTxt"></span></a>
</header>

<div class="app">
  <section class="stage" id="stageWrap"><svg id="svg" viewBox="0 0 640 420" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Picture for this question"></svg></section>
  <aside class="side" id="side">
    <div id="askBox">
      <div class="q" id="q"></div>
      <div class="prompt" id="prompt"></div>
    </div>
    <div class="ans" id="ans"></div>
    <div class="acts" id="acts">
      <button type="button" class="btn primary" id="bCheck">Check</button>
      <button type="button" class="btn icon" id="bShow" aria-label="Show me" title="Show me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>

  </aside>
</div>

<script>
const DEBUG = /[?&]debug=1/.test(location.search);

/* ===== DRILL KIT START (no DOM): exact fractions and seeded random ===== */
const Q = (() => {
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);
  const q = (n, d) => { d = d == null ? 1 : d; if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return { n: n / g, d: d / g }; };
  const of = v => typeof v === 'number' ? (Number.isInteger(v) ? q(v) : dec(String(v))) : v;
  const add = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d + b.n * a.d, a.d * b.d); };
  const sub = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d - b.n * a.d, a.d * b.d); };
  const mul = (a, b) => { a = of(a); b = of(b); return q(a.n * b.n, a.d * b.d); };
  const div = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d, a.d * b.n); };
  const neg = a => { a = of(a); return q(-a.n, a.d); };
  const eq = (a, b) => { if (a == null || b == null) return false; a = of(a); b = of(b); return a.n === b.n && a.d === b.d; };
  const val = a => { a = of(a); return a.n / a.d; };
  const isInt = a => of(a).d === 1;
  function dec(s) { const m = /^(-?)(\d*)\.?(\d*)$/.exec(s); if (!m) return null; const f = m[3] || ''; return q((m[1] ? -1 : 1) * parseInt((m[2] || '0') + f, 10), Math.pow(10, f.length)); }
  // Text a student typed -> fraction, '' for blank, or null if it is not a number.
  function parse(s) {
    s = String(s == null ? '' : s).replace(/[−–—]/g, '-').replace(/\s+/g, '').replace(/^\+/, '');
    if (s === '') return '';
    if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');
    if (/^-?\d+(\.\d+)?$/.test(s) || /^-?\d*\.\d+$/.test(s)) return dec(s);
    const m = /^(-?)\(?(-?\d+)\)?\/\(?(-?\d+)\)?$/.exec(s);
    if (m) { const d = parseInt(m[3], 10); if (d === 0) return null; return q((m[1] ? -1 : 1) * parseInt(m[2], 10), d); }
    return null;
  }
  const str = a => { a = of(a); return (a.n < 0 ? '−' : '') + (a.d === 1 ? Math.abs(a.n) : Math.abs(a.n) + '/' + a.d); };
  let rand = Math.random;
  function seed(n) { let a = n >>> 0; rand = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rnd = (lo, hi) => lo + Math.floor(rand() * (hi - lo + 1));
  const pick = arr => arr[rnd(0, arr.length - 1)];
  const nz = (lo, hi) => { let k; do { k = rnd(lo, hi); } while (k === 0); return k; };
  const chance = p => rand() < p;
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  return { gcd, lcm, q, of, add, sub, mul, div, neg, eq, val, isInt, parse, str, seed, rnd, pick, nz, chance, shuffle };
})();
/* ===== DRILL KIT END ===== */

/* ===================== MODEL START (no DOM) ===================== */
const MODEL = (() => {
  const { rnd, pick, chance, shuffle } = Q;
  const four = (all, ans) => { const o = shuffle(all.filter(x => x !== ans)).slice(0, 3); return all.filter(x => x === ans || o.includes(x)); };

  /* 7-4-01 solid, frame or shell */
  const TYPE = [
    ['A brick', '🧱'], ['A concrete dam', '⬛'], ['A tree trunk', '🪵'], ['A stone statue', '🗿'], ['A block of ice', '🧊']
  ].map(([t, i]) => ({ t, i, a: 'solid' })).concat([
    ['A bicycle', '🚲'], ['A building frame', '🏗️'], ['A spider web', '🕸️'], ['A ladder', '🪜'], ['A transmission tower', '🗼'], ['The Lethbridge Viaduct', '🌉']
  ].map(([t, i]) => ({ t, i, a: 'frame' }))).concat([
    ['An egg', '🥚'], ['A bike helmet', '⛑️'], ['An oil storage tank', '🛢️'], ['A pop can', '🥫'], ['A turtle shell', '🐢'], ['A canoe', '🛶']
  ].map(([t, i]) => ({ t, i, a: 'shell' })));
  const TYPE_CUE = { solid: 'Solid all through: solid', frame: 'Connected parts, open spaces: frame', shell: 'Thin curved surface: shell' };

  /* 7-4-02 dead, live or dynamic load (snow is left out: the notes call it both) */
  const LOAD = [
    ['The steel and concrete of a bridge', '🌉'], ["A roof's own beams and shingles", '🏠'], ['The weight of the bleachers themselves', '🏟️'],
    ["A tower's own weight", '🗼'], ['The bricks of a wall', '🧱']
  ].map(([t, i]) => ({ t, i, a: 'dead' })).concat([
    ['People sitting in the bleachers', '👥'], ['Books on a shelf', '📚'], ['Furniture in a house', '🛋️'], ['Cars parked on a bridge', '🚗'],
    ['Water filling a tank', '💧'], ['Grain inside a grain elevator', '🌾']
  ].map(([t, i]) => ({ t, i, a: 'live' }))).concat([
    ['A wind gust hits a tower', '🌬️'], ['An earthquake shakes a building', '🏚️'], ['Moving traffic on a bridge', '🚚'],
    ['Fans jumping in a stadium', '🙌'], ['A chinook gust rocks a sign', '💨']
  ].map(([t, i]) => ({ t, i, a: 'dyn' })));
  const LOAD_CUE = { dead: "The structure's own weight: dead", live: 'What it holds: live load', dyn: 'Sudden or changing: dynamic' };

  /* 7-4-02 internal forces: from an arrow picture or an example */
  const FORCES = ['comp', 'tens', 'shear', 'tors'];
  const FORCE_NAME = { comp: 'Compression', tens: 'Tension', shear: 'Shear', tors: 'Torsion' };
  const FORCE_EX = {
    comp: [['A column holding up a roof', '🏛️'], ['Chair legs under a person', '🪑'], ['Squeezing a sponge', '🧽'], ['The bottom bricks of a wall', '🧱']],
    tens: [['A rope in tug-of-war', '🪢'], ['A suspension bridge cable', '🌉'], ['A stretched rubber band', '➰'], ['A guitar string', '🎸']],
    shear: [['Scissors cutting paper', '✂️'], ['A bolt holding two plates', '🔩'], ['A hole punch cutting paper', '📄'], ['Tearing a sheet of paper', '📃']],
    tors: [['Wringing out a towel', '🧺'], ['Turning a screwdriver', '🪛'], ['Twisting a bottle cap', '🍾'], ['Turning a key', '🔑']]
  };
  const FORCE_CUE = { comp: 'Squeezed together: compression', tens: 'Pulled apart: tension', shear: 'Sliding opposite ways: shear', tors: 'Twisted: torsion' };
  function genForce() { const a = pick(FORCES); if (chance(.45)) return { form: 'arrows', a, flip: chance(.5) }; const [t, i] = pick(FORCE_EX[a]); return { form: 'example', a, t, i }; }
  const checkForce = (it, r) => r.v === it.a ? { ok: true } : { code: 'is-' + it.a, cue: FORCE_CUE[it.a] };

  /* 7-4-02 a beam on two supports: compression on top, tension underneath */
  const BEAMS = ['Wooden shelf', 'Plank bridge', 'Concrete beam', 'Steel beam'];
  function genBeam() {
    const form = pick(['squeezed', 'squeezed', 'stretched', 'crack', 'rebar']);
    return { form, beam: form === 'crack' || form === 'rebar' ? 'Concrete beam' : pick(BEAMS), off: rnd(-60, 60), a: form === 'squeezed' ? 'top' : 'bottom' };
  }
  function checkBeam(it, r) {
    if (r.v === it.a) return { ok: true };
    if (it.form === 'squeezed') return { code: 'top', cue: 'Top is squeezed: compression' };
    if (it.form === 'stretched') return { code: 'bottom', cue: 'Bottom is stretched: tension' };
    if (it.form === 'crack') return { code: 'crack', cue: 'Concrete cracks where stretched: bottom' };
    return { code: 'rebar', cue: 'Steel goes on the stretched side' };
  }

  /* 7-4-03 stability: tipping angle = atan((base / 2) / CoG height). Shapes are uniform, so the CoG is exact. */
  // kind 'rect' | 'wide' (trapezoid, wide bottom) | 'narrow' (wide top). b = bottom width, t = top width, H = height (px).
  function shape() {

  A.tx(A.svg, x + 16, cy, 'CoG', { 'font-size': 13, fill: C.yellow, 'text-anchor': 'start' });
  el('line', { x1: x - s.b / 2, x2: x + s.b / 2, y1: gy + 7, y2: gy + 7, stroke: C.teal, 'stroke-width': 4 }, A.svg);

}

/* Lever: bar, fulcrum, load and effort placed in order. pos: {F, L, E} as x; effort arrow up or down. */
function lever(A, y, pos, effUp, opt) {
  opt = opt || {};

  el('rect', { x: 80, y: y - 7, width: 480, height: 14, rx: 7, fill: '#7a5a33', stroke: C.axis, 'stroke-width': 1.5 }, g);
  el('path', { d: `M${pos.F} ${y + 7}l-24 40h48z`, fill: '#3a4658', stroke: C.axis, 'stroke-width': 2 }, g);
  el('rect', { x: pos.L - 30, y: y - 57, width: 60, height: 50, rx: 6, fill: '#3b2f1f', stroke: C.gold, 'stroke-width': 2 }, g);
  DRILL.tx(g, pos.L, y - 32, opt.loadText || 'Load', { 'font-size': 14, fill: C.gold });
  if (effUp) S.arrow(g, pos.E, y + 70, pos.E, y + 12, C.blue, 'L', { 'stroke-width': 5 }); else S.arrow(g, pos.E, y - 80, pos.E, y - 12, C.blue, 'L', { 'stroke-width': 5 });

}
function leverPos(cls, flip, d) {
  const ends = [110, 530], mid = 320 + ((d || 0) - 1) * 40, [a, b] = flip ? [ends[1], ends[0]] : ends;
  if (cls === 1) return { F: mid, L: a, E: b, up: false };
  if (cls === 2) return { F: a, L: mid, E: b, up: true };
  return { F: a, E: mid, L: b, up: true };
}
