<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polynomials Trainer | Math 9</title>
<style>
/* =====================================================================
   POLYNOMIALS TRAINER
   Math 9 | Algebra | Polynomials
   PO1 name the parts · PO2 like terms · PO3 add · PO4 subtract · PO5 monomial × polynomial · PO6 binomial × binomial
   Students type each answer. Algebra tiles (PO2 to PO4) group like terms and cancel zero pairs on screen;
   an area model (PO5, PO6) shows every partial product. Wrong answers are matched to the named mistakes in
   the notes (degree vs coefficient, adding unlike terms, the negative on the first term only, x·x = 2x,
   the missing middle terms). Model: exact integer polynomial arithmetic, degree up to 4 (tiles only up to 2).
   Steps follow the notes in order, then Mixed practice.
   Look: full window, dark high-contrast canvas (3Blue1Brown style); written material opens in popups.
   ===================================================================== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  :root {
    --bg: #070a10; --panel: #0f1520; --panel2: #151d2b; --stage: #0b0f17; --edge: #263246;
    --text: #f5f7fb; --muted: #a7b4c8;
    --blue: #58c4dd; --yellow: #f7d96f; --teal: #5cd0b3; --gold: #f0ac5f;
    --green: #83c167; --red: #fc6255; --pink: #ef7fc6;
    --math: 'Cambria Math', 'STIX Two Math', 'Latin Modern Math', Cambria, Georgia, serif;
  }
  html, body { height: 100%; }
  body { font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; font-size: 16px; line-height: 1.45; color: var(--text); background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .4; }
  :focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .math { font-family: var(--math); }
  .math i { font-style: italic; }
  .cB { color: var(--blue); } .cY { color: var(--yellow); } .cT { color: var(--teal); } .cG { color: var(--gold); } .cGr { color: var(--green); } .cR { color: var(--red); }

  .top { display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; background: var(--panel); border-bottom: 1px solid var(--edge); padding: 8px 14px; flex-shrink: 0; }
  .brand .course-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--blue); }
  .brand h1 { font-size: 19px; font-weight: 650; line-height: 1.15; }
  .progress { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 160px; }
  .progress .bar { flex: 1; max-width: 260px; height: 8px; border-radius: 4px; background: var(--panel2); border: 1px solid var(--edge); overflow: hidden; }
  .progress .bar span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--blue), var(--teal)); transition: width .4s; }
  .progress .txt { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .topbtns { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn { min-height: 44px; border: 1px solid var(--edge); background: var(--panel2); color: var(--text); border-radius: 12px; padding: 6px 14px; font-size: 15px; font-weight: 600; }
  .btn:hover:not(:disabled) { border-color: var(--blue); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #04121a; }
  .btn.primary:hover:not(:disabled) { background: #7fd3e7; }
  .btn.good { background: var(--green); border-color: var(--green); color: #0b1a06; }
  .btn.small { min-height: 40px; padding: 4px 12px; font-size: 14px; }

  .strip { display: flex; align-items: center; gap: 10px; background: var(--stage); border-bottom: 1px solid var(--edge); padding: 5px 14px; flex-shrink: 0; min-height: 52px; }
  .strip .lab { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--yellow); white-space: nowrap; }
  .strip .txt { flex: 1; font-weight: 600; }
  .strip .txt small { color: var(--muted); font-weight: 600; margin-right: 6px; }
  .strip .arrow { min-width: 44px; min-height: 40px; border: 1px solid var(--edge); background: var(--panel2); border-radius: 12px; font-size: 20px; font-weight: 700; color: var(--yellow); }

  .app { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(330px, 420px); }
  .main { display: flex; flex-direction: column; min-height: 0; min-width: 0; padding: 12px 14px; gap: 10px; }
  .side { overflow-y: auto; min-height: 0; padding: 12px 14px 16px; background: var(--panel); border-left: 1px solid var(--edge); display: flex; flex-direction: column; gap: 12px; }
  .stagebar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: var(--panel); border: 1px solid var(--edge); border-radius: 16px; padding: 6px 10px; min-height: 56px; }
  .stagebar .lab { font-size: 13px; color: var(--muted); margin-right: auto; }
  .stage { flex: 1; min-height: 0; background: var(--stage); border: 1px solid var(--edge); border-radius: 16px; display: flex; align-items: center; justify-content: center; padding: 6px; }
  .stage svg { width: 100%; height: 100%; display: block; }
  .stage svg text { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 600; paint-order: stroke; stroke: var(--stage); stroke-width: 4px; stroke-linejoin: round; }
  .stage svg text.m { font-family: var(--math); font-weight: 400; }

  .tile { transition: transform .7s cubic-bezier(.45, 0, .2, 1), opacity .5s; }
  .tile rect { transition: fill .5s, stroke .5s; }
  .tile.gone { opacity: .1; }
  .cell rect { transition: fill .5s; }

  .card { border: 1px solid var(--edge); border-radius: 14px; padding: 10px 13px; background: var(--panel2); }
  .card h3 { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 4px; }
  .problem { font-family: var(--math); font-size: 27px; text-align: center; padding: 4px 0; }
  .story { font-size: 15px; margin-bottom: 4px; color: var(--muted); }
  .pcount { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .dots span { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--edge); margin-left: 4px; vertical-align: middle; }
  .dots span.on { background: var(--green); border-color: var(--green); }
  .ask { font-weight: 600; margin-bottom: 6px; }
  .linein { width: 100%; min-height: 50px; padding: 6px 12px; background: var(--stage); border: 1px solid var(--edge); border-radius: 12px; font-family: var(--math); font-size: 24px; color: var(--text); }
  .linein:focus { border-color: var(--yellow); outline: none; box-shadow: 0 0 0 2px rgba(247, 217, 111, .35); }
  .preview { min-height: 26px; font-family: var(--math); font-size: 19px; color: var(--muted); margin-top: 4px; }
  .keys { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-top: 6px; }
  .key { min-height: 42px; border: 1px solid var(--edge); background: var(--stage); border-radius: 10px; font-family: var(--math); font-size: 20px; color: var(--text); }
  .key:hover { border-color: var(--blue); }
  .key.x { color: var(--yellow); font-style: italic; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .choices button { min-height: 48px; border: 1px solid var(--edge); background: var(--stage); border-radius: 10px; font-size: 16px; font-weight: 600; }
  .choices button:hover { border-color: var(--blue); }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .fb { margin-top: 8px; font-size: 15px; min-height: 22px; }
  .fb.good { color: var(--green); }
  .fb.oops { color: #ff9a90; }
  .fb .tag { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; border: 1px solid currentColor; border-radius: 999px; padding: 0 8px; margin-right: 6px; }
  .predict .q { font-weight: 600; margin-bottom: 8px; }
  .predict .opts { display: flex; flex-direction: column; gap: 6px; }
  .predict .opt { text-align: left; min-height: 44px; border: 1px solid var(--edge); background: var(--stage); border-radius: 10px; padding: 8px 12px; font-size: 15px; }

  .verdict { margin-top: 8px; font-size: 15px; }

  dialog { border: 1px solid var(--edge); border-radius: 18px; padding: 0; width: min(660px, calc(100vw - 24px)); max-height: calc(100vh - 40px); background: var(--panel); color: var(--text); box-shadow: 0 24px 60px rgba(0, 0, 0, .6); }
  dialog::backdrop { background: rgba(3, 6, 12, .7); }
  .dlg-head { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--edge); }
  .dlg-head h2 { flex: 1; font-size: 20px; font-weight: 650; }
  .dlg-body { padding: 14px 20px 20px; overflow-y: auto; max-height: calc(100vh - 112px); }
  .dlg-body p { margin-bottom: 9px; }
  .dlg-body ol, .dlg-body ul { margin: 4px 0 6px 22px; }
  .dlg-body li { margin-bottom: 6px; }
  .box { border-radius: 14px; padding: 10px 14px; margin: 12px 0; border: 1px solid; }
  .box .label { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 4px; }
  .box p:last-child { margin-bottom: 0; }
  .box.example { border-color: var(--blue); background: #0d2029; } .box.example .label { color: var(--blue); }
  .box.watch { border-color: var(--red); background: #2a1316; } .box.watch .label { color: var(--red); }
  .box.paper { border-color: var(--gold); background: #2a1e0f; } .box.paper .label { color: var(--gold); }
  .box.hint { border-color: var(--yellow); background: #2a2610; } .box.hint .label { color: var(--yellow); }
  .ican-pop { background: var(--stage); border: 1px solid var(--edge); border-radius: 12px; padding: 8px 12px; font-weight: 600; color: var(--yellow); }
  .wl { font-family: var(--math); font-size: 19px; margin: 2px 0; }
  .note { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; color: var(--muted); }
  .steps-list .sec { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 12px 0 4px; }
  .steps-list button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; min-height: 44px; border: 1px solid transparent; background: none; border-radius: 10px; padding: 4px 10px; font-size: 15px; }
  .steps-list button:hover { background: var(--panel2); }
  .steps-list button.current { border-color: var(--blue); }
  .steps-list .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--edge); font-size: 12px; line-height: 16px; text-align: center; flex-shrink: 0; }
  .steps-list .done .dot { background: var(--green); border-color: var(--green); color: #0b1a06; }

  .spot { outline: 3px solid var(--yellow) !important; outline-offset: 4px; border-radius: 12px; }
  #coach { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 30; width: min(520px, calc(100vw - 24px)); background: var(--panel2); border: 1px solid var(--yellow); border-radius: 14px; padding: 12px 16px; box-shadow: 0 12px 36px rgba(0, 0, 0, .6); }
  #coach p { font-weight: 600; margin-bottom: 8px; }
  #coach .cactions { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #coach .n { font-size: 13px; font-weight: 700; color: var(--muted); }

  @media (max-width: 1180px) { .btxt { display: none; } .topbtns .btn { min-width: 44px; font-size: 17px; } }
  @media (max-width: 1020px) { .app { grid-template-columns: minmax(0, 1fr) minmax(300px, 360px); } }
  @media (max-height: 700px) {
    .top { padding: 4px 12px; } .brand h1 { font-size: 17px; }
    .strip { min-height: 44px; padding: 2px 12px; } .strip .arrow { min-height: 38px; }
    .main { padding: 8px 10px; gap: 6px; } .side { padding: 8px 10px; gap: 8px; }
    .card { padding: 7px 10px; } .problem { font-size: 23px; } .linein { font-size: 21px; min-height: 44px; }
    .key { min-height: 38px; } .stagebar { min-height: 48px; padding: 4px 8px; }
  }
  @media (max-width: 760px) {
    body { overflow: auto; display: block; } html, body { height: auto; }
    .app { display: flex; flex-direction: column-reverse; }
    .stage { height: 46vh; min-height: 260px; flex: none; }
    .side { border-left: none; overflow: visible; }
  }
  @media (prefers-reduced-motion: reduce) { .tile, .tile rect, .cell rect, .progress .bar span { transition: none; } }
</style>

<body>

<div class="app">
  <section class="main">
    <div class="stagebar" id="stagebar"><span class="lab" id="stageLab"></span><span id="stageBtns"></span></div>

  </section>

<script>
const DEBUG = /[?&]debug=1/.test(location.search);

/* ===================== MODEL START (no DOM) ===================== */
const MODEL = (() => {
  let rand = Math.random;
  function seed(n) { let a = n >>> 0; rand = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rnd = (lo, hi) => lo + Math.floor(rand() * (hi - lo + 1));
  const pick = arr => arr[rnd(0, arr.length - 1)];
  const nz = (lo, hi) => { let k; do { k = rnd(lo, hi); } while (k === 0); return k; };
  const MAXD = 6;

  /* ---- polynomials: arrays of coefficients, index = degree ---- */
  const P = () => new Array(MAXD + 1).fill(0);
  const mono = (c, d) => { const p = P(); p[d] = c; return p; };
  const padd = (a, b) => a.map((c, i) => c + b[i]);
  const pneg = a => a.map(c => -c);
  const psub = (a, b) => padd(a, pneg(b));
  function pmul(a, b) { const r = P(); a.forEach((c, i) => { if (c) b.forEach((e, j) => { if (e) { if (i + j > MAXD) throw { msg: 'That power is too high for this trainer.' }; r[i + j] += c * e; } }); }); return r; }
  const peq = (a, b) => a.every((c, i) => Math.abs(c - b[i]) < 1e-9);
  const deg = a => { for (let i = MAXD; i >= 0; i--) if (Math.abs(a[i]) > 1e-9) return i; return -1; };
  const fromTerms = ts => ts.reduce((p, [c, d]) => padd(p, mono(c, d)), P());
  const SUP = { 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶' };
  // One term as text; first = no leading " + ".
  function termStr(c, d, first) {
    const a = Math.abs(c), sign = c < 0 ? (first ? '−' : ' − ') : (first ? '' : ' + ');
    const body = d === 0 ? String(a) : (a === 1 ? '' : String(a)) + 'x' + (d > 1 ? SUP[d] : '');
    return sign + body;
  }
  const termsStr = ts => ts.length ? ts.map(([c, d], i) => termStr(c, d, i === 0)).join('') : '0';
  const pstr = a => termsStr(a.map((c, d) => [c, d]).filter(t => t[0]).reverse());

  /* ---- reading a typed polynomial ---- */
  function norm(s) {
    return String(s || '').replace(/[−–—]/g, '-').replace(/[×·*]/g, '*').replace(/²/g, '^2').replace(/³/g, '^3').replace(/⁴/g, '^4').replace(/\s+/g, '').toLowerCase();
  }
  // Returns { poly, top: [poly of each top-level term], paren }
  function parse(s) {
    const n = norm(s);
    if (!n) return { err: 'Type your answer first.' };
    if (/[=<>]/.test(n)) return { err: 'Type just the polynomial, with no = sign.' };
    let i = 0;
    const peek = () => n[i];
    function num() { let j = i; while (j < n.length && /[0-9.]/.test(n[j])) j++; const v = n.slice(i, j); i = j; if ((v.match(/\./g) || []).length > 1) throw { msg: 'A number has too many decimal points.' }; return +v; }
    function primary() {
      const c = peek();
      if (c === undefined) throw { msg: 'Something is missing at the end.' };
      if (/[0-9.]/.test(c)) return mono(num(), 0);
      if (c === 'x') { i++; return mono(1, 1); }
      if (/[a-z]/.test(c)) throw { msg: 'Use x for the variable.' };
      if (c === '(') { i++; const r = expr(); if (peek() !== ')') throw { msg: 'A bracket is not closed.' }; i++; return r; }
      throw { msg: c === '^' ? 'Put the power right after x, like x^2 or x².' : 'Two signs in a row, or a sign with nothing after it.' };
    }
    function power() {
      let b = primary();
      if (peek() === '^') { i++; if (!/[0-9]/.test(peek() || '')) throw { msg: 'A power needs a whole number, like x^2.' }; const e = num(); if (!Number.isInteger(e) || e > MAXD) throw { msg: 'Use a whole-number power from 0 to ' + MAXD + '.' }; let r = mono(1, 0); for (let k = 0; k < e; k++) r = pmul(r, b); b = r; }
      return b;
    }
    function factor() { if (peek() === '-') { i++; return pneg(factor()); } if (peek() === '+') { i++; return factor(); } return power(); }
    function term() { let r = factor(); for (;;) { const c = peek(); if (c === '*') { i++; r = pmul(r, factor()); } else if (c === '/') throw { msg: 'Division is not used here.' }; else if (c && (/[0-9.x(]/.test(c))) r = pmul(r, factor()); else return r; } }
    const top = [];
    function expr(isTop) {
      let r = term(); if (isTop) top.push(r);
      while (peek() === '+' || peek() === '-') { const op = n[i++]; const t = term(); const tt = op === '+' ? t : pneg(t); if (isTop) top.push(tt); r = padd(r, tt); }
      return r;
    }
    try {
      const poly = expr(true);
      if (i < n.length) throw { msg: n[i] === ')' ? 'There is an extra closing bracket.' : 'I can’t read the end of that.' };
      return { poly, top, paren: /[()]/.test(n), raw: n };
    } catch (e) { return { err: e.msg || 'I can’t read that.' }; }
  }
  // Simplified: no brackets, every top-level term a single monomial, each power once, no zero terms.
  function simplified(r) {
    if (r.paren) return false;
    if (r.top.length === 1 && r.top[0].every(c => !c)) return true;   // just "0"
    const ds = r.top.map(t => { const nzs = t.map((c, d) => c ? d : -1).filter(d => d >= 0); return nzs.length === 1 ? nzs[0] : (nzs.length === 0 ? -2 : -1); });
    if (ds.some(d => d < 0)) return false;
    return new Set(ds).size === ds.length;
  }
  function standard(r) { const ds = r.top.map(t => deg(t)); return ds.every((d, k) => k === 0 || d < ds[k - 1]); }
  const evalAt = (a, x) => a.reduce((s, c, d) => s + c * Math.pow(x, d), 0);

  /* ---- checking an expression answer ---- */
  const NAMES = ['constant', 'x term', 'x² term', 'x³ term', 'x⁴ term'];
  function check(prob, text) {
    const r = parse(text);
    if (r.err) return { ok: false, code: 'parse', msg: r.err };
    const want = prob.answer;
    if (peq(r.poly, want)) {

function renderKeys() {

function setFb(html, cls, tag) { const f = $('fb'); f.innerHTML = (tag ? '<span class="tag">' + tag + '</span>' : '') + html; f.className = 'fb' + (cls ? ' ' + cls : ''); }

/* ---------- the model on screen: tiles, area model, or labelled parts ---------- */
const svg = $('svg');
let TILES = [];
// Tile sizes: x² is a big square, x a long thin bar, 1 a small square.
const TS = { 2: [46, 46], 1: [46, 13], 0: [13, 13] };
function tileSvg(t) {
  const [w, h] = TS[t.d], col = t.s > 0 ? DEGC[t.d] : C.red, lab = t.d === 2 ? 'x²' : t.d === 1 ? 'x' : '1';
  return '<g class="tile" id="t' + t.id + '" style="transform:translate(' + t.x + 'px,' + t.y + 'px)"><rect width="' + w + '" height="' + h + '" rx="3" fill="' + col + '" fill-opacity=".85" stroke="' + col + '" stroke-width="1.5"/>' +
    '<text class="in" x="' + w / 2 + '" y="' + (h / 2 + (t.d === 0 ? 4 : 5)) + '" text-anchor="middle" font-size="' + (t.d === 0 ? 10 : 13) + '" fill="#081018">' + (t.s < 0 ? '−' : '') + (t.d === 0 ? '' : lab) + '</text></g>';
}
// Raw layout: tiles in the order written. Two zones for adding and subtracting.
function layoutRaw() {
  const zones = W.prob.kind === 'like' ? [[30, 610]] : [[24, 300], [340, 616]];
  const cursor = zones.map(z => ({ x: z[0], y: 40, rowH: 0 }));
  TILES.forEach(t => {
    const z = zones[t.g] || zones[0], c = cursor[t.g] || cursor[0], [w, h] = TS[t.d];
    if (c.x + w > z[1]) { c.x = z[0]; c.y += c.rowH + 10; c.rowH = 0; }
    t.x = c.x; t.y = c.y; c.x += w + (t.last ? 16 : 5); c.rowH = Math.max(c.rowH, h);
    t.gone = false;
  });
}
// Grouped: one row per power, positives on top, matching negatives under them. Pairs cancel.
function layoutGrouped() {
  const rows = { 2: 34, 1: 170, 0: 262 };
  [2, 1, 0].forEach(d => {
    const pos = TILES.filter(t => t.d === d && sgn(t) > 0), neg = TILES.filter(t => t.d === d && sgn(t) < 0), [w, h] = TS[d];
    const pairs = Math.min(pos.length, neg.length), most = Math.max(pos.length, neg.length, 1);
    const step = Math.min(w + 6, (560 - w) / Math.max(most - 1, 1));   // squeeze long rows so they fit
    pos.forEach((t, i) => { t.x = 40 + i * step; t.y = rows[d]; t.gone = i < pairs; });
    neg.forEach((t, i) => { t.x = 40 + i * step; t.y = rows[d] + h + 6; t.gone = i < pairs; });
  });
}
const sgn = t => (t.g === 1 && W.flipped) ? -t.s : t.s;
function buildStage() {
  const p = W.prob; TILES = [];
  if (p.kind === 'like' || p.kind === 'add' || p.kind === 'sub') {
    const groups = p.kind === 'like' ? [p.terms] : [p.A, p.B];
    let id = 0;
    groups.forEach((terms, g) => terms.forEach(([c, d], k) => { for (let i = 0; i < Math.abs(c); i++) TILES.push({ id: id++, d, s: Math.sign(c), g, last: i === Math.abs(c) - 1 }); }));
    layoutRaw();
    let h = '<rect width="640" height="380" fill="' + C.stage + '"/>';
    if (p.kind !== 'like') h += '<line x1="320" y1="24" x2="320" y2="356" stroke="' + C.edge + '" stroke-width="2" stroke-dasharray="6 6" id="divider"/><text id="opSign" x="320" y="20" text-anchor="middle" font-size="22" fill="' + C.yellow + '">' + (p.kind === 'add' ? '+' : '−') + '</text>';
    h += '<g id="rowLabels" opacity="0"><text class="m" x="20" y="64" text-anchor="end" font-size="16" fill="' + DEGC[2] + '"></text></g>';
    h += TILES.map(tileSvg).join('');
    h += '<text id="tileSay" x="320" y="370" text-anchor="middle" font-size="15" fill="' + C.tick + '"></text>';
    svg.innerHTML = h;
  } else svg.innerHTML = '';
}
function updateStage() {
  const p = W.prob, bar = $('stageBtns'), lab = $('stageLab');
  if (p.kind === 'like' || p.kind === 'add' || p.kind === 'sub') {
    lab.innerHTML = 'Algebra tiles · <span style="color:' + DEGC[2] + '">■ x²</span> <span style="color:' + DEGC[1] + '">▬ x</span> <span style="color:' + DEGC[0] + '">▪ 1</span> <span style="color:' + C.red + '">red = negative</span>';
    bar.innerHTML = (p.kind === 'sub' ? '<button type="button" class="btn small" id="bFlip"' + (W.flipped ? ' disabled' : '') + '>± Take the opposite</button> ' : '') +
      '<button type="button" class="btn small" id="bGroup">' + (W.grouped ? '↺ Put back' : '⇅ Group like terms') + '</button>';
    TILES.forEach(t => {
      const el = $('t' + t.id); if (!el) return;
      el.style.transform = 'translate(' + t.x + 'px,' + t.y + 'px)';
      el.classList.toggle('gone', !!t.gone);
      const col = sgn(t) > 0 ? DEGC[t.d] : C.red, r = el.querySelector('rect'), tx = el.querySelector('text');
      r.setAttribute('fill', col); r.setAttribute('stroke', col);
      tx.textContent = (sgn(t) < 0 ? '−' : '') + (t.d === 0 ? '' : t.d === 2 ? 'x²' : 'x');
    });
    const dv = $('divider'), op = $('opSign'); if (dv) { dv.style.opacity = W.grouped ? 0 : 1; op.style.opacity = W.grouped ? 0 : 1; if (W.flipped) op.textContent = '+'; }
    const say = $('tileSay');
    if (W.grouped) {
      const left = [2, 1, 0].map(d => TILES.filter(t => t.d === d && !t.gone).reduce((s, t) => s + sgn(t), 0));
      const pairs = TILES.filter(t => t.gone).length / 2;
      say.textContent = (pairs ? pairs + ' zero pair' + (pairs > 1 ? 's' : '') + ' cancel. ' : '') + 'What is left: ' + M.termsStr([[left[0], 2], [left[1], 1], [left[2], 0]].filter(x => x[0]));
      say.setAttribute('fill', C.green);
    } else say.textContent = p.kind === 'sub' && !W.flipped ? 'Subtracting: first take the opposite of the second polynomial.' : '';
    svg.setAttribute('aria-label', 'Algebra tiles for ' + p.text + (W.grouped ? ', grouped by type' : ''));
  } else if (p.kind === 'mono' || p.kind === 'bin') {
    lab.textContent = 'Area model · each box is one partial product';
    bar.innerHTML = '<button type="button" class="btn small" id="bReveal"' + (W.reveal ? ' disabled' : '') + '>Show the products</button>';
    drawArea();
  } else {
    lab.textContent = 'The parts of a polynomial';
    bar.innerHTML = '';
    drawParts();
  }
}
// Area model: rows are the first factor's terms, columns the second's.
function drawArea() {
  const p = W.prob, rows = p.kind === 'mono' ? [p.m] : p.A, cols = p.B;
  const x0 = 120, y0 = 70, Wd = 470, Ht = p.kind === 'mono' ? 130 : 240, cw = Wd / cols.length, rh = Ht / rows.length;
  let h = '<rect width="640" height="380" fill="' + C.stage + '"/>';
  cols.forEach(([c, d], j) => { h += '<text class="m" x="' + (x0 + cw * j + cw / 2) + '" y="' + (y0 - 16) + '" text-anchor="middle" font-size="26" fill="' + C.yellow + '">' + esc(M.termStr(c, d, true)) + '</text>'; });
  rows.forEach(([c, d], i) => { h += '<text class="m" x="' + (x0 - 16) + '" y="' + (y0 + rh * i + rh / 2 + 9) + '" text-anchor="end" font-size="26" fill="' + C.blue + '">' + esc(M.termStr(c, d, true)) + '</text>'; });
  rows.forEach(([a, da], i) => cols.forEach(([b, db], j) => {
    const prod = a * b, dd = da + db, col = prod < 0 ? C.red : (DEGC[dd] || C.blue), show = W.reveal || W.solvedNow;
    const x = x0 + cw * j, y = y0 + rh * i;
    h += '<g class="cell"><rect x="' + (x + 3) + '" y="' + (y + 3) + '" width="' + (cw - 6) + '" height="' + (rh - 6) + '" rx="8" fill="' + col + '" fill-opacity="' + (show ? .22 : .06) + '" stroke="' + col + '" stroke-width="2"/>' +
      (show ? '<text class="m" x="' + (x + cw / 2) + '" y="' + (y + rh / 2 + 10) + '" text-anchor="middle" font-size="30" fill="' + C.text + '">' + esc(M.termStr(prod, dd, true)) + '</text>'
        : '<text class="m" x="' + (x + cw / 2) + '" y="' + (y + rh / 2 + 7) + '" text-anchor="middle" font-size="19" fill="' + C.tick + '">' + esc(M.termStr(a, da, true) + ' × ' + (b < 0 ? '(' + M.termStr(b, db, true) + ')' : M.termStr(b, db, true))) + '</text>') + '</g>';
  }));
  if (W.reveal || W.solvedNow) {
    const parts = []; rows.forEach(([a, da]) => cols.forEach(([b, db]) => parts.push([a * b, da + db])));
    h += '<text class="m" x="320" y="' + (y0 + Ht + 50) + '" text-anchor="middle" font-size="24" fill="' + C.green + '">' + esc(M.termsStr(parts)) + (W.solvedNow ? '  =  ' + esc(M.pstr(p.answer)) : '') + '</text>';
  }
  svg.innerHTML = h;
  svg.setAttribute('aria-label', 'Area model for ' + p.text);
}
// Naming: each term in its own box. After a right answer, the asked part is labelled.
function drawParts() {
  const p = W.prob, n = p.terms.length;
  let h = '<rect width="640" height="380" fill="' + C.stage + '"/>';
  const w = Math.min(170, 560 / n), x0 = 320 - w * n / 2, y = 130;
  const hiD = M.deg(p.poly);
  p.terms.forEach(([c, d], i) => {
    const x = x0 + w * i, col = DEGC[d] || C.blue, isHi = d === hiD && W.solvedNow && (p.ask === 'degree' || p.ask === 'lead');
    h += '<rect x="' + (x + 6) + '" y="' + y + '" width="' + (w - 12) + '" height="80" rx="12" fill="' + col + '" fill-opacity="' + (isHi ? .25 : .08) + '" stroke="' + col + '" stroke-width="' + (isHi ? 3 : 1.5) + '"/>';
    h += '<text class="m" x="' + (x + w / 2) + '" y="' + (y + 52) + '" text-anchor="middle" font-size="34" fill="' + C.text + '">' + esc(M.termStr(c, d, i === 0).trim()) + '</text>';
    h += '<text x="' + (x + w / 2) + '" y="' + (y + 110) + '" text-anchor="middle" font-size="14" fill="' + C.tick + '">term ' + (i + 1) + (W.solvedNow ? ' · degree ' + d : '') + '</text>';
  });
  if (W.solvedNow) {

    const txt = p.ask === 'type' ? k[0].toUpperCase() + k.slice(1) : p.ask === 'degree' ? 'Degree ' + k : p.ask === 'lead' ? 'Leading coefficient ' + sn(k) : 'Constant ' + sn(k);
    h += '<text x="320" y="290" text-anchor="middle" font-size="22" fill="' + C.green + '">' + esc(txt) + '</text>';
    if (p.written !== p.poly.filter(c => c).length) h += '<text class="m" x="320" y="326" text-anchor="middle" font-size="22" fill="' + C.yellow + '">simplified: ' + esc(M.pstr(p.poly)) + '</text>';
  } else h += '<text x="320" y="80" text-anchor="middle" font-size="17" fill="' + C.tick + '">' + n + ' term' + (n > 1 ? 's' : '') + ' as written</text>';
  svg.innerHTML = h;
  svg.setAttribute('aria-label', 'The terms of ' + p.text);
}

/* ---------- answering ---------- */
function submit(given) {
  const p = W.prob; if (W.solvedNow) return null;
  let r;
  if (!W.tried) { W.tried = true; $('predict').hidden = true; }
  if (p.kind === 'name') {
    const ans = given != null ? given : (p.ask === 'type' ? null : parseFloat(String($('ansIn').value).replace(/[−–]/g, '-')));
    r = M.checkName(p, p.ask, ans);
    if (!r.ok) { setFb(r.msg, 'oops', { coef: 'coefficient', nterms: 'terms', degree: 'degree', likefirst: 'like terms', firstwritten: 'highest power', sign: 'sign' }[r.code]); return r; }
    W.verify = r.msg;
  } else {
    r = M.check(p, $('ansIn').value);
    if (!r.ok) { setFb(r.msg, 'oops', { notsimp: 'simplify', unlike: 'unlike terms', firstneg: 'every sign', added: 'opposite', firstonly: 'every term', xx: 'exponents', middle: 'four parts' }[r.code]); return r; }
    W.verify = mathHTML(p.text) + ' = <b>' + mathHTML(M.pstr(p.answer)) + '</b>' + (r.std ? '' : '<div class="note">Tip: standard form writes the highest power first: ' + esc(M.pstr(p.answer)) + '.</div>');
    if (p.kind === 'like' || p.kind === 'add' || p.kind === 'sub') { if (p.kind === 'sub') W.flipped = true; W.grouped = true; layoutGrouped(); }
  }
  const s = cur();
  W.solvedNow = true; setFb('', '');
  if (!state.done[s.id] && !W.extra) { state.solved[s.id] = (state.solved[s.id] || 0) + 1; if (state.solved[s.id] >= s.need) state.done[s.id] = true; }
  save(); renderAll();
  return r;
}

let tour = null;
function unspot() { document.querySelectorAll('.spot').forEach(n => n.classList.remove('spot')); }
function startTour() { endTour(); tour = { steps: TOUR.filter(s => { const n = document.querySelector(s[0]); return n && n.getClientRects().length; }), i: -1 }; $('coach').hidden = false; tourNext(); }
function tourNext() { unspot(); tour.i++; const s = tour.steps[tour.i]; if (!s) return endTour(); const n = document.querySelector(s[0]); n.classList.add('spot'); $('coachTxt').textContent = s[1]; $('coachN').textContent = (tour.i + 1) + ' of ' + tour.steps.length; $('coachNext').textContent = tour.i === tour.steps.length - 1 ? 'Done' : 'Next'; $('coachNext').focus({ preventScroll: true }); }
function endTour() { if (!tour) return; unspot(); $('coach').hidden = true; tour = null; }
$('bTour').addEventListener('click', startTour);
$('coachNext').addEventListener('click', () => { if (tour) tourNext(); });
$('coachSkip').addEventListener('click', endTour);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && tour) endTour(); });

/* ---------- start ---------- */
load();
if (DEBUG) window.TR = { MODEL, STEPS, W: () => W, state: () => state, select, submit, newProblem, openDlg, closeDlg, startTour, TILES: () => TILES };
select(location.hash.slice(1) && STEPS.some(s => s.id === location.hash.slice(1)) ? location.hash.slice(1) : state.current);
</script>
