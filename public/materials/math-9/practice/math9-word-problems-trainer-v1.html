<!-- =====================================================================
   MATH 9 WORD PROBLEMS TRAINER (narrow trainer format, see _sims-context.md)
   Math 9 | every topic | used after the lessons: it does not teach, each item's 📖 opens its own notes section.
   One tab per topic. The skill on every tab is the same narrow one: turn a short story into the right steps.
   A round of 10 ramps up: items 1–3 are Level 1 (one step), 4–7 Level 2 (two steps), 8–10 Level 3 (three or more).
   Each level draws from three story types, so a tab has nine; Mixed draws from every topic.
     RN Rational   temperatures, balances, depths, rope in eighths, change, a mean, a diver, shares   RN2 RN3 RN5
     SR Roots      side from area, decimal and estimated roots, fences, the Pythagorean theorem in a scene   SR1–SR4
     PE Powers     doubling, cubes, powers of ten, half-life, packing cubes, a chain message   PE1 PE4 PE5 PE7
     LR Relations  phone bill, candle, pay rate; plumber's rate, bowling games, plant table; electrician, balloon, tiles   LR1–LR4
     LE Equations  novels, a fraction of savings, card packs; tickets + fee, fair rides, number trick; gyms, dog run, market   LE1–LE5
     PO Polynomials  triangle perimeter, money kept, lockers; deck, poster, flower bed; shed, cut-out, frame   PO3–PO6
                     (the answer is a polynomial typed into coefficient boxes; the cut-out ends with x substituted)
     CG Circles    arena camera, pond fountain, path angle; table crack, bike chain, base angle; tunnel, two tangents, kite   CG2–CG4
     ME Solids     tank, snow cone, ball cover; beach ball, soup label, tent; grain elevator, silo, rain tank fill time   ME2–ME5
     SI Similarity map, photo, canoe model; shadow, similar triangle, model truck; house plan, sod cost, mirror   SI1, SI2, SI4
     ST Scatter    dots on the plot, slope as a rate, predict; actual − predicted, plant trend, solve for x;
                   two points → predict, extend to zero snow, hot chocolate on cold days   ST1, ST3, ST4
                   (ST2, direction and strength, has no number answer: it stays on the Statistics trainer)
     PR Probability  marbles, not WIN, lunch combos; expected spins, coin and die, actual − expected;
                   two draws kept out, rain at least once, expected wins with replacement   PR1–PR4
                   (a probability may be typed as a fraction, a 2-place decimal or a percent)
   The picture is a schematic of the story (a number line, a bar, rectangles or an area model, a triangle in its
   scene, a chain of × steps, a cube, a graph, a table of values, a flow of operations with its undo) above the step
   chain (also a circle with its angles, a solid, two similar triangles, a shadow or mirror scene, a scatter plot with
   its line of best fit, a bag of counters, a spinner, an outcome grid or area model): one row per step, empty until
   solved. A wrong try names the mistake and turns its step red; Show me fills the steps in order.
   Named mistakes (per story type, in the model): subtracting a negative, the sign of a fall or a dive, one step
   left out (the fee, the coldest day, the shared edge, the last subtraction), √ as ÷ 2, area for side, no root,
   adding instead of squaring, the exponent for the value, adding exponents in a power of a power, × 3 for cubed;
   the fee left out or multiplied, slope from totals, the starting value left out, off by one figure, undoing in the
   wrong order, rounding the wrong way, rates added, the middle terms, one term multiplied, subtracting only the
   first term, the shed or photo not taken away, perimeter for area; central vs inscribed angle, the right angle at the
   tangent, half the chord, r as a leg, the kite's radii; no ⅓, d for r, SA for V, the floor or roof left out, m³ not
   changed to L; adding instead of multiplying, k flipped, area × k instead of k², cm not changed to m;
   two values per dot, b for the slope, b left out, the sign of actual − predicted, solving in the wrong order,
   counting from the first data point, − × − on a cold day; part to part, P(not A) for P(A), adding for "and",
   2 + 6 outcomes, putting back what was kept, adding the rain chances, neither for at least once.
   Model: generated stories with exact answers; every answer and every named mistake is checked in the tests.
   Shared parts: wp.js (pictures, step chain, the tab). ?debug=1 puts DRILL (and MODEL) on window, no saving or motion.
   ===================================================================== -->

  <nav class="tabs" id="tabs" role="tablist" aria-label="Skills"></nav>

</header>

<div class="app">
  <section class="stage" id="stageWrap"><svg id="svg" viewBox="0 0 640 420" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Picture for this question"></svg></section>
  <aside class="side" id="side">
    <div id="askBox">
      <div class="q" id="q"></div>

    </div>
    <div class="ans" id="ans"></div>

      <button type="button" class="btn primary" id="bCheck">Check</button>
      <button type="button" class="btn icon" id="bShow" aria-label="Show me" title="Show me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>

<script>
const DEBUG = /[?&]debug=1/.test(location.search);

/* ===== DRILL KIT START (no DOM): exact fractions and seeded random ===== */
const Q = (() => {
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);
  const q = (n, d) => { d = d == null ? 1 : d; if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return { n: n / g, d: d / g }; };
  const of = v => typeof v === 'number' ? (Number.isInteger(v) ? q(v) : dec(String(v))) : v;
  const add = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d + b.n * a.d, a.d * b.d); };
  const sub = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d - b.n * a.d, a.d * b.d); };
  const mul = (a, b) => { a = of(a); b = of(b); return q(a.n * b.n, a.d * b.d); };
  const div = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d, a.d * b.n); };
  const neg = a => { a = of(a); return q(-a.n, a.d); };
  const eq = (a, b) => { if (a == null || b == null) return false; a = of(a); b = of(b); return a.n === b.n && a.d === b.d; };
  const val = a => { a = of(a); return a.n / a.d; };
  const isInt = a => of(a).d === 1;
  function dec(s) { const m = /^(-?)(\d*)\.?(\d*)$/.exec(s); if (!m) return null; const f = m[3] || ''; return q((m[1] ? -1 : 1) * parseInt((m[2] || '0') + f, 10), Math.pow(10, f.length)); }
  // Text a student typed -> fraction, '' for blank, or null if it is not a number.
  function parse(s) {
    s = String(s == null ? '' : s).replace(/[−–—]/g, '-').replace(/\s+/g, '').replace(/^\+/, '');
    if (s === '') return '';
    if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');
    if (/^-?\d+(\.\d+)?$/.test(s) || /^-?\d*\.\d+$/.test(s)) return dec(s);
    const m = /^(-?)\(?(-?\d+)\)?\/\(?(-?\d+)\)?$/.exec(s);
    if (m) { const d = parseInt(m[3], 10); if (d === 0) return null; return q((m[1] ? -1 : 1) * parseInt(m[2], 10), d); }
    return null;
  }
  const str = a => { a = of(a); return (a.n < 0 ? '−' : '') + (a.d === 1 ? Math.abs(a.n) : Math.abs(a.n) + '/' + a.d); };
  let rand = Math.random;
  function seed(n) { let a = n >>> 0; rand = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rnd = (lo, hi) => lo + Math.floor(rand() * (hi - lo + 1));
  const pick = arr => arr[rnd(0, arr.length - 1)];
  const nz = (lo, hi) => { let k; do { k = rnd(lo, hi); } while (k === 0); return k; };
  const chance = p => rand() < p;
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  return { gcd, lcm, q, of, add, sub, mul, div, neg, eq, val, isInt, parse, str, seed, rnd, pick, nz, chance, shuffle };
})();
/* ===== DRILL KIT END ===== */


/* ===================== MODEL START (no DOM) ===================== */
/* Math 9 word problems. Every topic has three levels: 1 = one step, 2 = two steps, 3 = three or more.
   An item: { t (problem type), lvl, code (notes section, e.g. RN2), story (HTML, numbers in <b>), q (2–4 words),
   v (the answer), dp (decimal places shown), tol, pre/unit (around the answer box), ans (Show me text, optional),
   errs: [{v, cue, s}] (a named mistake: its value, a cue of six words or fewer, the step it skips or gets wrong),
   cue (when no named mistake matches), steps: [{l, m}] (label, working), pic (a schematic, drawn by wp.js) }.
   A polynomial answer (PO) gives poly: {2, 1, 0} (coefficients) instead of v, and deg (2 or 1: how many boxes);
   its named mistakes are polynomials too. */
const MODEL = (() => {
  const { rnd, pick } = Q;
  const R = (x, d) => { const k = Math.pow(10, d == null ? 6 : d); return Math.round((x + (x < 0 ? -1 : 1) * 1e-9) * k) / k; };
  const F = (x, d) => { const s = d == null ? String(R(x, 4)) : R(x, d).toFixed(d); return s.replace('-', '−'); };
  const P = (x, d) => x < 0 ? '(' + F(x, d) + ')' : F(x, d);              // a negative in brackets
  const $ = x => (x < 0 ? '−$' : '$') + Math.abs(R(x, 2)).toFixed(2);
  const B = s => '<b>' + s + '</b>';
  const N = n => Math.round(n).toLocaleString('en-CA');                  // 4096 -> 4,096

        });
      },
      function stTarget() {
        const m = pick([2, 3, 4, 5]), b = pick([10, 15, 20, 25]), x = rnd(14, 30), Y = m * x + b;

          story: 'A line of best fit for lemonade sales is ' + B('y = ' + m + 'x + ' + b) + ', with x in °C. The stand wants to sell ' + B(Y + ' cups') + '.',
          ask: 'How warm must the day be to sell ' + Y + ' cups?', q: 'How warm a day?', v: x, unit: '°C', cue: 'Set y, then solve for x',

          steps: [['subtract b', Y + ' − ' + b + ' = ' + (Y - b)], ['divide by m', (Y - b) + ' ÷ ' + m + ' = ' + x + ' °C']],
          pic: { k: 'graph', xl: 'temperature (°C)', yl: 'cups', lines: [{ m, b, x0: 10, x1: 34, c: 'L' }], pts: scat(m, b, 12, 32, 9, 7).concat([{ x, y: Y, q: true, pos: 'l' }]), read: { x, s: 1 } }
        });

    ],
    3: [
      function stTwoPts() {
        for (;;) {
          const m = pick([2, 3, 4, 5, 1.5, 2.5]), b = rnd(5, 30), x1 = rnd(10, 16), x2 = x1 + rnd(4, 8), x3 = x2 + rnd(3, 8), y1 = m * x1 + b, y2 = m * x2 + b, y3 = m * x3 + b;
          if (y1 % 1 || y2 % 1) continue;

            story: 'A line of best fit for hot-dog sales (y) against temperature (x, °C) passes through ' + B('(' + x1 + ', ' + y1 + ')') + ' and ' + B('(' + x2 + ', ' + y2 + ')') + '.',

            errs: [[R(m * x3, 1), 'Add the y-intercept', 2], [m, 'That’s the slope: keep going', 0], [R(y1 / x1 * x3, 2), 'The line doesn’t start at 0', 1], [R(y2 / x2 * x3, 2), 'The line doesn’t start at 0', 1]],
            steps: [['slope', '(' + y2 + ' − ' + y1 + ') ÷ (' + x2 + ' − ' + x1 + ') = ' + F(m)], ['y-intercept', 'b = ' + y1 + ' − ' + F(m) + '(' + x1 + ') = ' + b], ['predict', F(m) + '(' + x3 + ') + ' + b + ' = ' + F(y3)]],

            ask: 'On what day does the line predict no snow?', q: 'Day with no snow?', v: Z, pre: 'day', cue: 'Slope, b, then y = 0',

        const m = pick([2, 3, 4]), b = rnd(40, 70), t1 = -rnd(3, 15), t2 = -rnd(3, 15), y1 = b - m * t1, y2 = b - m * t2, v = y1 + y2;

          story: 'A café’s line of best fit for hot chocolate is ' + B('y = −' + m + 'x + ' + b) + ' (x in °C, y = cups). Forecast: Saturday ' + B(F(t1) + ' °C') + ', Sunday ' + B(F(t2) + ' °C') + '.',
          ask: 'How many cups does the line predict for both days together?', q: 'Cups for both days?', v, unit: 'cups', cue: 'Predict each day, then add',

          steps: [['Saturday', '−' + m + '(' + F(t1) + ') + ' + b + ' = ' + y1 + ' cups'], ['Sunday', '−' + m + '(' + F(t2) + ') + ' + b + ' = ' + y2 + ' cups'], ['both days', y1 + ' + ' + y2 + ' = ' + v + ' cups']],

        });
      }
    ]
  };

  /* ============ PR · Probability ============ */
  const fr = (n, d) => Q.str(Q.q(n, d));
  // A probability answer: exact fraction, or a decimal to 2 places, or a percent. Named mistakes must sit clear of the answer.
  const prob = (n, d) => ({ v: n / d, ans: fr(n, d), tol: .0051, et: .004, prob: true });
  const CL = { red: 'R', blue: 'L', green: 'N', yellow: 'Y' };
  const PR = {
    1: [
      function prBag() {
        const cs = Q.shuffle(['red', 'blue', 'green', 'yellow']).slice(0, 3), ns = cs.map(() => rnd(2, 7)), t = ns[0] + ns[1] + ns[2], i = rnd(0, 2), c = cs[i], k = ns[i];
        return mk('prBag', 1, 'PR1', Object.assign(prob(k, t), {
          story: 'A bag holds ' + B(ns[0] + ' ' + cs[0]) + ', ' + B(ns[1] + ' ' + cs[1]) + ' and ' + B(ns[2] + ' ' + cs[2]) + ' marbles. You pick one without looking.',
          ask: 'What is the probability that the marble is ' + c + '?', q: 'P(' + c + ')?', cue: 'Wanted ÷ all the marbles',
          errs: [[k / (t - k), 'Out of all ' + t + ' marbles', 0], [(t - k) / t, 'That’s P(not ' + c + ')', 0]],

          pic: { k: 'bag', items: cs.map((x, j) => ({ c: CL[x], n: ns[j], t: x })), foot: '?', footl: 'P(' + c + ') =' }
        }));
      },
      function prNot() {
        const n = pick([5, 6, 8, 10, 12]), k = rnd(1, n - 1), L = pick(['WIN', 'PRIZE', 'BONUS']);
        return mk('prNot', 1, 'PR1', Object.assign(prob(n - k, n), {
          story: 'A game spinner has ' + B(n + ' equal sections') + '. ' + B(k) + ' of them say ' + B(L) + '.',
          ask: 'What is the probability of not landing on ' + L + '?', q: 'P(not ' + L + ')?', cue: 'Not = 1 − P(' + L + ')',

      function prMenu() {

          ['soup', 'soups', 'sandwich', 'sandwiches', ['tomato', 'chicken', 'corn', 'lentil'], ['ham', 'egg', 'tuna', 'turkey', 'veggie', 'BLT']],
          ['drink', 'drinks', 'snack', 'snacks', ['milk', 'juice', 'water', 'tea'], ['apple', 'muffin', 'yogurt', 'cheese', 'pretzel', 'granola']]]);
        const a = rnd(2, 4), b = rnd(3, 6);
        return mk('prMenu', 1, 'PR2', {
          story: 'A lunch combo is ' + B('1 ' + A) + ' and ' + B('1 ' + Bn) + '. There are ' + B(a + ' ' + As) + ' and ' + B(b + ' ' + Bs) + ' to choose from.',
          ask: 'How many different combos can you choose?', q: 'How many combos?', v: a * b, unit: 'combos', cue: 'Each ' + A + ' with each ' + Bn,

          pic: { k: 'grid', rl: A, cl: Bn, rows: la.slice(0, a).map(t => ({ t })), cols: lb.slice(0, b).map(t => ({ t })), hit: 'all', dots: true, s: 0, foot: '?', footl: 'total:' }

    2: [
      function prExpect() {

          story: 'A spinner has ' + B('8 equal sections') + ', and ' + B(k) + ' of them are blue. You spin it ' + B(N + ' times') + '.',
          ask: 'How many times would you expect to land on blue?', q: 'Expected blue spins?', v: e, unit: 'times', cue: 'P(blue) × number of spins',
          errs: [[R(k / 8, 4), 'Now × the number of spins', 1], [k, 'P(blue) × the spins', 0], [N * k, 'P(blue) is ' + k + '/8', 0], [R(N / k, 2), 'P(blue) × the spins', 0]],
          steps: [['P(blue)', k + '/8'], ['P × spins', k + '/8 × ' + N + ' = ' + e + ' times']],
          pic: { k: 'spin', n: 8, hit: k, c: 'L', t: 'blue', foot: '?', footl: 'expected:' }
        });
      },
      function prCoinDie() {
        const j = rnd(1, 4), g = 6 - j;

          story: 'You flip a coin and roll a die. You win with ' + B('heads') + ' and a roll ' + B('greater than ' + j) + '.',
          ask: 'What is the probability that you win?', q: 'P(win)?', cue: 'Each P, then multiply',
          errs: [[g / 6, 'Heads too: × 1/2', 1], [1 / 2 + g / 6, 'And: multiply, don’t add', 1], [g / 8, 'Outcomes multiply: 2 × 6', 1]],
          steps: [['each event', 'P(heads) = 1/2,  P(> ' + j + ') = ' + fr(g, 6)], ['multiply', '1/2 × ' + fr(g, 6) + ' = ' + fr(g, 12)]],
          pic: { k: 'grid', rl: 'coin', cl: 'die', rows: [{ t: 'H' }, { t: 'T' }], cols: [1, 2, 3, 4, 5, 6].map(t => ({ t: String(t) })), hit: [1, 2, 3, 4, 5, 6].slice(j).map(c => [0, c - 1]), s: 1, foot: '?', footl: 'P(win) =' }
        }));
      },
      function prExper() {
        const N = pick([60, 120, 180, 240]), exp = N / 6, obs = exp + pick([-6, -4, -3, 3, 4, 7]), d = obs - exp;
        return mk('prExper', 2, 'PR1', {
          story: 'A die is rolled ' + B(N + ' times') + '. It lands on 4 a total of ' + B(obs + ' times') + '.',
          ask: 'How many more (+) or fewer (−) 4s came up than expected?', q: 'Actual − expected?', v: d, cue: 'Expected = 1/6 × rolls',

          pic: { k: 'bag', items: [{ c: 'R', n: r, t: 'red' }, { c: 'L', n: b, t: 'blue' }], out: { c: 'R', s: 1, t: 'kept out' }, foot: '?', footl: 'P(both red) =' }
        }));

      function prRain() {
        const a = pick([20, 30, 40, 50, 60]), b = pick([10, 20, 30, 40, 70]), pa = 1 - a / 100, pb = 1 - b / 100, none = R(pa * pb, 4), v = R(1 - none, 4);
        return mk('prRain', 3, 'PR3', Object.assign(prob(1, 1), {
          v, ans: F(v),
          story: 'There is a ' + B(a + '%') + ' chance of rain on Saturday and a ' + B(b + '%') + ' chance on Sunday. The two days are independent.',
          ask: 'What is the probability that it rains on at least one of the days?', q: 'P(rain at least once)?', cue: 'Use the complement: 1 − P(neither)',
          errs: [[(a + b) / 100, 'Adding counts the overlap twice', 0], [none, 'That’s neither day: now 1 −', 2], [a * b / 10000, 'That’s rain on both days', 1]],
          steps: [['no rain each day', F(pa) + ' and ' + F(pb)], ['neither day', F(pa) + ' × ' + F(pb) + ' = ' + F(none)], ['at least once', '1 − ' + F(none) + ' = ' + F(v)]],
          pic: { k: 'grid', rl: 'Sat', cl: 'Sun', rows: [{ t: 'rain ' + a + '%', w: a }, { t: 'dry ' + (100 - a) + '%', w: 100 - a }], cols: [{ t: 'rain ' + b + '%', w: b }, { t: 'dry ' + (100 - b) + '%', w: 100 - b }], hit: [[0, 0], [0, 1], [1, 0]], s: 2, ct: { '1,1': { t: 'neither ' + F(none), s: 1 } }, foot: '?', footl: 'P(at least once) =' }

          if (games > 300) continue;
          return mk('prRounds', 3, 'PR3', {
            story: 'A pile has ' + B(t + ' cards') + ' and ' + B(g + ' ' + (g > 1 ? 'are aces' : 'is an ace')) + '. Draw one, put it back, draw again: two aces wins. You play ' + B(games + ' rounds') + '.',
            ask: 'About how many rounds would you expect to win?', q: 'Expected wins?', v, unit: 'wins', cue: 'P(two aces) × the rounds',
            errs: [[R(g / t * games, 2), 'Both draws must be aces', 1], [R(g * g / (t * t), 4), 'Now × the rounds', 2], [R(g * (g - 1) / (t * (t - 1)) * games, 2), 'It’s put back: same odds', 1], [R(2 * g / t * games, 2), 'And: multiply, don’t add', 1]],
            steps: [['each draw', 'P(ace) = ' + g + '/' + t], ['both aces', g + '/' + t + ' × ' + g + '/' + t + ' = ' + fr(g * g, t * t)], ['× rounds', fr(g * g, t * t) + ' × ' + games + ' = ' + v + ' wins']],
            pic: { k: 'bag', box: true, items: [{ c: 'Y', n: g, t: g > 1 ? 'aces' : 'ace', l: 'A' }, { c: 'M', n: t - g, t: 'other' }], foot: '?', footl: 'expected wins:' }

  const TOPICS = { rn: RN, sr: SR, pe: PE, lr: LR, le: LE, po: PO, cg: CG, me: ME, si: SI, st: ST, pr: PR };
  const lvlAt = n => n == null ? rnd(1, 3) : n < 3 ? 1 : n < 7 ? 2 : 3;   // a round: 3 one-step, 4 two-step, 3 three-step
  const gen = (topic, n) => pick(TOPICS[topic][lvlAt(n)])();
  const genMix = n => { const t = pick(Object.keys(TOPICS)); return Object.assign(gen(t, n), { topic: t }); };
  return { TOPICS, gen, genMix, check, resp, sameP, ps, lvlAt, R, F, pw, N };
})();

/* ===== DRILL SHELL START (same in every narrow trainer: Math 9 and Science 7) =====
   A page gives PAGE = { key, course, title, notes, tabs: [TAB, …] } and calls DRILL.boot(PAGE).
   Optional: PAGE.sep (heading separator after "Section N", default —), PAGE.secText(tab) (the whole heading text
   for the 📖 link), PAGE.sans (prompts in the plain font, for science). TAB.cols (2 or 3) sets the choice grid.
   A TAB is one narrow skill:
     id, code (local outcome), name (1–2 words), sec (notes section number), q (short label above the prompt)
     gen(n)                -> a new item (from MODEL); n is its place in the round (0–9), for a round that ramps up
     prompt(item)          -> HTML for the prompt (optional)
     kind: 'slots' | 'choice' | 'custom', or kind(item) -> one of those (a page that mixes typed and tap answers)
       slots(item)         -> ['y =', {k:'m', tint:'M'}, 'x +', {k:'b', tint:'B'}]   answer boxes inside the math
       choices(item)       -> [{v, label, math}]                                     tap to answer
       panel(box, item, A) -> builds controls; the stage can also set A.resp
     ready(resp, item)     -> a cue if the answer is not complete yet (optional)
     check(item, resp)     -> {ok, code, cue, partial}  cue is six words or fewer; partial: right but not clean (yellow dot)
     answer(item)          -> the right answer, as resp, for Show me
     draw(A, item, V)      -> draws the picture. V.phase: ask | wrong | right | show; V.res from check; V.anim on a new phase
     link(item)            -> {notes, sec, sep} for this item's 📖 link (optional; a tab whose items span topics)
     typeOf(item)          -> the question type, for weighting (optional; default: the item's form/kind/shape/... fields)
   Rounds are 10 items. A dot is green (first try), yellow (second try) or red (shown).
   Weighting: each question type has a score, saved per tab. A first-try right answer lowers it (to half weight at
   most), a miss or Show me raises it (to about 2.5× at most). Each new item is picked from 8 generated candidates
   by weight, so missed types come back more often and types answered right still appear, less often. */
const DRILL = (() => {
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const RM = DEBUG || !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const COARSE = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
  const ROUND = 10;
  const C = { stage: '#0b0f17', grid: '#18212f', grid2: '#222d3e', axis: '#c9d3e1', tick: '#8d9bb0', text: '#f5f7fb', muted: '#a7b4c8',
    blue: '#58c4dd', yellow: '#f7d96f', teal: '#5cd0b3', gold: '#f0ac5f', green: '#83c167', red: '#fc6255', pink: '#ef7fc6', edge: '#263246', panel: '#151d2b' };
  let PAGE, tab, item, resp = {}, att = 0, resolved = false, marks = [], phase = 'ask', lastRes = null, gen = 0, timers = [], lastKey = '';
  let save = { tab: null, best: {}, w: {} };
  function load() { if (DEBUG) return; try { const s = JSON.parse(localStorage.getItem(PAGE.key) || 'null'); if (s && typeof s === 'object') save = Object.assign(save, s); if (!save.w || typeof save.w !== 'object') save.w = {}; } catch (e) { /* storage blocked */ } }
  function store() { if (DEBUG) return; try { localStorage.setItem(PAGE.key, JSON.stringify(save)); } catch (e) { /* storage blocked */ } }

  /* ---------- SVG drawing kit ---------- */
  function el(tag, a, p) { const e = document.createElementNS(NS, tag); for (const k in a || {}) if (a[k] != null) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; }
  function tx(p, x, y, s, a) { const e = el('text', Object.assign({ x, y, 'text-anchor': 'middle', 'dominant-baseline': 'central', fill: C.text }, a), p); e.textContent = s; return e; }
  // Math text: single letters in italics.

          path('M' + x0 + ' ' + yb + 'l' + dx + ' ' + -dy + 'h' + wk + 'M' + (x0 + dx) + ' ' + (yb - dy) + 'L' + ax + ' ' + ay, { 'stroke-dasharray': '6 6', 'stroke-width': 1.8 });
          if (L.h) { path('M' + bx + ' ' + by + 'V' + ay, { stroke: C.muted, 'stroke-dasharray': '5 5', 'stroke-width': 1.8 }); dim(x0 + wk + dx + 20, by, ay, L.h); }
          if (L.l) { path('M' + ax + ' ' + ay + 'L' + fx + ' ' + yb, { stroke: C.yellow, 'stroke-dasharray': '5 5', 'stroke-width': 2 }); T((ax + fx) / 2 - 10, (ay + yb) / 2 + 8, L.l, { 'text-anchor': 'end' }); }
          if (L.w) T(x0 + wk / 2, yb + 20, L.w);
          yb = ay;
        }
      }
    });
    note(A, p); footer(A, p, V, H - 12);
  }

  /* ---------- two similar triangles: the small one and the large one (× f); matching sides share a colour ---------- */
  // p: { pts: [[x, y] x3] (y up), f, cs: ['G', 'Y', 'T'] (side i joins point i and i+1), la: [{t, s}], lb: [{t, s, q}], na, nb (names) }
  function pair(A, p, V, H) {
    const T = p.pts, mx = Math.min(...T.map(q => q[0])), my = Math.min(...T.map(q => q[1])), w = Math.max(...T.map(q => q[0])) - mx, h = Math.max(...T.map(q => q[1])) - my;
    const f = p.f, gap = .5 * w, k = Math.min(500 / (w * (1 + f) + gap), (H - 96) / (h * f)), yb = (H + h * f * k) / 2 + 4, x0 = 320 - (w * (1 + f) + gap) * k / 2;
    [[1, p.la, x0, p.na], [f, p.lb, x0 + (w + gap) * k, p.nb]].forEach(([s, L, xo, nm]) => {
      const S = T.map(q => [xo + (q[0] - mx) * s * k, yb - (q[1] - my) * s * k]), gx = S.reduce((a, q) => a + q[0], 0) / 3, gy = S.reduce((a, q) => a + q[1], 0) / 3;
      A.el('path', { d: 'M' + S.map(q => q.join(' ')).join('L') + 'z', fill: C.blue, 'fill-opacity': .08, stroke: 'none' }, A.svg);
      S.forEach((a, i) => {
        const b = S[(i + 1) % 3], sd = (L || [])[i] || {}, hc = hot(sd, V), c = hc ? C.red : col(p.cs[i]), ex = (a[0] + b[0]) / 2, ey = (a[1] + b[1]) / 2, dx = ex - gx, dy = ey - gy, D = Math.hypot(dx, dy) || 1;
        A.el('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: c, 'stroke-width': 3.5, 'stroke-linecap': 'round', 'stroke-dasharray': hc ? '8 6' : null }, A.svg);
        const t = sd.q ? qtext('?', sd.d, V) : sd.t;
        if (t && on({ s: sd.ts }, V)) lab(A, ex + dx / D * 20, ey + dy / D * 18, t, sd.q ? qcol('?', V, c) : c, Object.assign({ 'text-anchor': Math.abs(dx / D) > .5 ? (dx > 0 ? 'start' : 'end') : 'middle' }, anim({ s: sd.ts }, V)));
      });
      if (nm) lab(A, gx, gy + 2, nm, C.muted, { 'font-size': 14 });
    });
  }

  /* ---------- an outdoor scene for indirect measurement: shadows, or a mirror on the ground ---------- */
  // shadow: { mode: 'shadow', h, s, H, S, lh, ls, lH, lS }  (a person and a pole, with sun rays)
  // mirror: { mode: 'mirror', h, d1, d2, H, lh, l1, l2, lH, barn, lb } (eye height, mirror, the tall object, a barn beside it)
  function scene(A, p, V, H) {
    const yG = H - 46 - (p.foot ? 24 : 0), Tx = (x, y, s, c, an, a) => lab(A, x, y, qtext(s, null, V), s === '?' ? qcol('?', V, c) : c, Object.assign({ 'font-size': 16, 'text-anchor': an || 'middle' }, a || {}));
    const ground = (x1, x2) => A.el('line', { x1, x2, y1: yG, y2: yG, stroke: C.green, 'stroke-width': 3 }, A.svg);
    const person = (x, hp) => { A.el('line', { x1: x, x2: x, y1: yG, y2: yG - hp + 12, stroke: C.gold, 'stroke-width': 8, 'stroke-linecap': 'round' }, A.svg); A.el('circle', { cx: x, cy: yG - hp + 6, r: 7, fill: C.gold }, A.svg); };
    if (p.mode === 'shadow') {
      const gap = Math.max(p.s, p.S) * .35, tot = p.s + gap + p.S, k = Math.min((H - 96) / p.H, 520 / tot), x0 = 320 - tot * k / 2 + 10, x1 = x0 + (p.s + gap) * k;
      ground(x0 - 40, x1 + p.S * k + 30);
      [[x0, p.h, p.s, p.lh, p.ls], [x1, p.H, p.S, p.lH, p.lS]].forEach(([x, hh, ss, lh, ls], i) => {
        A.el('line', { x1: x, x2: x + ss * k, y1: yG + 1, y2: yG + 1, stroke: C.muted, 'stroke-width': 8, 'stroke-opacity': .6 }, A.svg);
        if (i) { A.el('line', { x1: x, x2: x, y1: yG, y2: yG - hh * k, stroke: C.text, 'stroke-width': 5 }, A.svg); A.el('path', { d: 'M' + x + ' ' + (yG - hh * k) + 'h26v14h-26z', fill: C.red }, A.svg); }
        else person(x, hh * k);
        A.el('line', { x1: x, y1: yG - hh * k, x2: x + ss * k, y2: yG, stroke: C.yellow, 'stroke-width': 2, 'stroke-dasharray': '7 6' }, A.svg);
        Tx(x - 14, yG - hh * k / 2, lh, i ? C.blue : C.gold, 'end');
        Tx(x + ss * k / 2, yG + 22, ls, C.muted);
      });
    } else {
      const tot = p.d1 + p.d2, k = Math.min((H - 110) / Math.max(p.H, p.barn || 0), 400 / tot), x0 = 320 - tot * k / 2 - 25, xm = x0 + p.d1 * k, xe = xm + p.d2 * k, ew = 34;
      ground(x0 - 30, xe + ew + 110);
      person(x0, p.h * k);
      A.el('rect', { x: xe, y: yG - p.H * k, width: ew, height: p.H * k, fill: C.blue, 'fill-opacity': .2, stroke: C.blue, 'stroke-width': 2.5 }, A.svg);
      if (p.barn) { const bh = p.barn * k; A.el('path', { d: 'M' + (xe + ew + 20) + ' ' + yG + 'v' + -bh * .7 + 'l' + 30 + ' ' + -bh * .3 + 'l30 ' + bh * .3 + 'v' + bh * .7 + 'z', fill: C.red, 'fill-opacity': .2, stroke: C.red, 'stroke-width': 2.5 }, A.svg); Tx(xe + ew + 50, yG - bh - 14, p.lb, C.red); }
      A.el('path', { d: 'M' + x0 + ' ' + (yG - p.h * k + 6) + 'L' + xm + ' ' + yG + 'L' + xe + ' ' + (yG - p.H * k), fill: 'none', stroke: C.yellow, 'stroke-width': 2, 'stroke-dasharray': '7 6' }, A.svg);
      A.el('rect', { x: xm - 12, y: yG - 3, width: 24, height: 6, fill: C.teal }, A.svg);
      Tx(x0 - 14, yG - p.h * k / 2, p.lh, C.gold, 'end');
      Tx((x0 + xm) / 2, yG + 22, p.l1, C.muted); Tx((xm + xe) / 2, yG + 22, p.l2, C.muted);
      if (p.lH && on({ s: p.sH }, V)) Tx(xe - 10, yG - p.H * k / 2, p.lH, C.blue, 'end', anim({ s: p.sH }, V));
    }
    footer(A, p, V, H - 16);
  }

  /* ---------- a bag (or pile) of counters; out = one taken out and kept ---------- */
  // p: { items: [{c, n, t, l}], out: {c, s, t}, box (a pile of cards, not a bag), foot, footl }
  function bag(A, p, V, H) {
    const all = []; p.items.forEach(g => { for (let i = 0; i < g.n; i++) all.push(g); });
    const n = all.length, cols = Math.min(7, Math.ceil(Math.sqrt(n * 1.6))), rows = Math.ceil(n / cols), d = 34;
    const w = cols * d + 40, h = rows * d + 36, cx = p.out ? 250 : 320, x0 = cx - w / 2, y0 = Math.max(28, (H - h - 80) / 2 + 10);
    if (p.box) A.el('rect', { x: x0, y: y0, width: w, height: h, rx: 10, fill: C.edge, 'fill-opacity': .18, stroke: C.muted, 'stroke-width': 2 }, A.svg);
    else A.el('path', { d: 'M' + (x0 + 14) + ' ' + y0 + 'Q' + (x0 - 12) + ' ' + (y0 + h * .7) + ' ' + (x0 + 26) + ' ' + (y0 + h) + 'H' + (x0 + w - 26) + 'Q' + (x0 + w + 12) + ' ' + (y0 + h * .7) + ' ' + (x0 + w - 14) + ' ' + y0 + 'Z', fill: C.edge, 'fill-opacity': .18, stroke: C.muted, 'stroke-width': 2.5 }, A.svg);
    const out = p.out && on(p.out, V) ? p.out : null; let gone = null;
    all.forEach((g, i) => {
      const x = x0 + 20 + d / 2 + (i % cols) * d, y = y0 + 18 + d / 2 + Math.floor(i / cols) * d, miss = out && !gone && g.c === out.c;
      if (miss) gone = [x, y];
      A.el('circle', { cx: x, cy: y, r: 13, fill: col(g.c), 'fill-opacity': miss ? 0 : .8, stroke: col(g.c), 'stroke-width': 2, 'stroke-dasharray': miss ? '4 4' : null }, A.svg);
      if (g.l && !miss) lab(A, x, y + 1, g.l, C.stage, { 'font-size': 14, 'font-weight': 700, style: 'stroke:none' });
    });
    // the counts under the bag, each in its own colour (after the draw: one fewer)
    p.items.forEach((g, i) => {
      const k = out && g.c === out.c ? g.n - 1 : g.n, x = cx + (i - (p.items.length - 1) / 2) * 118;
      lab(A, x, y0 + h + 26, k + ' ' + g.t, out && g.c === out.c ? C.green : col(g.c), Object.assign({ 'font-size': 16 }, out ? anim(out, V) : {}));
    });
    if (out) {
      const c = hot(out, V) ? C.red : col(out.c), a = anim(out, V), xo = 500, yo = y0 + h / 2;
      A.el('path', Object.assign({ d: 'M' + (gone[0] + 16) + ' ' + gone[1] + 'Q' + (xo - 60) + ' ' + (y0 - 20) + ' ' + (xo - 20) + ' ' + yo, fill: 'none', stroke: hot(out, V) ? C.red : C.gold, 'stroke-width': 2.5, 'stroke-dasharray': '6 5', 'marker-end': 'url(#a' + (hot(out, V) ? 'R' : 'G') + ')' }, a), A.svg);
      A.el('circle', Object.assign({ cx: xo, cy: yo, r: 15, fill: c, 'fill-opacity': .85, stroke: c, 'stroke-width': 2 }, a), A.svg);
      lab(A, xo, yo + 34, out.t, c, Object.assign({ 'font-size': 15 }, a));
    }
    footer(A, p, V, H - 16);
  }

  /* ---------- a spinner with n equal sections, the first `hit` of them coloured ---------- */
  // p: { n, hit, c, lab (text in each coloured section), t (name of the coloured part), foot, footl }
  function spin(A, p, V, H) {
    const r = Math.min(112, (H - 70) / 2), cx = 220, cy = 18 + r + Math.max(0, (H - 60 - 2 * r) / 2), c = col(p.c);
    for (let i = 0; i < p.n; i++) {
      const a0 = (i / p.n - .25) * 2 * Math.PI, a1 = ((i + 1) / p.n - .25) * 2 * Math.PI, on1 = i < p.hit;
      A.el('path', { d: 'M' + cx + ' ' + cy + 'L' + (cx + r * Math.cos(a0)) + ' ' + (cy + r * Math.sin(a0)) + 'A' + r + ' ' + r + ' 0 0 1 ' + (cx + r * Math.cos(a1)) + ' ' + (cy + r * Math.sin(a1)) + 'Z', fill: on1 ? c : C.edge, 'fill-opacity': on1 ? .6 : .3, stroke: C.stage, 'stroke-width': 2.5 }, A.svg);
      if (on1 && p.lab) { const am = (a0 + a1) / 2; lab(A, cx + r * .64 * Math.cos(am), cy + r * .64 * Math.sin(am), p.lab, C.text, { 'font-size': 12 }); }
    }
    A.el('circle', { cx, cy, r, fill: 'none', stroke: C.muted, 'stroke-width': 2 }, A.svg);
    A.el('line', { x1: cx, y1: cy, x2: cx + r * .55, y2: cy - r * .45, stroke: C.text, 'stroke-width': 4, 'stroke-linecap': 'round', 'marker-end': 'url(#aA)' }, A.svg);
    A.el('circle', { cx, cy, r: 6, fill: C.text }, A.svg);
    lab(A, 380, cy - 16, p.hit + ' ' + p.t, c, { 'font-size': 18, 'text-anchor': 'start' });
    lab(A, 380, cy + 14, p.n - p.hit + ' not ' + p.t, C.muted, { 'font-size': 18, 'text-anchor': 'start' });
    lab(A, 380, cy + 44, p.n + ' equal sections', C.muted, { 'font-size': 15, 'text-anchor': 'start' });
    footer(A, p, V, H - 16);
  }

  /* ---------- an outcome grid (a sample space), or an area model when rows and columns carry weights ---------- */
  // p: { rl, cl (row and column titles), rows: [{t, w}], cols: [{t, w}], hit: 'all' | [[i, j]], s (the step that shades them),
  //      dots (a dot per outcome), ct: {'i,j': {t, s}} (a cell label tied to a step), foot, footl }
  function grid(A, p, V, H) {
    const X0 = 190, X1 = 600, Y0 = 62, Y1 = H - 42, sw = a => a.reduce((s, e) => s + (e.w || 1), 0);
    const cut = (list, a, b) => { let acc = 0; const T = sw(list); return list.map(e => { const s = a + acc / T * (b - a); acc += e.w || 1; return [s, a + acc / T * (b - a)]; }); };
    const RX = cut(p.cols, X0, X1), RY = cut(p.rows, Y0, Y1), hit = (i, j) => p.hit === 'all' || p.hit.some(h => h[0] === i && h[1] === j);
    const shade = { s: p.s }, sOn = on(shade, V), hc = hot(shade, V);
    lab(A, (X0 + X1) / 2, Y0 - 40, p.cl, C.blue, { 'font-size': 15 });
    lab(A, X0 - 12, Y0 - 40, p.rl + ' ↓', C.yellow, { 'font-size': 15, 'text-anchor': 'end' });
    p.cols.forEach((e, j) => lab(A, (RX[j][0] + RX[j][1]) / 2, Y0 - 14, e.t, C.blue, { 'font-size': p.cols.length > 4 ? 14 : 15 }));
    p.rows.forEach((e, i) => lab(A, X0 - 12, (RY[i][0] + RY[i][1]) / 2, e.t, C.yellow, { 'font-size': 15, 'text-anchor': 'end' }));
    p.rows.forEach((_, i) => p.cols.forEach((__, j) => {
      const [xa, xb] = RX[j], [ya, yb] = RY[i], h = hit(i, j) && sOn, c = hc ? C.red : C.green;
      A.el('rect', Object.assign({ x: xa, y: ya, width: xb - xa, height: yb - ya, fill: h ? c : 'none', 'fill-opacity': .32, stroke: C.edge, 'stroke-width': 2 }, h ? anim(shade, V) : {}), A.svg);
      if (p.dots && h) A.el('circle', Object.assign({ cx: (xa + xb) / 2, cy: (ya + yb) / 2, r: 6, fill: c }, anim(shade, V)), A.svg);
      const ct = p.ct && p.ct[i + ',' + j];
      if (ct && on(ct, V)) lab(A, (xa + xb) / 2, (ya + yb) / 2, ct.t, hot(ct, V) ? C.red : C.text, Object.assign({ 'font-size': 15 }, anim(ct, V)));
    }));
    footer(A, p, V, H - 14);
  }

  const PIC = { nl, rects, tri, chain, cube, bar, graph, table, flow, shape, circ, solid, pair, scene, bag, spin, grid };

  /* ---------- the step chain ---------- */
  function steps(A, it, V, top) {
    const n = it.steps.length, rh = n > 3 ? 28 : 32, bad = V.phase === 'wrong' && V.res ? V.res.s : -2;
    it.steps.forEach((st, i) => {
      const y = top + i * rh + rh / 2, flag = i === bad, c = flag ? C.red : LVC[it.lvl], a = done(V) && V.anim ? { class: 'fade', style: 'animation-delay:' + (i * DLY) + 's' } : {};
      A.el('circle', { cx: 26, cy: y, r: 12, fill: c, 'fill-opacity': V.phase === 'ask' ? .25 : .9, stroke: c, 'stroke-width': 1.5 }, A.svg);
      lab(A, 26, y + 1, String(i + 1), V.phase === 'ask' ? c : C.stage, { 'font-size': 14, 'font-weight': 700, style: 'stroke:none' });
      if (V.phase === 'ask') { A.el('line', { x1: 48, x2: 610, y1: y, y2: y, stroke: C.edge, 'stroke-width': 2, 'stroke-dasharray': '4 8' }, A.svg); return; }
      lab(A, 46, y, st.l, flag ? C.red : C.muted, Object.assign({ 'font-size': 14, 'text-anchor': 'start', class: flag ? 'pulse' : '' }, done(V) ? a : {}));
      if (!done(V)) { if (flag) lab(A, 200, y, '← check this step', C.red, { 'font-size': 15, 'text-anchor': 'start' }); return; }
      const fs = Math.min(17, 430 / Math.max(1, st.m.length * .54));
      lab(A, 200, y, st.m, i === n - 1 ? C.green : C.text, Object.assign({ 'font-size': fs, 'text-anchor': 'start' }, a));
    });
  }

  function draw(A, it, V) {
    ITEM = it;
    const n = it.steps.length, rh = n > 3 ? 28 : 32, top = 420 - n * rh - 8;
    A.el('line', { x1: 14, x2: 626, y1: top - 8, y2: top - 8, stroke: C.edge, 'stroke-width': 1.5 }, A.svg);
    PIC[it.pic.k](A, it.pic, V, top - 12);
    steps(A, it, V, top);
  }

  /* ---------- a tab: one topic, a round ramping from one step to three ---------- */
  const unit = s => ({ h: '<span class="u">' + s + '</span>' });
  // A polynomial answer: one coefficient box per power of x, up to the item's degree (deg).
  const polySlots = it => (it.deg === 2 ? [{ k: 'c2', label: 'x squared coefficient', narrow: true }, 'x² +'] : [])
    .concat([{ k: 'c1', label: 'x coefficient', narrow: true }, 'x +', { k: 'c0', label: 'constant', narrow: true }], it.unit ? [unit(it.unit)] : []);
  function tab(o) {
    return {
      id: o.id, code: o.code, name: o.name, sec: o.sec || 1, notes: o.notes, sep: o.sep,
      // The question is written out in full at the end of the story (it.ask), so the short title is left off.
      q: it => it.ask ? '' : it.q, kind: 'slots', gen: o.gen, typeOf: it => it.t,
      prompt: it => '<div class="lvl l' + it.lvl + '">Level ' + it.lvl + ' · ' + LVN[it.lvl] + '</div><div class="story">' + it.story + (it.ask ? ' <span class="ask">' + it.ask + '</span>' : '') + '</div>',
      slots: it => it.poly ? polySlots(it) : [it.pre ? unit(it.pre) : null, { k: 'v', label: 'answer', wide: true }, it.unit ? unit(it.unit) : null].filter(Boolean),
      check: (it, r) => MODEL.check(it, r), answer: it => it.poly ? MODEL.resp(it, it.poly) : { v: it.ans }, link: o.link, draw
    };
  }
  return { tab, draw, PIC, LVN };
})();
/* ===================== PAGE: tabs (pictures and the step chain are in wp.js) ===================== */
const NOTES9 = {
  rn: { notes: '../notes/rational-numbers/math9-rational-numbers-notes-v1.html' },
  sr: { notes: '../notes/square-roots/math9-square-roots-notes-v1.html' },
  pe: { notes: '../notes/powers-exponents/math9-powers-notes-v1.html', sep: '·' },
  lr: { notes: '../notes/linear-relations/math9-linear-relations-notes-v1.html' },
  le: { notes: '../notes/linear-equations/math9-linear-equations-notes-v1.html' },
  po: { notes: '../notes/polynomials/math9-polynomials-notes-v1.html' },
  cg: { notes: '../notes/circle-geometry/math9-circle-geometry-notes-v1.html' },

const link9 = topic => it => Object.assign({ sec: +it.code.replace(/\D/g, '') }, NOTES9[it.topic || topic]);
const tab9 = (id, code, name) => WP.tab(Object.assign({ id, code, name, gen: n => MODEL.gen(id, n), link: link9(id) }, NOTES9[id]));
const PAGE = {
  key: 'math9-word-problems-trainer-v1', course: 'Math 9 · Word problems', title: 'Word Problems',
  notes: NOTES9.rn.notes,
  tabs: [
    tab9('rn', 'RN', 'Rational'), tab9('sr', 'SR', 'Roots'), tab9('pe', 'PE', 'Powers'),
    tab9('lr', 'LR', 'Relations'), tab9('le', 'LE', 'Equations'), tab9('po', 'PO', 'Polynomials'),
    tab9('cg', 'CG', 'Circles'), tab9('me', 'ME', 'Solids'), tab9('si', 'SI', 'Similarity'),
    tab9('st', 'ST', 'Scatter'), tab9('pr', 'PR', 'Probability'),

  ]
};
