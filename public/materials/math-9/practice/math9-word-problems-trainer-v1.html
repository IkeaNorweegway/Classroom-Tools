<!-- =====================================================================
   MATH 9 WORD PROBLEMS TRAINER (narrow trainer format, see _sims-context.md)
   Math 9 | every topic | used after the lessons: it does not teach, each item's 📖 opens its own notes section.
   One tab per topic. The skill on every tab is the same narrow one: turn a short story into the right steps.
   A round of 10 ramps up: items 1–3 are Level 1 (one step), 4–7 Level 2 (two steps), 8–10 Level 3 (three or more).
   Each level draws from three story types, so a tab has nine; Mixed draws from every topic.
     RN Rational   temperatures, balances, depths, rope in eighths, change, a mean, a diver, shares   RN2 RN3 RN5
     SR Roots      side from area, decimal and estimated roots, fences, the Pythagorean theorem in a scene   SR1–SR4
     PE Powers     doubling, cubes, powers of ten, half-life, packing cubes, a chain message   PE1 PE4 PE5 PE7
     LR Relations  phone bill, candle, pay rate; plumber's rate, bowling games, plant table; electrician, balloon, tiles   LR1–LR4
     LE Equations  novels, a fraction of savings, card packs; tickets + fee, fair rides, number trick; gyms, dog run, market   LE1–LE5
     PO Polynomials  triangle perimeter, money kept, lockers; deck, poster, flower bed; shed, cut-out, frame   PO3–PO6
                     (the answer is a polynomial typed into coefficient boxes; the cut-out ends with x substituted)
   The picture is a schematic of the story (a number line, a bar, rectangles or an area model, a triangle in its
   scene, a chain of × steps, a cube, a graph, a table of values, a flow of operations with its undo) above the step
   chain: one row per step, empty until solved. A wrong try names the mistake and turns its step red; Show me fills
   the steps in order.
   Named mistakes (per story type, in the model): subtracting a negative, the sign of a fall or a dive, one step
   left out (the fee, the coldest day, the shared edge, the last subtraction), √ as ÷ 2, area for side, no root,
   adding instead of squaring, the exponent for the value, adding exponents in a power of a power, × 3 for cubed;
   the fee left out or multiplied, slope from totals, the starting value left out, off by one figure, undoing in the
   wrong order, rounding the wrong way, rates added, the middle terms, one term multiplied, subtracting only the
   first term, the shed or photo not taken away, perimeter for area.
   Model: generated stories with exact answers; every answer and every named mistake is checked in the tests.
   Shared parts: wp.js (pictures, step chain, the tab). ?debug=1 puts DRILL (and MODEL) on window, no saving or motion.
   ===================================================================== -->

<div class="app">
  <section class="stage" id="stageWrap"><svg id="svg" viewBox="0 0 640 420" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Picture for this question"></svg></section>
  <aside class="side" id="side">

<script>
const DEBUG = /[?&]debug=1/.test(location.search);

/* ===== DRILL KIT START (no DOM): exact fractions and seeded random ===== */
const Q = (() => {
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);
  const q = (n, d) => { d = d == null ? 1 : d; if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return { n: n / g, d: d / g }; };
  const of = v => typeof v === 'number' ? (Number.isInteger(v) ? q(v) : dec(String(v))) : v;
  const add = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d + b.n * a.d, a.d * b.d); };
  const sub = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d - b.n * a.d, a.d * b.d); };
  const mul = (a, b) => { a = of(a); b = of(b); return q(a.n * b.n, a.d * b.d); };
  const div = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d, a.d * b.n); };
  const neg = a => { a = of(a); return q(-a.n, a.d); };
  const eq = (a, b) => { if (a == null || b == null) return false; a = of(a); b = of(b); return a.n === b.n && a.d === b.d; };
  const val = a => { a = of(a); return a.n / a.d; };
  const isInt = a => of(a).d === 1;
  function dec(s) { const m = /^(-?)(\d*)\.?(\d*)$/.exec(s); if (!m) return null; const f = m[3] || ''; return q((m[1] ? -1 : 1) * parseInt((m[2] || '0') + f, 10), Math.pow(10, f.length)); }
  // Text a student typed -> fraction, '' for blank, or null if it is not a number.
  function parse(s) {
    s = String(s == null ? '' : s).replace(/[−–—]/g, '-').replace(/\s+/g, '').replace(/^\+/, '');
    if (s === '') return '';
    if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');
    if (/^-?\d+(\.\d+)?$/.test(s) || /^-?\d*\.\d+$/.test(s)) return dec(s);
    const m = /^(-?)\(?(-?\d+)\)?\/\(?(-?\d+)\)?$/.exec(s);
    if (m) { const d = parseInt(m[3], 10); if (d === 0) return null; return q((m[1] ? -1 : 1) * parseInt(m[2], 10), d); }
    return null;
  }
  const str = a => { a = of(a); return (a.n < 0 ? '−' : '') + (a.d === 1 ? Math.abs(a.n) : Math.abs(a.n) + '/' + a.d); };
  let rand = Math.random;
  function seed(n) { let a = n >>> 0; rand = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rnd = (lo, hi) => lo + Math.floor(rand() * (hi - lo + 1));
  const pick = arr => arr[rnd(0, arr.length - 1)];
  const nz = (lo, hi) => { let k; do { k = rnd(lo, hi); } while (k === 0); return k; };
  const chance = p => rand() < p;
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  return { gcd, lcm, q, of, add, sub, mul, div, neg, eq, val, isInt, parse, str, seed, rnd, pick, nz, chance, shuffle };
})();
/* ===== DRILL KIT END ===== */


/* ===================== MODEL START (no DOM) ===================== */
/* Math 9 word problems. Every topic has three levels: 1 = one step, 2 = two steps, 3 = three or more.
   An item: { t (problem type), lvl, code (notes section, e.g. RN2), story (HTML, numbers in <b>), q (2–4 words),
   v (the answer), dp (decimal places shown), tol, pre/unit (around the answer box), ans (Show me text, optional),
   errs: [{v, cue, s}] (a named mistake: its value, a cue of six words or fewer, the step it skips or gets wrong),
   cue (when no named mistake matches), steps: [{l, m}] (label, working), pic (a schematic, drawn by wp.js) }.
   A polynomial answer (PO) gives poly: {2, 1, 0} (coefficients) instead of v, and deg (2 or 1: how many boxes);
   its named mistakes are polynomials too. */
const MODEL = (() => {
  const { rnd, pick } = Q;
  const R = (x, d) => { const k = Math.pow(10, d == null ? 6 : d); return Math.round((x + (x < 0 ? -1 : 1) * 1e-9) * k) / k; };
  const F = (x, d) => { const s = d == null ? String(R(x, 4)) : R(x, d).toFixed(d); return s.replace('-', '−'); };
  const P = (x, d) => x < 0 ? '(' + F(x, d) + ')' : F(x, d);              // a negative in brackets
  const $ = x => (x < 0 ? '−$' : '$') + Math.abs(R(x, 2)).toFixed(2);
  const B = s => '<b>' + s + '</b>';
  const N = n => Math.round(n).toLocaleString('en-CA');                  // 4096 -> 4,096
  const SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻', '−': '⁻', 'n': 'ⁿ', 'k': 'ᵏ', 'm': 'ᵐ' };
  const pw = (b, e) => b + String(e).split('').map(c => SUP[c] || c).join('');   // 2, 10 -> 2¹⁰
  const NAMES = ['Ava', 'Liam', 'Noah', 'Maya', 'Ethan', 'Zoe', 'Owen', 'Priya', 'Jayden', 'Hana', 'Lucas', 'Amara', 'Kai', 'Sofia', 'Mateo', 'Leah'];
  const TOWNS = ['Edmonton', 'Calgary', 'Red Deer', 'Grande Prairie', 'Fort McMurray', 'Lethbridge', 'St. Albert', 'Medicine Hat'];

  // Polynomials {2, 1, 0}: the same?  its text (3x² − 2x + 5)?  a binomial in brackets?
  const co = (p, e) => p && p[e] || 0;
  const sameP = (a, b) => [0, 1, 2].every(e => Math.abs(co(a, e) - co(b, e)) < 1e-9);
  const ps = p => { const out = []; [2, 1, 0].forEach(e => { const c = co(p, e); if (!c) return; const a = Math.abs(c), body = (a === 1 && e ? '' : F(a)) + ['', 'x', 'x²'][e]; out.push(out.length ? (c < 0 ? '− ' : '+ ') + body : (c < 0 ? '−' : '') + body); }); return out.join(' ') || '0'; };
  const bn = (a, b) => '(' + ps({ 1: a, 0: b }) + ')';
  function mk(t, lvl, code, o) {

      function leTrick() {
        const x = rnd(2, 9), a = rnd(2, 5), b = rnd(3, 12), c = a * (x + b), who = pick(NAMES);

    3: [

  /* ============ PO · Polynomials (the answer is a polynomial in x) ============ */
  const X = 9;                                                            // x in the pictures (a schematic, not to scale)
  const grid = (cols, rows, cells, foot) => {                              // an area model: cols/rows [{v, t}], cells[r][c] {c, t}
    const rs = []; let y = 0;
    rows.forEach((rw, i) => { let x = 0; cols.forEach((cl, j) => { const cc = cells[i][j]; rs.push(Object.assign({ x, y, w: cl.v, h: rw.v, c: cc.c, t: cc.t || ' ', td: cc.td }, i === 0 ? { tw: cl.t } : {}, j === 0 ? { lh: rw.t } : {})); x += cl.v; }); y += rw.v; });
    return { k: 'rects', foot, rs };
  };
  const PO = {
    1: [
      function poTri() {
        const s = [0, 1, 2].map(() => [rnd(1, 6), Q.nz(-6, 9)]), p = { 1: s[0][0] + s[1][0] + s[2][0], 0: s[0][1] + s[1][1] + s[2][1] };
        return mk('poTri', 1, 'PO3', {
          story: 'A triangular garden has sides ' + s.map(([a, b]) => B(bn(a, b))).join(', ') + ' metres.',
          q: 'Perimeter?', poly: p, unit: 'm', cue: 'x-terms together, numbers together',
          errs: [[{ 1: s[0][0] + s[1][0], 0: s[0][1] + s[1][1] }, 'Add all three sides', 0], [{ 1: p[1], 0: s.reduce((t, q) => t + Math.abs(q[1]), 0) }, 'Watch the negative numbers', 0], [{ 1: p[1] + p[0], 0: 0 }, 'x-terms and numbers don’t combine', 0]],
          steps: [['add like terms', s.map(([a, b]) => bn(a, b)).join(' + ') + ' = ' + ps(p)]],
          pic: { k: 'shape', q: true, pts: [[0, 4], [2.2, 0], [6, 4]], sides: s.map(([a, b]) => ({ t: ps({ 1: a, 0: b }) })) }
        });
      },
      function poKeep() {
        const a = rnd(8, 15), b = rnd(10, 40), c = rnd(1, 4), d = rnd(2, 15), who = pick(NAMES), p = { 1: a - c, 0: b - d };
        return mk('poKeep', 1, 'PO4', {
          story: who + ' earns ' + B(ps({ 1: a, 0: b })) + ' dollars mowing for x hours and spends ' + B(ps({ 1: c, 0: d })) + ' dollars on gas.',
          q: 'Amount kept?', poly: p, unit: 'dollars', cue: 'Earned − gas: every term',
          errs: [[{ 1: a - c, 0: b + d }, 'Subtract both terms of the gas', 0], [{ 1: a + c, 0: b + d }, 'Kept = earned − gas', 0], [{ 1: a - c, 0: d - b }, 'Earned first, then minus gas', 0]],
          steps: [['earned − gas', bn(a, b) + ' − ' + bn(c, d) + ' = ' + ps(p)]],
          pic: { k: 'bar', rows: [{ t: 'earned', segs: [{ v: a * X + b, t: ps({ 1: a, 0: b }), c: 'N' }] }, { t: 'gas + kept', segs: [{ v: c * X + d, t: ps({ 1: c, 0: d }), c: 'R' }, { v: (a - c) * X + b - d, t: '?', q: true, c: 'Y' }] }] }
        });
      },
      function poLockers() {
        const a = rnd(2, 6), b = rnd(1, 9), c = rnd(3, 6), p = { 1: a * c, 0: b * c };
        return mk('poLockers', 1, 'PO5', {
          story: 'A row of ' + B(c + ' lockers') + ' is built. Each locker is ' + B(bn(a, b) + ' cm') + ' wide.',
          q: 'Total width?', poly: p, unit: 'cm', cue: 'Multiply both terms by ' + c,
          errs: [[{ 1: a * c, 0: b }, 'Multiply both terms by ' + c, 0], [{ 1: a, 0: b * c }, 'Multiply both terms by ' + c, 0], [{ 1: a + c, 0: b }, 'Multiply, don’t add', 0]],
          steps: [['× ' + c, c + bn(a, b) + ' = ' + ps(p)]],
          pic: { k: 'rects', foot: '?', rs: Array.from({ length: c }, (_, i) => ({ x: i, y: 0, w: 1, h: 2.2, c: 'L', t: i === 0 ? ps({ 1: a, 0: b }) : '' })) }
        });
      }
    ],
    2: [
      function poDeck() {
        const a = rnd(2, 8), b = rnd(1, 7), p = { 2: 1, 1: a + b, 0: a * b };
        return mk('poDeck', 2, 'PO6', {
          story: 'A rectangular deck is ' + B('(x + ' + a + ') m') + ' long and ' + B('(x + ' + b + ') m') + ' wide.',

          errs: [[{ 2: 1, 0: a * b }, 'Don’t forget the middle terms', 0], [{ 2: 1, 1: a + b, 0: a + b }, 'The corner is ' + a + ' × ' + b, 0], [{ 1: 4, 0: 2 * (a + b) }, 'Area, not perimeter', 0], [{ 2: 1, 1: a, 0: a * b }, 'There are two middle terms', 1], [{ 2: 1, 1: b, 0: a * b }, 'There are two middle terms', 1]],

            [[{ c: 'L', td: 'x²' }, { c: 'T', td: a + 'x' }], [{ c: 'T', td: b + 'x' }, { c: 'Y', td: String(a * b) }]], '?')
        });

          steps: [['lot', '(x + ' + a + ')(x + ' + b + ') = ' + ps(lot)], ['shed', 'x · x = x²'], ['lot − shed', ps(lot) + ' − x² = ' + ps(p)]],
          pic: grid([{ v: X, t: 'x' }, { v: a, t: '+ ' + a }], [{ v: X, t: 'x' }, { v: b, t: '+ ' + b }],
            [[{ c: 'R', t: 'shed', td: 'shed x²' }, { c: 'N', td: a + 'x' }], [{ c: 'N', td: b + 'x' }, { c: 'N', td: String(a * b) }]], '?')
        });
      },
      function poCutout() {
        const k = rnd(2, 3), a = rnd(1, 6), b = rnd(1, 5), x = rnd(2, 8), full = { 2: k, 1: k * b + a, 0: a * b }, p = { 2: k - 1, 1: k * b + a, 0: a * b };
        const val = x2 => p[2] * x2 * x2 + p[1] * x2 + p[0], v = val(x);
        return mk('poCutout', 3, 'PO6', {
          story: 'A rectangle is ' + B(bn(k, a) + ' cm') + ' by ' + B('(x + ' + b + ') cm') + '. A square, ' + B('x cm') + ' on a side, is cut out. Let ' + B('x = ' + x) + '.',
          q: 'Area left?', v, unit: 'cm²', cue: 'Expand, subtract x², substitute',
          errs: [[v + x * x, 'Cut out the square', 1], [v - a * x, 'There are two middle terms', 0], [v - (k * b + a) * x, 'Don’t forget the middle terms', 0], [v + x * x - 4 * x, 'The square’s area is x²', 1]],
          steps: [['expand', bn(k, a) + '(x + ' + b + ') = ' + ps(full)], ['− x²', ps(full) + ' − x² = ' + ps(p)], ['x = ' + x, (p[2] === 1 ? '' : p[2]) + '(' + x * x + ') + ' + p[1] + '(' + x + ') + ' + p[0] + ' = ' + v]],

        return mk('poFrame', 3, 'PO6', {
          story: 'A square photo is ' + B('x cm') + ' on a side. Its frame adds ' + B(a + ' cm') + ' on the left and right, and ' + B(b + ' cm') + ' on the top and bottom.',

        });

    ]

  const TOPICS = { rn: RN, sr: SR, pe: PE, lr: LR, le: LE, po: PO };
  const lvlAt = n => n == null ? rnd(1, 3) : n < 3 ? 1 : n < 7 ? 2 : 3;   // a round: 3 one-step, 4 two-step, 3 three-step
  const gen = (topic, n) => pick(TOPICS[topic][lvlAt(n)])();
  const genMix = n => { const t = pick(Object.keys(TOPICS)); return Object.assign(gen(t, n), { topic: t }); };
  return { TOPICS, gen, genMix, check, resp, sameP, ps, lvlAt, R, F, pw, N };
})();

   for the 📖 link), PAGE.sans (prompts in the plain font, for science). TAB.cols (2 or 3) sets the choice grid.

        const t = s.q ? qtext('?', s.d, V) : s.t; if (t && w > 26) lab(A, x + w / 2, y + rh / 2, t, s.q ? qcol('?', V, c) : C.text, Object.assign({ 'font-size': w > 80 ? 16 : 13 }, a));

      });
      if (r.brace) { const b = r.brace; lab(A, 60 + tot(r) * px / 2, y + rh + 24, qtext(b, null, V), qcol(b, V, C.muted), { 'font-size': 16 }); }
    });
  }

  /* ---------- a graph in the first quadrant: lines, points, a rise/run triangle, a reading ---------- */
  // p: { xl, yl, lines: [{m, b, x0, x1, c, s, t}], pts: [{x, y, t, c, s, q, pos}], rr: {a:[x,y], b:[x,y], run, rise, s0, s1}, read: {x, s} }
  function graph(A, p, V, H) {
    const X0 = 86, X1 = 596, Y0 = H - 40, Y1 = 34, xs = [0], ys = [0];
    (p.pts || []).forEach(e => { xs.push(e.x); ys.push(e.y); });
    (p.lines || []).forEach(l => { xs.push(l.x0, l.x1); ys.push(l.m * l.x0 + l.b, l.m * l.x1 + l.b); });
    if (p.read) xs.push(p.read.x);
    const xhi = Math.max(...xs) * 1.1, yhi = Math.max(...ys) * 1.14;
    const sx = x => X0 + x / xhi * (X1 - X0), sy = y => Y0 - y / yhi * (Y0 - Y1);
    const tx = [1, 2, 5, 10, 20, 50, 100].find(k => k >= xhi / 8) || nice(xhi / 7), ty = nice(yhi / 5);   // whole-number steps across (hours, months)
    for (let v = tx; v <= xhi; v += tx) { A.el('line', { x1: sx(v), x2: sx(v), y1: Y0, y2: Y1, stroke: C.grid, 'stroke-width': 1 }, A.svg); lab(A, sx(v), Y0 + 18, fmt(v), C.tick, { 'font-size': 13 }); }
    for (let v = ty; v <= yhi; v += ty) { A.el('line', { x1: X0, x2: X1, y1: sy(v), y2: sy(v), stroke: C.grid, 'stroke-width': 1 }, A.svg); lab(A, X0 - 8, sy(v), fmt(v), C.tick, { 'font-size': 13, 'text-anchor': 'end' }); }
    A.el('line', { x1: X0, x2: X1 + 12, y1: Y0, y2: Y0, stroke: C.axis, 'stroke-width': 2.5, 'marker-end': 'url(#aA)' }, A.svg);
    A.el('line', { x1: X0, x2: X0, y1: Y0, y2: Y1 - 14, stroke: C.axis, 'stroke-width': 2.5, 'marker-end': 'url(#aA)' }, A.svg);
    lab(A, X0 - 8, Y0 + 18, '0', C.tick, { 'font-size': 13, 'text-anchor': 'end' });
    if (p.xl) lab(A, X1, Y0 + 34, p.xl, C.muted, { 'font-size': 14, 'text-anchor': 'end' });
    if (p.yl) lab(A, X0 + 10, Y1 - 12, p.yl, C.muted, { 'font-size': 14, 'text-anchor': 'start' });
    (p.lines || []).forEach(l => {
      if (!on(l, V)) return;
      const c = hot(l, V) ? C.red : col(l.c), a = anim(l, V);
      A.el('line', Object.assign({ x1: sx(l.x0), y1: sy(l.m * l.x0 + l.b), x2: sx(l.x1), y2: sy(l.m * l.x1 + l.b), stroke: c, 'stroke-width': 3.5, 'stroke-dasharray': l.dash ? '9 7' : null }, a), A.svg);
      if (l.t) lab(A, sx(l.x1) + 6, sy(l.m * l.x1 + l.b), l.t, c, Object.assign({ 'font-size': 15, 'text-anchor': 'start' }, a));
    });
    if (p.rr) {
      const r = p.rr, [ax, ay] = [sx(r.a[0]), sy(r.a[1])], [bx, by] = [sx(r.b[0]), sy(r.b[1])];
      [[r.s0, ax, ay, bx, ay, r.run, (ax + bx) / 2, ay + (by < ay ? 20 : -14), 'middle'], [r.s1, bx, ay, bx, by, r.rise, bx + 10, (ay + by) / 2, 'start']].forEach(([s, x1, y1, x2, y2, t, lx, ly, an]) => {
        const e = { s }; if (!on(e, V)) return;
        const c = hot(e, V) ? C.red : C.gold, a = anim(e, V);
        A.el('line', Object.assign({ x1, y1, x2, y2, stroke: c, 'stroke-width': 2.5, 'stroke-dasharray': '7 5' }, a), A.svg);
        if (t) lab(A, lx, ly, t, c, Object.assign({ 'font-size': 15, 'text-anchor': an }, a));
      });
    }
    if (p.read && on(p.read, V)) {
      const r = p.read, l = p.lines[0], y = l.m * r.x + l.b, c = hot(r, V) ? C.red : C.green, a = anim(r, V);
      A.el('path', Object.assign({ d: 'M' + sx(r.x) + ' ' + Y0 + 'V' + sy(y) + 'H' + X0, fill: 'none', stroke: c, 'stroke-width': 2.5, 'stroke-dasharray': '6 5' }, a), A.svg);
    }
    (p.pts || []).forEach(e => {
      if (!on(e, V)) return;
      const x = sx(e.x), y = sy(e.y), c = hot(e, V) ? C.red : e.q ? qcol('?', V, col(e.c)) : col(e.c), a = anim(e, V);
      A.el('circle', Object.assign({ cx: x, cy: y, r: 7, fill: c, stroke: C.stage, 'stroke-width': 2 }, a), A.svg);
      const t = e.q ? qtext('?', e.d, V) : e.t, pos = e.pos || 'l';
      if (t) lab(A, x + (pos === 'r' ? 14 : pos === 'l' ? -14 : 0), y + (pos === 'b' ? 24 : pos === 'a' ? -20 : 0), t, c, Object.assign({ 'font-size': 15, 'text-anchor': pos === 'r' ? 'start' : pos === 'l' ? 'end' : 'middle' }, a));
    });
  }

  /* ---------- a table of values with the change between columns ---------- */
  // p: { xh, yh, cols: [{x, y, q, d, s, ghost}], dx: [{i, t, s}], dy: [{i, t, s}] }  (i = the gap after column i)
  function table(A, p, V, H) {
    const n = p.cols.length, hw = 104, cw = Math.min(100, 470 / n), rh = 50, X = 320 - (hw + n * cw) / 2 + hw, yA = (H - 2 * rh) / 2 + 6, yB = yA + rh;
    lab(A, X - 12, yA + rh / 2, p.xh, C.blue, { 'text-anchor': 'end' }); lab(A, X - 12, yB + rh / 2, p.yh, C.yellow, { 'text-anchor': 'end' });
    p.cols.forEach((e, i) => {
      if (!on(e, V)) return;
      const x = X + i * cw, a = anim(e, V), da = e.ghost ? '6 5' : null;
      [[yA, String(e.x), C.blue], [yB, e.q ? qtext('?', e.d, V) : String(e.y), e.q ? qcol('?', V, C.yellow) : C.yellow]].forEach(([y, t, c]) => {
        A.el('rect', Object.assign({ x: x + 2, y: y + 2, width: cw - 4, height: rh - 4, rx: 5, fill: c, 'fill-opacity': .1, stroke: c, 'stroke-width': 2, 'stroke-dasharray': da }, a), A.svg);
        lab(A, x + cw / 2, y + rh / 2, t, c, Object.assign({ 'font-size': t.length > 6 ? 15 : 18 }, a));
      });
    });
    const gap = (list, y, up) => (list || []).forEach(d => {
      if (!on(d, V)) return;
      const x1 = X + d.i * cw + cw / 2, x2 = x1 + (d.span || 1) * cw, c = hot(d, V) ? C.red : C.gold, a = anim(d, V), k = up ? -1 : 1;
      A.el('path', Object.assign({ d: 'M' + (x1 + 6) + ' ' + y + 'Q' + (x1 + x2) / 2 + ' ' + (y + k * 30) + ' ' + (x2 - 6) + ' ' + y, fill: 'none', stroke: c, 'stroke-width': 2.5, 'marker-end': 'url(#a' + (c === C.red ? 'R' : 'G') + ')' }, a), A.svg);
      lab(A, (x1 + x2) / 2, y + k * 30, d.t, c, Object.assign({ 'font-size': 15 }, a));
    });
    gap(p.dx, yA - 4, true); gap(p.dy, yB + rh + 4, false);
  }

  /* ---------- a flow of operations, with the undo steps underneath ---------- */
  // p: { boxes: [{t, d, s, q}], ops: ['+ 4', '× 3'], inv: [{t, s}] (right to left) }
  function flow(A, p, V, H) {
    const n = p.boxes.length, bw = 96, gap = (560 - n * bw) / (n - 1), y = H / 2 - 50, xAt = i => 40 + i * (bw + gap);
    p.boxes.forEach((b, i) => {
      const x = xAt(i), q = b.q, c = q ? qcol('?', V, C.yellow) : i === n - 1 ? C.blue : C.edge;
      A.el('rect', { x, y, width: bw, height: 50, rx: 8, fill: c, 'fill-opacity': .14, stroke: c, 'stroke-width': 2.5 }, A.svg);
      const t = q ? qtext('?', b.d, V) : on(b, V) ? (done(V) && b.d != null ? b.d : b.t) : '';
      if (t) lab(A, x + bw / 2, y + 25, t, q ? c : C.text, Object.assign({ 'font-size': 18 }, b.s != null ? anim(b, V) : {}));
      if (i < n - 1) {
        const xa = x + bw, xb = xAt(i + 1);
        A.el('line', { x1: xa + 5, x2: xb - 7, y1: y + 14, y2: y + 14, stroke: C.gold, 'stroke-width': 2.5, 'marker-end': 'url(#aG)' }, A.svg);
        lab(A, (xa + xb) / 2, y - 6, p.ops[i], C.gold, { 'font-size': 17 });
        const u = p.inv[n - 2 - i];
        if (u && on(u, V)) {
          const c2 = hot(u, V) ? C.red : C.green, a = anim(u, V);
          A.el('line', Object.assign({ x1: xb - 5, x2: xa + 7, y1: y + 38, y2: y + 38, stroke: c2, 'stroke-width': 2.5, 'marker-end': 'url(#a' + (c2 === C.red ? 'R' : 'N') + ')' }, a), A.svg);
          lab(A, (xa + xb) / 2, y + 70, u.t, c2, Object.assign({ 'font-size': 17 }, a));
        }
      }
    });
    lab(A, 320, y + 108, done(V) ? 'undo in reverse order' : '', C.muted, { 'font-size': 15 });
  }

  /* ---------- a polygon with labelled sides (units: x right, y down) ---------- */
  function shape(A, p, V, H) {
    const P = p.pts, xs = P.map(q => q[0]), ys = P.map(q => q[1]), X0 = Math.min(...xs), Y0 = Math.min(...ys);
    const k = Math.min(380 / (Math.max(...xs) - X0), (H - 110) / (Math.max(...ys) - Y0)), w = (Math.max(...xs) - X0) * k, h = (Math.max(...ys) - Y0) * k;
    const pt = q => [320 - w / 2 + (q[0] - X0) * k, 50 + (H - 100 - h) / 2 + (q[1] - Y0) * k], S = P.map(pt);
    const cx = S.reduce((a, q) => a + q[0], 0) / S.length, cy = S.reduce((a, q) => a + q[1], 0) / S.length, c = col(p.c || 'L');
    A.el('path', { d: 'M' + S.map(q => q.join(' ')).join('L') + 'z', fill: c, 'fill-opacity': .14, stroke: c, 'stroke-width': 3, 'stroke-linejoin': 'round' }, A.svg);
    S.forEach((a, i) => {
      const b = S[(i + 1) % S.length], mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, dx = mx - cx, dy = my - cy, L = Math.hypot(dx, dy) || 1, sd = p.sides[i];
      const hc = hot(sd, V);
      if (hc) A.el('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: C.red, 'stroke-width': 6, 'stroke-dasharray': '8 6' }, A.svg);
      lab(A, mx + dx / L * 26, my + dy / L * 22, sd.t, hc ? C.red : col(sd.c || 'W'), { 'text-anchor': Math.abs(dx / L) > .5 ? (dx > 0 ? 'start' : 'end') : 'middle' });
    });
    if (p.q) lab(A, cx, cy, qtext('?', null, V), qcol('?', V, C.yellow), { 'font-size': 18 });
  }

  const PIC = { nl, rects, tri, chain, cube, bar, graph, table, flow, shape };

  /* ---------- the step chain ---------- */
  function steps(A, it, V, top) {
    const n = it.steps.length, rh = n > 3 ? 28 : 32, bad = V.phase === 'wrong' && V.res ? V.res.s : -2;
    it.steps.forEach((st, i) => {
      const y = top + i * rh + rh / 2, flag = i === bad, c = flag ? C.red : LVC[it.lvl], a = done(V) && V.anim ? { class: 'fade', style: 'animation-delay:' + (i * DLY) + 's' } : {};
      A.el('circle', { cx: 26, cy: y, r: 12, fill: c, 'fill-opacity': V.phase === 'ask' ? .25 : .9, stroke: c, 'stroke-width': 1.5 }, A.svg);
      lab(A, 26, y + 1, String(i + 1), V.phase === 'ask' ? c : C.stage, { 'font-size': 14, 'font-weight': 700, style: 'stroke:none' });
      if (V.phase === 'ask') { A.el('line', { x1: 48, x2: 610, y1: y, y2: y, stroke: C.edge, 'stroke-width': 2, 'stroke-dasharray': '4 8' }, A.svg); return; }
      lab(A, 46, y, st.l, flag ? C.red : C.muted, Object.assign({ 'font-size': 14, 'text-anchor': 'start', class: flag ? 'pulse' : '' }, done(V) ? a : {}));
      if (!done(V)) { if (flag) lab(A, 200, y, '← check this step', C.red, { 'font-size': 15, 'text-anchor': 'start' }); return; }
      const fs = Math.min(17, 430 / Math.max(1, st.m.length * .54));
      lab(A, 200, y, st.m, i === n - 1 ? C.green : C.text, Object.assign({ 'font-size': fs, 'text-anchor': 'start' }, a));
    });
  }

  function draw(A, it, V) {
    ITEM = it;
    const n = it.steps.length, rh = n > 3 ? 28 : 32, top = 420 - n * rh - 8;
    A.el('line', { x1: 14, x2: 626, y1: top - 8, y2: top - 8, stroke: C.edge, 'stroke-width': 1.5 }, A.svg);
    PIC[it.pic.k](A, it.pic, V, top - 12);
    steps(A, it, V, top);
  }

  /* ---------- a tab: one topic, a round ramping from one step to three ---------- */
  const unit = s => ({ h: '<span class="u">' + s + '</span>' });
  // A polynomial answer: one coefficient box per power of x, up to the item's degree (deg).
  const polySlots = it => (it.deg === 2 ? [{ k: 'c2', label: 'x squared coefficient', narrow: true }, 'x² +'] : [])
    .concat([{ k: 'c1', label: 'x coefficient', narrow: true }, 'x +', { k: 'c0', label: 'constant', narrow: true }], it.unit ? [unit(it.unit)] : []);
  function tab(o) {
    return {
      id: o.id, code: o.code, name: o.name, sec: o.sec || 1, notes: o.notes, sep: o.sep,
      q: it => it.q, kind: 'slots', gen: o.gen, typeOf: it => it.t,
      prompt: it => '<div class="lvl l' + it.lvl + '">Level ' + it.lvl + ' · ' + LVN[it.lvl] + '</div><div class="story">' + it.story + '</div>',
      slots: it => it.poly ? polySlots(it) : [it.pre ? unit(it.pre) : null, { k: 'v', label: 'answer', wide: true }, it.unit ? unit(it.unit) : null].filter(Boolean),
      check: (it, r) => MODEL.check(it, r), answer: it => it.poly ? MODEL.resp(it, it.poly) : { v: it.ans }, link: o.link, draw
    };
  }
  return { tab, draw, PIC, LVN };
})();
/* ===================== PAGE: tabs (pictures and the step chain are in wp.js) ===================== */
const NOTES9 = {
  rn: { notes: '../notes/rational-numbers/math9-rational-numbers-notes-v1.html' },
  sr: { notes: '../notes/square-roots/math9-square-roots-notes-v1.html' },
  pe: { notes: '../notes/powers-exponents/math9-powers-notes-v1.html', sep: '·' },
  lr: { notes: '../notes/linear-relations/math9-linear-relations-notes-v1.html' },
  le: { notes: '../notes/linear-equations/math9-linear-equations-notes-v1.html' },
  po: { notes: '../notes/polynomials/math9-polynomials-notes-v1.html' }
};
// Each item opens the notes at its own section (RN2, LR3, PO6 ...).
const link9 = topic => it => Object.assign({ sec: +it.code.replace(/\D/g, '') }, NOTES9[it.topic || topic]);
const tab9 = (id, code, name) => WP.tab(Object.assign({ id, code, name, gen: n => MODEL.gen(id, n), link: link9(id) }, NOTES9[id]));
const PAGE = {
  key: 'math9-word-problems-trainer-v1', course: 'Math 9 · Word problems', title: 'Word Problems',
  notes: NOTES9.rn.notes,
  tabs: [
    tab9('rn', 'RN', 'Rational'), tab9('sr', 'SR', 'Roots'), tab9('pe', 'PE', 'Powers'),
    tab9('lr', 'LR', 'Relations'), tab9('le', 'LE', 'Equations'), tab9('po', 'PO', 'Polynomials'),
    WP.tab({ id: 'mix', code: 'All', name: 'Mixed', gen: n => MODEL.genMix(n), link: link9('rn'), notes: NOTES9.rn.notes })
  ]
};
DRILL.boot(PAGE);
</script>
