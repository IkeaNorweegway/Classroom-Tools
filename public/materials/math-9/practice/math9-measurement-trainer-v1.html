<!-- =====================================================================
   SURFACE AREA & VOLUME TRAINER (narrow trainer format, see _sims-context.md)
   Math 9 | Measurement & Geometry | Surface Area and Volume. Used after the lesson: it does not teach, it points back to the notes.
   One narrow skill per tab, 10 items a round:
     ME1 Area          rectangle, triangle, circle (r or d given), parallelogram (height vs slant)
     ME2 Surface area  rectangular prism, cylinder, triangular prism; the net unfolds with each face's area
     ME3 Volume        B × h for the same solids; the base is shaded
     ME4 ⅓ rule        cones and pyramids (slant height given as a distractor), inside the matching cylinder or prism
     ME4 Sphere        volume or surface area, r or d given
     ME5 Composite     a box glued on a box: both surfaces minus 2 × the glued face
     SA or V?          a short job (paint a tank, fill a pool): surface area or volume
   Answers with π are accepted within 0.2 % (π or 3.14). Named mistakes: no ½, d for r, circumference for area,
   slant for height, one circle only, half the faces, SA and V swapped, no ⅓, ⁴⁄₃ forgotten, glued faces counted or
   subtracted once.
   ?debug=1 puts DRILL (and MODEL) on window, turns off saving and motion.
   ===================================================================== -->
<style>

  .cM { color: var(--gold); } .cB { color: var(--teal); } .cY { color: var(--yellow); } .cR { color: var(--red); } .cBl { color: var(--blue); }

  /* top bar: name, concept tabs, notes link */

  .btn.primary { flex: 1; background: var(--blue); border-color: var(--blue); color: #04121a; }
  .btn.primary:hover:not(:disabled) { background: #7fd3e7; }

  .btn.icon { width: 56px; padding: 0; display: grid; place-items: center; color: var(--muted); }
  .btn.icon svg { width: 24px; height: 24px; }
  .fb { display: flex; align-items: center; gap: 10px; min-height: 54px; font-size: 17px; font-weight: 600; }

  .fb.ok { color: var(--green); } .fb.bad { color: #ff9a90; } .fb.info { color: var(--muted); }
  .dots { display: flex; gap: 7px; justify-content: center; margin-top: auto; padding-top: 4px; }
  .dots span { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--edge); }
  .dots span.now { border-color: var(--text); }
  .dots .g { background: var(--green); border-color: var(--green); }
  .dots .y { background: var(--yellow); border-color: var(--yellow); }
  .dots .r { background: var(--red); border-color: var(--red); }
  .done { text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
  .done .score { font-family: var(--math); font-size: 64px; line-height: 1; }
  .done .score small { font-size: 30px; color: var(--muted); }
  .keypad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .keypad button { min-height: 46px; border: 1px solid var(--edge); border-radius: 10px; background: var(--stage); font-family: var(--math); font-size: 22px; }

  /* motion: lines draw themselves in, marks fade or pop in */
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .7s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  @keyframes pop { from { opacity: 0; transform: scale(.3); } }

  .nomo .draw { animation: none; stroke-dashoffset: 0; }
  .nomo .fade, .nomo .pop, .nomo .pulse { animation: none; }

  @media (max-width: 1150px) { .brand { display: none; } .app { grid-template-columns: minmax(0, 1fr) 330px; } .tab { padding: 2px 11px; } }
  @media (max-height: 700px) {
    .top { padding: 5px 12px; } .tab, .notes { min-height: 42px; }

  }
  @media (max-width: 760px) {
    html, body { height: auto; } body { overflow: auto; display: block; }
    .top { flex-wrap: wrap; } .tabs { order: 3; flex-basis: 100%; justify-content: flex-start; } .notes { margin-left: auto; }
    .app { display: block; }
    .stage { height: 52vh; min-height: 260px; }
    .side { border-left: none; border-top: 1px solid var(--edge); overflow: visible; }
  }
  @media (prefers-reduced-motion: reduce) {
    .draw { animation: none; stroke-dashoffset: 0; } .fade, .pop, .pulse { animation: none; }
  }
/* ===== DRILL SHELL CSS END ===== */
</style>

<body>

<header class="top">
  <div class="brand"><small id="course"></small><b id="title"></b></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Skills"></nav>
  <a class="notes" id="notes" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg><span id="notesTxt"></span></a>
</header>

<div class="app">
  <section class="stage" id="stageWrap"><svg id="svg" viewBox="0 0 640 420" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Picture for this question"></svg></section>
  <aside class="side" id="side">
    <div id="askBox">
      <div class="q" id="q"></div>
      <div class="prompt" id="prompt"></div>
    </div>
    <div class="ans" id="ans"></div>
    <div class="acts" id="acts">
      <button type="button" class="btn primary" id="bCheck">Check</button>
      <button type="button" class="btn icon" id="bShow" aria-label="Show me" title="Show me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <div class="fb" id="fb" aria-live="polite"></div>
    <div class="done" id="done" hidden></div>
    <div class="dots" id="dots" aria-label="This round"></div>
  </aside>
</div>

<script>
const DEBUG = /[?&]debug=1/.test(location.search);

/* ===== DRILL KIT START (no DOM): exact fractions and seeded random ===== */
const Q = (() => {
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);
  const q = (n, d) => { d = d == null ? 1 : d; if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return { n: n / g, d: d / g }; };
  const of = v => typeof v === 'number' ? (Number.isInteger(v) ? q(v) : dec(String(v))) : v;
  const add = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d + b.n * a.d, a.d * b.d); };
  const sub = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d - b.n * a.d, a.d * b.d); };
  const mul = (a, b) => { a = of(a); b = of(b); return q(a.n * b.n, a.d * b.d); };
  const div = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d, a.d * b.n); };
  const neg = a => { a = of(a); return q(-a.n, a.d); };
  const eq = (a, b) => { if (a == null || b == null) return false; a = of(a); b = of(b); return a.n === b.n && a.d === b.d; };
  const val = a => { a = of(a); return a.n / a.d; };
  const isInt = a => of(a).d === 1;
  function dec(s) { const m = /^(-?)(\d*)\.?(\d*)$/.exec(s); if (!m) return null; const f = m[3] || ''; return q((m[1] ? -1 : 1) * parseInt((m[2] || '0') + f, 10), Math.pow(10, f.length)); }
  // Text a student typed -> fraction, '' for blank, or null if it is not a number.
  function parse(s) {
    s = String(s == null ? '' : s).replace(/[−–—]/g, '-').replace(/\s+/g, '').replace(/^\+/, '');
    if (s === '') return '';
    if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');
    if (/^-?\d+(\.\d+)?$/.test(s) || /^-?\d*\.\d+$/.test(s)) return dec(s);
    const m = /^(-?)\(?(-?\d+)\)?\/\(?(-?\d+)\)?$/.exec(s);
    if (m) { const d = parseInt(m[3], 10); if (d === 0) return null; return q((m[1] ? -1 : 1) * parseInt(m[2], 10), d); }
    return null;
  }
  const str = a => { a = of(a); return (a.n < 0 ? '−' : '') + (a.d === 1 ? Math.abs(a.n) : Math.abs(a.n) + '/' + a.d); };
  let rand = Math.random;
  function seed(n) { let a = n >>> 0; rand = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rnd = (lo, hi) => lo + Math.floor(rand() * (hi - lo + 1));
  const pick = arr => arr[rnd(0, arr.length - 1)];
  const nz = (lo, hi) => { let k; do { k = rnd(lo, hi); } while (k === 0); return k; };
  const chance = p => rand() < p;
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  return { gcd, lcm, q, of, add, sub, mul, div, neg, eq, val, isInt, parse, str, seed, rnd, pick, nz, chance, shuffle };
})();
/* ===== DRILL KIT END ===== */

/* ===================== MODEL START (no DOM) ===================== */
const MODEL = (() => {
  const { val, rnd, pick, chance } = Q;
  const PI = Math.PI;
  // Answers with π are accepted to 0.2 % (π = 3.14 is off by 0.05 %), so rounding and 3.14 both pass.
  const tol = v => Math.max(.06, Math.abs(v) * .002);
  const near = (g, x) => g != null && Math.abs(val(g) - x) <= tol(x) + 1e-9;
  const ans1 = x => Math.abs(x - Math.round(x)) < 1e-9 ? String(Math.round(x)) : (Math.round(x * 10) / 10).toFixed(1);
  const hit = (g, list) => list.find(([x]) => near(g, x));

  /* ME1 area of a 2D shape */
  function genArea() {
    const shape = pick(['rect', 'tri', 'tri', 'circle', 'circle', 'para']);
    if (shape === 'rect') { const l = rnd(3, 15), w = rnd(2, 12); return { shape, l, w, v: l * w }; }
    if (shape === 'tri') { const b = rnd(3, 16), h = rnd(2, 12); return { shape, b, h, v: b * h / 2 }; }
    if (shape === 'para') { const b = rnd(4, 14), h = rnd(2, 10), s = h + rnd(1, 4); return { shape, b, h, s, v: b * h }; }
    const r = rnd(2, 12), useD = chance(.4); return { shape, r, useD, v: PI * r * r };
  }
  function checkArea(it, r) {
    const g = r.v; if (near(g, it.v)) return { ok: true };
    const w = it.shape === 'tri' ? hit(g, [[it.b * it.h, 'Triangle: ½ × b × h']]) :
      it.shape === 'circle' ? hit(g, [[PI * 4 * it.r * it.r, 'Use the radius: half of d'], [2 * PI * it.r, 'That’s the circumference: πr²'], [PI * it.r, 'Square the radius: πr²'], [PI * it.r * 2, 'That’s the circumference: πr²']]) :
      it.shape === 'para' ? hit(g, [[it.b * it.s, 'Use the height, not the slant side'], [it.b * it.h / 2, 'Parallelogram: b × h, no ½']]) : null;
    if (w) return { code: 'named', cue: w[1] };
    return { code: 'other', cue: { rect: 'l × w', tri: '½ × b × h', circle: 'π × r × r', para: 'base × height' }[it.shape] };
  }

  /* ME2 surface area, ME3 volume: right prisms and cylinders */
  const TRIS = [[3, 4, 5], [6, 8, 10], [5, 12, 13], [9, 12, 15]];
  function genSolid() {
    const shape = pick(['box', 'box', 'cyl', 'cyl', 'tri']);
    if (shape === 'box') { const l = rnd(3, 12), w = rnd(2, 9), h = rnd(2, 10); return { shape, l, w, h }; }
    if (shape === 'cyl') { const r = rnd(2, 9), h = rnd(3, 15); return { shape, r, h, useD: chance(.35) }; }
    const [a, b, c] = pick(TRIS), L = rnd(4, 15); return { shape, a, b, c, L };
  }
  const SA = it => it.shape === 'box' ? 2 * (it.l * it.w + it.l * it.h + it.w * it.h) : it.shape === 'cyl' ? 2 * PI * it.r * it.r + 2 * PI * it.r * it.h : it.a * it.b + (it.a + it.b + it.c) * it.L;
  const VOL = it => it.shape === 'box' ? it.l * it.w * it.h : it.shape === 'cyl' ? PI * it.r * it.r * it.h : it.a * it.b / 2 * it.L;
  function genSA() { const it = genSolid(); it.v = SA(it); return it; }
  function genVol() { const it = genSolid(); it.v = VOL(it); return it; }
  function checkSA(it, r) {
    const g = r.v; if (near(g, it.v)) return { ok: true };
    if (near(g, VOL(it))) return { code: 'vol', cue: 'That’s volume. Add the face areas' };
    const w = it.shape === 'box' ? hit(g, [[it.v / 2, 'Each face has a twin: × 2']]) :
      it.shape === 'cyl' ? hit(g, [[PI * it.r * it.r + 2 * PI * it.r * it.h, 'Two circles: top and bottom'], [2 * PI * it.r * it.h, 'Add the two circles'], [2 * PI * 4 * it.r * it.r + 2 * PI * 2 * it.r * it.h, 'Use r, not d'], [2 * PI * 4 * it.r * it.r + 2 * PI * it.r * it.h, 'Use r, not d']]) :
      hit(g, [[it.a * it.b * 2 + (it.a + it.b + it.c) * it.L, 'Triangle: ½ × a × b each'], [it.a * it.b / 2 + (it.a + it.b + it.c) * it.L, 'Two triangles: front and back']]);
    if (w) return { code: 'named', cue: w[1] };
    return { code: 'other', cue: 'Unfold it: add every face' };
  }
  function checkVol(it, r) {
    const g = r.v; if (near(g, it.v)) return { ok: true };
    if (near(g, SA(it))) return { code: 'sa', cue: 'That’s surface area. V = B × h' };
    const w = it.shape === 'cyl' ? hit(g, [[PI * 4 * it.r * it.r * it.h, 'Use r, not d'], [2 * PI * it.r * it.h, 'Base is a circle: πr²'], [PI * it.r * it.h, 'Square the radius']]) :
      it.shape === 'tri' ? hit(g, [[it.a * it.b * it.L, 'Triangle base: ½ × a × b']]) :
      hit(g, [[it.l + it.w + it.h, 'Multiply, don’t add'], [(it.l * it.w) + it.h, 'Base area × height']]);

    const hint = V.phase !== 'ask', a = it.shape === 'cone' ? it.r : it.s / 2, s = Math.min((it.shape === "cone" ? 150 : 100) / a, 240 / it.h), cx = 280, yb = 330, yt = yb - it.h * s;
    if (it.shape === 'cone') {
      const rx = a * s, ry = rx * .3;
      if (hint) { A.el('path', { d: 'M' + (cx - rx) + ' ' + yt + 'V' + yb + 'M' + (cx + rx) + ' ' + yt + 'V' + yb, stroke: C.muted, 'stroke-dasharray': '6 5', 'stroke-width': 1.5, class: 'fade' }, A.svg); A.el('ellipse', { cx, cy: yt, rx, ry, fill: 'none', stroke: C.muted, 'stroke-dasharray': '6 5', class: 'fade' }, A.svg); }
      A.el('ellipse', { cx, cy: yb, rx, ry, fill: C.blue, 'fill-opacity': .18, stroke: C.blue, 'stroke-width': 2.5 }, A.svg);
      A.el('path', { d: 'M' + (cx - rx) + ' ' + yb + 'L' + cx + ' ' + yt + 'L' + (cx + rx) + ' ' + yb, fill: C.blue, 'fill-opacity': .12, stroke: C.blue, 'stroke-width': 2.5 }, A.svg);
      A.el('line', { x1: cx, x2: cx + rx, y1: yb, y2: yb, stroke: C.gold, 'stroke-width': 2.5 }, A.svg); lab(A, cx + rx / 2, yb + 26, 'r = ' + it.r, C.gold);
    } else {
      const P = oblique(cx - a * s * 1.25, yb + a * s * .36, s), S = 2 * a, top = P(a, it.h, a);
      if (hint) poly(A, [P(0, it.h, 0), P(S, it.h, 0), P(S, it.h, S), P(0, it.h, S)], { fill: 'none', stroke: C.muted, 'stroke-dasharray': '6 5', class: 'fade' });
      if (hint) [[0, 0], [S, 0], [S, S], [0, S]].forEach(([x, z]) => { const p = P(x, 0, z), t = P(x, it.h, z); A.el("line", { x1: p[0], y1: p[1], x2: t[0], y2: t[1], stroke: C.muted, "stroke-dasharray": "6 5", class: "fade" }, A.svg); });
      poly(A, [P(0, 0, 0), P(S, 0, 0), P(S, 0, S), P(0, 0, S)], { fill: C.blue, 'fill-opacity': .18, stroke: C.blue, 'stroke-width': 2 });
      [[0, 0, 0], [S, 0, 0], [S, 0, S]].forEach(q => A.el('line', { x1: P(...q)[0], y1: P(...q)[1], x2: top[0], y2: top[1], stroke: C.blue, 'stroke-width': 2.5 }, A.svg));
      const e = P(S / 2, 0, 0); lab(A, e[0], e[1] + 24, 's = ' + it.s, C.gold);
    }
    const base = it.shape === 'cone' ? [cx, yb] : oblique(cx - a * s * 1.25, yb + a * s * .36, s)(a, 0, a), apex = it.shape === 'cone' ? [cx, yt] : oblique(cx - a * s * 1.25, yb + a * s * .36, s)(a, it.h, a);
    A.el('line', { x1: base[0], y1: base[1], x2: apex[0], y2: apex[1], stroke: C.yellow, 'stroke-width': 2.5, 'stroke-dasharray': '6 4' }, A.svg);
    lab(A, base[0] - 10, (base[1] + apex[1]) / 2, 'h = ' + it.h, C.yellow, { 'text-anchor': 'end' });
    lab(A, 610, 110, "slant l = " + it.l, C.muted, { "text-anchor": "end", "font-size": 18 });
    if (hint) lab(A, 610, 392, "3 of them fill the dashed shape", C.muted, { "text-anchor": "end", "font-size": 18, class: "fade" });
    if (hint) lab(A, 40, 40, 'V = ⅓ × B × h' + (done(V) ? ' = ' + A1(it.v) : ''), done(V) ? C.green : C.muted, { 'text-anchor': 'start', 'font-size': 24, class: 'fade' });
  }
};

/* ME4 sphere */
const T_SPHERE = {
  id: 'sphere', code: 'ME4', name: 'Sphere', sec: 4, q: it => (it.what === 'V' ? 'Volume' : 'Surface area') + ' of the sphere (one decimal)', kind: 'slots',
  gen: MODEL.genSphere, slots: valSlot, check: MODEL.checkSphere, answer: it => ({ v: A1(it.v) }),
  draw(A, it, V) {
    const R = 150, cx = 280, cy = 215, hint = V.phase !== 'ask';
    A.el('circle', { cx, cy, r: R, fill: C.blue, 'fill-opacity': it.what === 'V' ? .22 : .06, stroke: C.blue, 'stroke-width': it.what === 'SA' ? 5 : 3 }, A.svg);
    A.el('ellipse', { cx, cy, rx: R, ry: R * .28, fill: 'none', stroke: C.blue, 'stroke-width': 1.5, 'stroke-dasharray': '6 5' }, A.svg);
    if (it.useD) { A.el('line', { x1: cx - R, x2: cx + R, y1: cy, y2: cy, stroke: C.gold, 'stroke-width': 3 }, A.svg); lab(A, cx, cy - 18, 'd = ' + 2 * it.r, C.gold); }
    else { A.el('line', { x1: cx, x2: cx + R, y1: cy, y2: cy, stroke: C.gold, 'stroke-width': 3 }, A.svg); lab(A, cx + R / 2, cy - 18, 'r = ' + it.r, C.gold); }
    if (hint) lab(A, 600, 60, it.what === 'V' ? 'V = ⁴⁄₃ π r³' : 'SA = 4 π r²', C.muted, { 'text-anchor': 'end', 'font-size': 24, class: 'fade' });
    if (hint && it.useD) lab(A, 600, 100, 'r = ' + it.r, C.yellow, { 'text-anchor': 'end', class: 'fade' });
    if (done(V)) lab(A, 600, 380, '≈ ' + A1(it.v), C.green, { 'text-anchor': 'end', 'font-size': 28, class: 'pop' });
  }
};

/* ME5 composite */
const T_COMP = {
  id: 'comp', code: 'ME5', name: 'Composite', sec: 5, q: 'Surface area of the whole object', kind: 'slots',
  gen: MODEL.genComp, slots: valSlot, check: MODEL.checkComp, answer: it => ({ v: A1(it.v) }),
  draw(A, it, V) {
    const hint = V.phase !== 'ask', s = Math.min(330 / (it.L + it.W * .5), 250 / (it.H + it.h + it.W * .36 + (hint ? 3 : 0))), x0 = 300 - (it.L + it.W * .5) * s / 2, y0 = 360;
    const P = drawBox(A, { l: it.L, w: it.W, h: it.H }, { s, x0, y0, lL: String(it.L), lW: String(it.W), lH: String(it.H) });
    const ox = (it.L - it.l) / 2, oz = (it.W - it.w) / 2, lift = hint ? 3 : 0;
    if (hint) poly(A, [P(ox, it.H, oz), P(ox + it.l, it.H, oz), P(ox + it.l, it.H, oz + it.w), P(ox, it.H, oz + it.w)], { fill: C.red, 'fill-opacity': .45, stroke: C.red, 'stroke-width': 2, class: 'pulse' });
    const b = P(ox, it.H + lift, oz);
    drawBox(A, { l: it.l, w: it.w, h: it.h }, { s, x0: b[0], y0: b[1], col: C.teal, lL: String(it.l), lW: String(it.w), lH: String(it.h) });
    if (hint) { const q = P(ox, it.H + lift, oz); poly(A, [[q[0], q[1]], P(ox + it.l, it.H + lift, oz), P(ox + it.l, it.H + lift, oz + it.w), P(ox, it.H + lift, oz + it.w)], { fill: C.red, 'fill-opacity': .3, stroke: C.red, 'stroke-width': 2, 'stroke-dasharray': '5 4', class: 'fade' }); }
    if (hint) lab(A, 30, 34, it.s1 + ' + ' + it.s2 + ' − 2 × ' + (it.l * it.w) + (done(V) ? ' = ' + it.v : ''), done(V) ? C.green : C.muted, { 'text-anchor': 'start', 'font-size': 22, class: 'fade' });
  }
};

/* SA or V? */
const T_JOB = {
  id: 'job', code: 'ME2–3', name: 'SA or V?', sec: 2, q: 'Surface area or volume?', kind: 'choice',
  gen: MODEL.genJob, prompt: it => '<span style="font-family:inherit;font-size:24px;font-weight:650">' + it.text + '</span>',
  choices: () => [{ v: 'sa', label: 'Surface area' }, { v: 'v', label: 'Volume' }], check: MODEL.checkJob, answer: it => ({ v: it.ans }),
  draw(A, it, V) {
    A.tx(A.svg, 320, V.phase === 'ask' ? 210 : 90, it.icon, { 'font-size': V.phase === 'ask' ? 120 : 60, stroke: 'none' });
    if (V.phase === 'ask') return;
    const it2 = { l: 6, w: 4, h: 4 };
    if (it.ans === 'v') {
      for (let k = 0; k < 4; k++) drawBox(A, { l: 6, w: 4, h: k + 1 }, { s: 40, x0: 160, y0: 360, labels: false, col: C.teal, fill: .1 });
      lab(A, 320, 395, 'fills the inside: cm³', C.green, { class: 'fade' });
    } else {
      drawBox(A, it2, { s: 40, x0: 160, y0: 360, labels: false, col: C.gold, fill: .05 });
      lab(A, 320, 395, 'covers the outside: cm²', C.green, { class: 'fade' });
    }
  }
};

const PAGE = {
  key: 'math9-measurement-trainer-v1', course: 'Math 9 · Measurement & Geometry', title: 'Surface Area & Volume',
  notes: '../notes/measurement/math9-measurement-notes-v1.html',
