   STATISTICS TRAINER (narrow trainer format, see _sims-context.md)
   Math 9 | Statistics & Probability | Statistics. Used after the lesson: it does not teach, it points back to the notes.
   One narrow skill per tab, 10 items a round:
     ST1 1 or 2 variables?  a small table: univariate or bivariate (a name column is not a variable)
     ST2 Direction          positive, negative or no correlation
     ST2 Strength           strong or weak: a band around the trend shows the spread
     ST3 Best fit           pick the best of three lines (the others join first and last, are forced through 0, or are too steep)
     ST4 Predict            read y from the line of best fit (within 4)
     ST4 Inside or outside? interpolation or extrapolation; the data's x-range is shaded after
   Data are generated samples on plain x and y axes (no real data). Correlation vs causation needs reading, so it

<style>

  .dots { display: flex; gap: 7px; justify-content: center; margin-top: auto; padding-top: 4px; }

  .dots span.now { border-color: var(--text); }
  .dots .g { background: var(--green); border-color: var(--green); }
  .dots .y { background: var(--yellow); border-color: var(--yellow); }
  .dots .r { background: var(--red); border-color: var(--red); }
  .done { text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
  .done .score { font-family: var(--math); font-size: 64px; line-height: 1; }
  .done .score small { font-size: 30px; color: var(--muted); }
  .keypad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .keypad button { min-height: 46px; border: 1px solid var(--edge); border-radius: 10px; background: var(--stage); font-family: var(--math); font-size: 22px; }

  @media (max-width: 1150px) { .brand { display: none; } .app { grid-template-columns: minmax(0, 1fr) 330px; } .tab { padding: 2px 11px; } }
  @media (max-height: 700px) {

  }

<header class="top">
  <div class="brand"><small id="course"></small><b id="title"></b></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Skills"></nav>
  <a class="notes" id="notes" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg><span id="notesTxt"></span></a>
</header>

<div class="app">
  <section class="stage" id="stageWrap"><svg id="svg" viewBox="0 0 640 420" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Picture for this question"></svg></section>
  <aside class="side" id="side">
    <div id="askBox">
      <div class="q" id="q"></div>
      <div class="prompt" id="prompt"></div>
    </div>
    <div class="ans" id="ans"></div>
    <div class="acts" id="acts">
      <button type="button" class="btn primary" id="bCheck">Check</button>
      <button type="button" class="btn icon" id="bShow" aria-label="Show me" title="Show me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <div class="fb" id="fb" aria-live="polite"></div>
    <div class="done" id="done" hidden></div>
    <div class="dots" id="dots" aria-label="This round"></div>
  </aside>
</div>

<script>
const DEBUG = /[?&]debug=1/.test(location.search);

/* ===== DRILL KIT START (no DOM): exact fractions and seeded random ===== */
const Q = (() => {
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);
  const q = (n, d) => { d = d == null ? 1 : d; if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return { n: n / g, d: d / g }; };
  const of = v => typeof v === 'number' ? (Number.isInteger(v) ? q(v) : dec(String(v))) : v;
  const add = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d + b.n * a.d, a.d * b.d); };
  const sub = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d - b.n * a.d, a.d * b.d); };
  const mul = (a, b) => { a = of(a); b = of(b); return q(a.n * b.n, a.d * b.d); };
  const div = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d, a.d * b.n); };
  const neg = a => { a = of(a); return q(-a.n, a.d); };
  const eq = (a, b) => { if (a == null || b == null) return false; a = of(a); b = of(b); return a.n === b.n && a.d === b.d; };
  const val = a => { a = of(a); return a.n / a.d; };
  const isInt = a => of(a).d === 1;
  function dec(s) { const m = /^(-?)(\d*)\.?(\d*)$/.exec(s); if (!m) return null; const f = m[3] || ''; return q((m[1] ? -1 : 1) * parseInt((m[2] || '0') + f, 10), Math.pow(10, f.length)); }
  // Text a student typed -> fraction, '' for blank, or null if it is not a number.
  function parse(s) {
    s = String(s == null ? '' : s).replace(/[−–—]/g, '-').replace(/\s+/g, '').replace(/^\+/, '');
    if (s === '') return '';
    if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');
    if (/^-?\d+(\.\d+)?$/.test(s) || /^-?\d*\.\d+$/.test(s)) return dec(s);
    const m = /^(-?)\(?(-?\d+)\)?\/\(?(-?\d+)\)?$/.exec(s);
    if (m) { const d = parseInt(m[3], 10); if (d === 0) return null; return q((m[1] ? -1 : 1) * parseInt(m[2], 10), d); }
    return null;
  }
  const str = a => { a = of(a); return (a.n < 0 ? '−' : '') + (a.d === 1 ? Math.abs(a.n) : Math.abs(a.n) + '/' + a.d); };
  let rand = Math.random;
  function seed(n) { let a = n >>> 0; rand = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rnd = (lo, hi) => lo + Math.floor(rand() * (hi - lo + 1));
  const pick = arr => arr[rnd(0, arr.length - 1)];
  const nz = (lo, hi) => { let k; do { k = rnd(lo, hi); } while (k === 0); return k; };
  const chance = p => rand() < p;
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  return { gcd, lcm, q, of, add, sub, mul, div, neg, eq, val, isInt, parse, str, seed, rnd, pick, nz, chance, shuffle };
})();
/* ===== DRILL KIT END ===== */

/* ===================== MODEL START (no DOM) ===================== */
const MODEL = (() => {
  const { val, rnd, pick, chance } = Q;
  // Seeded normal-ish noise from the kit's random (sum of three uniforms).
  const noise = () => (rnd(0, 1000) + rnd(0, 1000) + rnd(0, 1000)) / 1500 - 1;
  function corr(pts) {
    const n = pts.length, mx = pts.reduce((s, p) => s + p[0], 0) / n, my = pts.reduce((s, p) => s + p[1], 0) / n;
    let sxy = 0, sxx = 0, syy = 0; pts.forEach(([x, y]) => { sxy += (x - mx) * (y - my); sxx += (x - mx) ** 2; syy += (y - my) ** 2; });
    return { r: sxy / Math.sqrt(sxx * syy), m: sxy / sxx, b: my - sxy / sxx * mx, mx, my };
  }
  // n points with x in [1, 10] and y in roughly [0, 100]
  function cloud(slope, spread, n) {
    const pts = [];
    for (let i = 0; i < (n || 14); i++) { const x = Math.round((1 + 9 * rnd(0, 1000) / 1000) * 10) / 10; const y = slope === 0 ? 20 + 60 * rnd(0, 1000) / 1000 : 50 + slope * (x - 5.5) * 8 + spread * noise() * 25; pts.push([x, Math.max(2, Math.min(98, Math.round(y)))]); }
    return pts;
  }
  const sse = (pts, m, b) => pts.reduce((s, [x, y]) => s + (y - (m * x + b)) ** 2, 0);

  /* ST1 one variable or two? */
  const BI = [['Height (cm)', 'Arm span (cm)', [150, 185], [148, 190]], ['Hours studied', 'Test score', [0, 6], [40, 98]], ['Temperature (°C)', 'Visitors', [12, 34], [40, 360]], ['Age (years)', 'Reaction time (ms)', [12, 70], [180, 320]]];
  const UNI = [['Height (cm)', null, [140, 190]], ['Test score', null, [40, 100]], ['Student', 'Shoe size', [5, 12]], ['Player', 'Goals', [0, 30]], ['Pumpkin mass (kg)', null, [3, 40]]];
  function genVars() {
    if (chance(.5)) { const [a, b, ra, rb] = pick(BI); const rows = []; for (let i = 0; i < 5; i++) { const t = rnd(0, 100) / 100; rows.push([Math.round(ra[0] + t * (ra[1] - ra[0])), Math.round(rb[0] + (t * .7 + .3 * rnd(0, 100) / 100) * (rb[1] - rb[0]))]); } return { ans: 'bi', cols: [a, b], rows }; }
    const [a, b, rg] = pick(UNI), rows = [];
    for (let i = 0; i < 5; i++) { const v = rnd(rg[0], rg[1]); rows.push(b ? [a === 'Student' ? 'ABCDE'[i] : ['Ana', 'Ben', 'Cy', 'Dev', 'Eli'][i], v] : [v]); }
    return { ans: 'uni', cols: b ? [a, b] : [a], rows, idCol: !!b };
  }
  function checkVars(it, r) {
    if (r.v === it.ans) return { ok: true };
    return it.ans === 'bi' ? { code: 'saiduni', cue: 'Two things measured on each: bivariate' } : { code: 'saidbi', cue: it.idCol ? 'Names aren’t measured: one variable' : 'One thing measured: univariate' };
  }

  /* ST2 direction and strength */
  function genDir() {
    for (;;) {
      const ans = pick(['pos', 'neg', 'none']), pts = cloud(ans === 'pos' ? 1 : ans === 'neg' ? -1 : 0, chance(.5) ? .5 : 1);
      const { r } = corr(pts);
      if (ans === 'none' ? Math.abs(r) < .2 : (ans === 'pos' ? r > .6 : r < -.6)) return { ans, pts };
    }
  }
  function checkDir(it, r) {
    if (r.v === it.ans) return { ok: true };
    return { code: 'pick', cue: { pos: 'Up to the right: positive', neg: 'Down to the right: negative', none: 'No up or down trend: none' }[it.ans] };
  }
  function genStrength() {
    for (;;) {
      const ans = pick(['strong', 'weak']), sign = pick([1, -1]), pts = cloud(sign, ans === 'strong' ? .25 : 1.6);
      const { r } = corr(pts), a = Math.abs(r);
      if (ans === 'strong' ? a > .92 : a > .3 && a < .62) return { ans, pts };
    }
  }
  function checkStrength(it, r) {
    if (r.v === it.ans) return { ok: true };
    return { code: 'pick', cue: it.ans === 'strong' ? 'Points hug a line: strong' : 'Points spread wide: weak' };
  }

  /* ST3 which line fits best? */
  function genFit() {
    for (;;) {
      const sign = pick([1, -1]), pts = cloud(sign, .55), { r, m, b, mx, my } = corr(pts);
      if (Math.abs(r) < .8) continue;
      const above = pts.filter(([x, y]) => y > m * x + b).length;
      if (Math.abs(2 * above - pts.length) > 2) continue;   // the best line also balances points above and below
      const xs = pts.map(p => p[0]), lo = pts[xs.indexOf(Math.min(...xs))], hi = pts[xs.indexOf(Math.max(...xs))];
      const fl = { m: (hi[1] - lo[1]) / (hi[0] - lo[0]), kind: 'firstlast' }; fl.b = lo[1] - fl.m * lo[0];
      const k = pts.reduce((s, [x, y]) => s + x * y, 0) / pts.reduce((s, [x]) => s + x * x, 0), org = { m: k, b: 0, kind: 'origin' };
      const st = { m: m * 1.8, kind: 'steep' }; st.b = my - st.m * mx;
      const best = { m, b, kind: 'best' }, e0 = sse(pts, m, b);
      const pool = [fl, org, st].filter(L => sse(pts, L.m, L.b) > e0 * 1.6);
      if (pool.length < 2) continue;
      const lines = Q.shuffle([best, ...Q.shuffle(pool).slice(0, 2)]);

    for (let i = 0; i < ROUND; i++) { const s = document.createElement('span'); if (marks[i]) s.className = marks[i]; else if (i === marks.length) s.className = 'now'; d.appendChild(s); }
    d.setAttribute('aria-label', 'This round: ' + marks.filter(m => m === 'g').length + ' first try out of ' + marks.length);
  }
  function finish() {
    const score = marks.filter(m => m === 'g').length;
    save.best[tab.id] = Math.max(save.best[tab.id] || 0, score); store(); tabsBar();
    $('askBox').hidden = true; $('ans').hidden = true; $('acts').hidden = true; $('fb').hidden = true;
    const i = PAGE.tabs.indexOf(tab), nx = PAGE.tabs[i + 1];
    const d = $('done'); d.hidden = false;
    d.innerHTML = '<div class="score">' + score + '<small>/' + ROUND + '</small></div>' +
      '<button type="button" class="btn primary" id="bAgain">↻ Again</button>' +
      (nx ? '<button type="button" class="btn" id="bNextTab">' + nx.name + ' →</button>' : '') +
      (score < 7 ? '<a class="notes" style="justify-content:center" href="' + notesHref(tab) + '" target="_blank" rel="noopener">📖 Notes §' + tab.sec + '</a>' : '');
    $('bAgain').onclick = () => setTab(tab.id);
    if (nx) $('bNextTab').onclick = () => setTab(nx.id);
    $('svg').innerHTML = ''; defs($('svg'));
    const g = el('g', {}, $('svg'));
    marks.forEach((m, k) => el('circle', { cx: 320 + (k - 4.5) * 46, cy: 210, r: 16, fill: m === 'g' ? C.green : m === 'y' ? C.yellow : C.red, class: 'pop', style: 'animation-delay:' + k * 60 + 'ms' }, g));
    if (!COARSE) $('bAgain').focus();
  }
  const notesHref = t => (t.notes || PAGE.notes) + '#:~:text=' + encodeURIComponent(PAGE.secText ? PAGE.secText(t) : 'Section ' + t.sec + ' ' + (t.sep || PAGE.sep || '—'));

  /* ---------- tabs ---------- */
  function tabsBar() {
    const bar = $('tabs'); bar.innerHTML = '';
    PAGE.tabs.forEach(t => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'tab'; b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', t === tab ? 'true' : 'false');
      b.innerHTML = '<small>' + t.code + '</small>' + t.name + ((save.best[t.id] || 0) >= 8 ? '<span class="star" aria-label="8 or more"></span>' : '');
      b.addEventListener('click', () => setTab(t.id));
      bar.appendChild(b);
    });
  }
  function setTab(id) {
    tab = PAGE.tabs.find(t => t.id === id) || PAGE.tabs[0];
    save.tab = tab.id; store(); marks = []; lastKey = '';
    tabsBar();
    const n = $('notes'); n.href = notesHref(tab); $('notesTxt').textContent = '§' + tab.sec;
    n.title = 'Notes, Section ' + tab.sec; n.setAttribute('aria-label', 'Open the notes at Section ' + tab.sec);
    newItem();
  }
  function boot(P) {
    PAGE = P; load();
    if (RM) document.body.classList.add('nomo');
    if (P.sans) document.body.classList.add('sans');
    $('course').textContent = P.course; $('title').textContent = P.title;
    $('bCheck').addEventListener('click', check);
    $('bShow').addEventListener('click', show);
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter' || e.target.tagName === 'BUTTON' || e.target.tagName === 'A' || !$('done').hidden) return;
      e.preventDefault(); check();
    });
    setTab(save.tab);
    if (DEBUG) window.DRILL = { PAGE, MODEL: typeof MODEL !== 'undefined' ? MODEL : null, setTab, newItem, check, show,
      fill: vals => { $('ans').querySelectorAll('.slot').forEach(inp => { inp.value = vals[inp.dataset.k] != null ? vals[inp.dataset.k] : ''; }); },
      pickChoice: v => { const b = [...$('ans').querySelectorAll('.choice')].find(x => x.dataset.v === String(v)); if (b) b.click(); },
      setResp: o => { Object.assign(resp, o); draw(phase, lastRes, false); },
      state: () => ({ tab: tab.id, item, att, resolved, marks: marks.slice(), phase, fb: $('fb').textContent, resp }),
      keyOf: (it, t) => { const cur = tab; if (t) tab = t; try { return keyOf(it); } finally { tab = cur; } }, weights: () => Object.assign({}, scores()), resetWeights: () => { save.w[tab.id] = {}; }, setScore: (k, s) => { scores()[k] = s; } };
  }
  return { boot, C, el, tx, mtx, frac, mathHTML, fracHTML, qHTML };
})();
/* ===== DRILL SHELL END ===== */


/* ===================== PAGE: pictures and tabs ===================== */
const { C } = DRILL;
const done = V => V.phase === 'right' || V.phase === 'show';
const lab = (A, x, y, s, col, a) => A.mtx(A.svg, x, y, s, Object.assign({ 'font-size': 20, fill: col || C.text }, a || {}));
const BOX = { x0: 70, y0: 24, w: 520, h: 340, xmin: 0, xmax: 12, ymin: 0, ymax: 100, ystep: 10, xstep: 1, labx: 2, laby: 20 };
function scatter(A, pts, col) { const P = A.plane(A.svg, BOX); pts.forEach(([x, y]) => A.el('circle', { cx: P.X(x), cy: P.Y(y), r: 6, fill: col || C.yellow, stroke: C.stage, 'stroke-width': 2 }, A.svg)); return P; }
function lineXY(A, P, m, b, a, x1, x2) {
  let lo = x1 == null ? 0 : x1, hi = x2 == null ? 12 : x2;
  if (m !== 0) { const xa = (0 - b) / m, xb = (100 - b) / m; lo = Math.max(lo, Math.min(xa, xb)); hi = Math.min(hi, Math.max(xa, xb)); }
  return A.el('path', Object.assign({ d: 'M' + P.X(lo) + ' ' + P.Y(m * lo + b) + 'L' + P.X(hi) + ' ' + P.Y(m * hi + b), stroke: C.green, 'stroke-width': 3.5, fill: 'none', 'stroke-linecap': 'round' }, a), A.svg);
}

/* ST1 one variable or two? */
const T_VARS = {
  id: 'vars', code: 'ST1', name: '1 or 2 variables?', sec: 1, q: 'Univariate or bivariate?', kind: 'choice',
  gen: MODEL.genVars, choices: () => [{ v: 'uni', label: 'Univariate' }, { v: 'bi', label: 'Bivariate' }],
  check: MODEL.checkVars, answer: it => ({ v: it.ans }),
  draw(A, it, V) {
    const two = it.cols.length === 2, cw = two ? 130 : 180, x0 = V.phase === 'ask' ? 320 - (two ? cw : cw / 2) : 40, y0 = 80;
    it.cols.forEach((c, j) => { A.el('rect', { x: x0 + j * cw, y: y0 - 24, width: cw - 6, height: 44, rx: 8, fill: C.panel, stroke: C.edge }, A.svg); A.tx(A.svg, x0 + j * cw + cw / 2 - 3, y0, c, { 'font-size': 14, fill: C.text }); });
    it.rows.forEach((row, i) => row.forEach((v, j) => { A.el('rect', { x: x0 + j * cw, y: y0 + 28 + i * 50, width: cw - 6, height: 44, rx: 8, fill: C.stage, stroke: C.edge }, A.svg); A.mtx(A.svg, x0 + j * cw + cw / 2 - 3, y0 + 50 + i * 50, String(v), { 'font-size': 20, fill: (it.idCol && j === 0) ? C.muted : C.yellow }); }));
    if (V.phase === 'ask') return;
    const gx = 360, gy = 330, gw = 240, gh = 230;
    A.el('path', { d: 'M' + gx + ' ' + (gy - gh) + 'V' + gy + 'H' + (gx + gw), stroke: C.axis, 'stroke-width': 2, fill: 'none', class: 'fade' }, A.svg);
    if (it.ans === 'bi') {
      const xs = it.rows.map(r => r[0]), ys = it.rows.map(r => r[1]), [x1, x2, y1, y2] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
      it.rows.forEach(([x, y]) => A.el('circle', { cx: gx + 20 + (x - x1) / ((x2 - x1) || 1) * (gw - 40), cy: gy - 20 - (y - y1) / ((y2 - y1) || 1) * (gh - 40), r: 7, fill: C.yellow, class: 'pop' }, A.svg));
      lab(A, gx + gw / 2, gy + 26, 'scatter plot: 1 dot per subject', C.green, { 'font-size': 16, class: 'fade' });
    } else {
      const vals = it.rows.map(r => r[r.length - 1]), mx = Math.max(...vals);
      vals.forEach((v, i) => A.el('rect', { x: gx + 14 + i * 44, y: gy - v / mx * (gh - 20), width: 32, height: v / mx * (gh - 20), fill: C.blue, 'fill-opacity': .35, stroke: C.blue, class: 'fade' }, A.svg));
      lab(A, gx + gw / 2, gy + 26, 'one value each: bar graph', C.green, { 'font-size': 16, class: 'fade' });
    }
  }
};

/* ST2 direction */
const T_DIR = {
  id: 'dir', code: 'ST2', name: 'Direction', sec: 2, q: 'What kind of correlation?', kind: 'choice',
  gen: MODEL.genDir, choices: () => [{ v: 'pos', label: 'Positive' }, { v: 'neg', label: 'Negative' }, { v: 'none', label: 'None' }],
  check: MODEL.checkDir, answer: it => ({ v: it.ans }),
  draw(A, it, V) {
    const P = scatter(A, it.pts);
    if (V.phase === 'ask') return;
    const { m, b } = MODEL.corr(it.pts);
    if (it.ans === 'none') { A.el('rect', { x: P.X(0.5), y: P.Y(85), width: P.X(11) - P.X(.5), height: P.Y(15) - P.Y(85), fill: C.muted, 'fill-opacity': .08, stroke: C.muted, 'stroke-dasharray': '6 6', class: 'fade' }, A.svg); lab(A, P.X(6), P.Y(92), 'no trend', C.muted, { class: 'fade' }); }
    else { lineXY(A, P, m, b, { 'marker-end': 'url(#aN)', class: V.anim ? 'draw' : null, pathLength: 1 }, 0.5, 11); lab(A, P.X(10.5), P.Y(m * 10.5 + b) + (m > 0 ? 28 : -28), m > 0 ? 'up ↗' : 'down ↘', C.green, { class: 'fade' }); }
  }
};

/* ST2 strength */
const T_STR = {
  id: 'str', code: 'ST2', name: 'Strength', sec: 2, q: 'Strong or weak?', kind: 'choice',
  gen: MODEL.genStrength, choices: () => [{ v: 'strong', label: 'Strong' }, { v: 'weak', label: 'Weak' }],
  check: MODEL.checkStrength, answer: it => ({ v: it.ans }),
  draw(A, it, V) {
    const P = scatter(A, it.pts);
    if (V.phase === 'ask') return;
    const { m, b } = MODEL.corr(it.pts), sd = Math.sqrt(MODEL.sse(it.pts, m, b) / it.pts.length) * 1.6;
    A.el('path', { d: 'M' + P.X(.5) + ' ' + P.Y(m * .5 + b + sd) + 'L' + P.X(11) + ' ' + P.Y(m * 11 + b + sd) + 'L' + P.X(11) + ' ' + P.Y(m * 11 + b - sd) + 'L' + P.X(.5) + ' ' + P.Y(m * .5 + b - sd) + 'Z', fill: C.green, 'fill-opacity': .12, class: 'fade' }, A.svg);
    lineXY(A, P, m, b, { 'stroke-width': 2, 'stroke-dasharray': '6 5' }, .5, 11);
    lab(A, 560, 50, it.ans === 'strong' ? 'narrow band' : 'wide band', C.green, { 'text-anchor': 'end', class: 'fade' });
  }
};

/* ST3 which line fits best? */
const LC = [C.blue, C.gold, C.pink], LN = ['A', 'B', 'C'];
const T_FIT = {
  id: 'fit', code: 'ST3', name: 'Best fit', sec: 3, q: 'Which line fits best?', kind: 'choice',
  gen: MODEL.genFit, choices: () => LN.map((n, i) => ({ v: String(i), label: '<span style="color:' + LC[i] + '">' + n + '</span>', aria: 'line ' + n })),
  check: MODEL.checkFit, answer: it => ({ v: it.ans }),
  draw(A, it, V) {
    const P = scatter(A, it.pts);
    it.lines.forEach((L, i) => {
      const best = String(i) === it.ans && V.phase !== 'ask';
      lineXY(A, P, L.m, L.b, { stroke: best ? C.green : LC[i], 'stroke-width': best ? 4 : 2.5, opacity: V.phase !== 'ask' && !best ? .55 : 1 });
      const xe = 11.4, ye = Math.max(4, Math.min(96, L.m * xe + L.b));
      lab(A, P.X(xe) + 12, P.Y(ye), LN[i], best ? C.green : LC[i], { 'font-size': 22 });
      if (V.phase !== 'ask') {
        const above = it.pts.filter(([x, y]) => y > L.m * x + L.b).length, below = it.pts.length - above;
        lab(A, 600, 40 + i * 28, LN[i] + ': ' + above + ' above, ' + below + ' below', best ? C.green : LC[i], { 'text-anchor': 'end', 'font-size': 16, class: 'fade' });
      }
    });
  }
};

/* ST4 read a prediction */
const T_PRED = {
  id: 'pred', code: 'ST4', name: 'Predict', sec: 4, q: it => 'Use the line: y when x = ' + it.x, kind: 'slots',
  gen: MODEL.genPredict, slots: () => ['y ≈', { k: 'v', label: 'y', wide: true }], check: MODEL.checkPredict, answer: it => ({ v: String(Math.round(it.v)) }),
  draw(A, it, V) {
    const P = scatter(A, it.pts, C.muted);
    lineXY(A, P, it.m, it.b, {}, 0, 12);
    A.el('line', { x1: P.X(it.x), x2: P.X(it.x), y1: P.Y(0), y2: P.Y(it.v), stroke: C.yellow, 'stroke-width': 2.5, 'stroke-dasharray': '6 5' }, A.svg);
    lab(A, P.X(it.x), P.Y(0) + 34, 'x = ' + it.x, C.yellow, { 'font-size': 18 });
    if (V.phase === 'ask') return;
    A.el('circle', { cx: P.X(it.x), cy: P.Y(it.v), r: 7, fill: C.yellow, class: 'pop' }, A.svg);
    A.el('line', { x1: P.X(it.x), x2: P.X(0), y1: P.Y(it.v), y2: P.Y(it.v), stroke: C.yellow, 'stroke-width': 2.5, 'stroke-dasharray': '6 5', class: 'fade' }, A.svg);
    if (done(V)) lab(A, P.X(0) + 30, P.Y(it.v) - 16, '≈ ' + Math.round(it.v), C.green, { 'font-size': 22, class: 'pop' });
  }
};

/* ST4 interpolation or extrapolation */
const T_RANGE = {
  id: 'range', code: 'ST4', name: 'Inside or outside?', sec: 4, q: it => 'Predicting at x = ' + it.x + ' is…', kind: 'choice',
  gen: MODEL.genRange, choices: () => [{ v: 'inter', label: 'Interpolation' }, { v: 'extra', label: 'Extrapolation' }],
  check: MODEL.checkRange, answer: it => ({ v: it.ans }),
  draw(A, it, V) {
    const P = A.plane(A.svg, BOX);
    if (V.phase !== 'ask') { A.el('rect', { x: P.X(it.lo), y: P.Y(100), width: P.X(it.hi) - P.X(it.lo), height: P.Y(0) - P.Y(100), fill: C.green, 'fill-opacity': .1, class: 'fade' }, A.svg); lab(A, (P.X(it.lo) + P.X(it.hi)) / 2, P.Y(96), 'data', C.green, { class: 'fade' }); }
    lineXY(A, P, it.m, it.b, { 'stroke-width': 2, opacity: .7 }, 0, 12);
    it.pts.forEach(([x, y]) => A.el('circle', { cx: P.X(x), cy: P.Y(y), r: 6, fill: C.yellow, stroke: C.stage, 'stroke-width': 2 }, A.svg));
    A.el('line', { x1: P.X(it.x), x2: P.X(it.x), y1: P.Y(0), y2: P.Y(100), stroke: C.blue, 'stroke-width': 2.5, 'stroke-dasharray': '6 5' }, A.svg);
    lab(A, P.X(it.x), P.Y(0) + 34, 'x = ' + it.x, C.blue, { 'font-size': 18 });
  }
};

const PAGE = {
  key: 'math9-statistics-trainer-v1', course: 'Math 9 · Statistics & Probability', title: 'Statistics',
  notes: '../notes/statistics/math9-statistics-notes-v1.html',
  tabs: [T_VARS, T_DIR, T_STR, T_FIT, T_PRED, T_RANGE]
};
DRILL.boot(PAGE);
</script>
