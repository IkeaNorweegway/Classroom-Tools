<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equations Trainer | Math 9</title>
<style>
/* =====================================================================
   EQUATIONS TRAINER
   Math 9 | Algebra | Linear Equations & Inequalities
   LE1 one- and two-step · LE2 brackets and both sides · LE3 fractions and decimals · LE4 inequalities · LE5 write and solve
   Students type their working one line at a time. Every line is checked against the first equation:
   it must have the same solution (or the same solution set). A balance stays level while it does and tips
   when it does not; for inequalities a number line lets students test points in the original.
   Wrong lines are matched to the named mistakes in the notes (first-term distribution, LCD on some terms,
   wrong inverse operation, the sign flip).
   Model: exact fractions, linear in one variable. Steps follow the notes in order, then Mixed practice.
   Look: full window, dark high-contrast canvas (3Blue1Brown style); written material opens in popups.
   ===================================================================== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  :root {
    --bg: #070a10; --panel: #0f1520; --panel2: #151d2b; --stage: #0b0f17; --edge: #263246;
    --text: #f5f7fb; --muted: #a7b4c8;
    --blue: #58c4dd; --yellow: #f7d96f; --teal: #5cd0b3; --gold: #f0ac5f;
    --green: #83c167; --red: #fc6255; --pink: #ef7fc6;
    --math: 'Cambria Math', 'STIX Two Math', 'Latin Modern Math', Cambria, Georgia, serif;
  }
  html, body { height: 100%; }
  body { font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; font-size: 16px; line-height: 1.45; color: var(--text); background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .4; }
  :focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .math { font-family: var(--math); }
  .math i { font-style: italic; }
  .cB { color: var(--blue); } .cY { color: var(--yellow); } .cT { color: var(--teal); } .cG { color: var(--gold); } .cGr { color: var(--green); } .cR { color: var(--red); }

  /* ---------- top bar ---------- */
  .top { display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; background: var(--panel); border-bottom: 1px solid var(--edge); padding: 8px 14px; flex-shrink: 0; }
  .brand .course-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--blue); }
  .brand h1 { font-size: 19px; font-weight: 650; line-height: 1.15; }
  .progress { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 160px; }
  .progress .bar { flex: 1; max-width: 260px; height: 8px; border-radius: 4px; background: var(--panel2); border: 1px solid var(--edge); overflow: hidden; }
  .progress .bar span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--blue), var(--teal)); transition: width .4s; }
  .progress .txt { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .topbtns { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn { min-height: 44px; border: 1px solid var(--edge); background: var(--panel2); color: var(--text); border-radius: 12px; padding: 6px 14px; font-size: 15px; font-weight: 600; }
  .btn:hover:not(:disabled) { border-color: var(--blue); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #04121a; }
  .btn.primary:hover:not(:disabled) { background: #7fd3e7; }
  .btn.good { background: var(--green); border-color: var(--green); color: #0b1a06; }
  .btn.small { min-height: 40px; padding: 4px 12px; font-size: 14px; }

  /* ---------- goal strip ---------- */
  .strip { display: flex; align-items: center; gap: 10px; background: var(--stage); border-bottom: 1px solid var(--edge); padding: 5px 14px; flex-shrink: 0; min-height: 52px; }
  .strip .lab { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--yellow); white-space: nowrap; }
  .strip .txt { flex: 1; font-weight: 600; }
  .strip .txt small { color: var(--muted); font-weight: 600; margin-right: 6px; }
  .strip .arrow { min-width: 44px; min-height: 40px; border: 1px solid var(--edge); background: var(--panel2); border-radius: 12px; font-size: 20px; font-weight: 700; color: var(--yellow); }

  /* ---------- app area ---------- */
  .app { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(330px, 420px); }
  .main { display: flex; flex-direction: column; min-height: 0; min-width: 0; padding: 12px 14px; gap: 10px; }
  .side { overflow-y: auto; min-height: 0; padding: 12px 14px 16px; background: var(--panel); border-left: 1px solid var(--edge); display: flex; flex-direction: column; gap: 12px; }
  .stage { flex: 1; min-height: 0; background: var(--stage); border: 1px solid var(--edge); border-radius: 16px; display: flex; align-items: center; justify-content: center; padding: 6px; }
  .stage svg { width: 100%; height: 100%; display: block; }
  .stage svg text { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 600; paint-order: stroke; stroke: var(--stage); stroke-width: 4px; stroke-linejoin: round; }
  .stage svg text.m { font-family: var(--math); font-weight: 400; }
  .nl-hit { cursor: pointer; }
  .work { background: var(--panel); border: 1px solid var(--edge); border-radius: 16px; padding: 8px 14px; max-height: 34%; overflow-y: auto; flex-shrink: 0; }
  .work h3, .card h3 { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 4px; }
  .work ol { list-style: none; }
  .work li { display: flex; align-items: baseline; gap: 12px; font-family: var(--math); font-size: 21px; padding: 1px 0; }
  .work li .why { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; color: var(--green); }
  .work li.first .why { color: var(--muted); }
  .work li.new { animation: slide .35s ease-out; }
  @keyframes slide { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .card { border: 1px solid var(--edge); border-radius: 14px; padding: 10px 13px; background: var(--panel2); }
  .problem { font-family: var(--math); font-size: 28px; text-align: center; padding: 4px 0; }
  .story { font-size: 16px; margin-bottom: 6px; }
  .pcount { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .dots span { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--edge); margin-left: 4px; vertical-align: middle; }
  .dots span.on { background: var(--green); border-color: var(--green); }
  .linein { width: 100%; min-height: 50px; padding: 6px 12px; background: var(--stage); border: 1px solid var(--edge); border-radius: 12px; font-family: var(--math); font-size: 24px; color: var(--text); }
  .linein:focus { border-color: var(--yellow); outline: none; box-shadow: 0 0 0 2px rgba(247, 217, 111, .35); }
  .keys { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-top: 8px; }
  .key { min-height: 42px; border: 1px solid var(--edge); background: var(--stage); border-radius: 10px; font-family: var(--math); font-size: 20px; color: var(--text); }
  .key:hover { border-color: var(--blue); }
  .key.x { color: var(--yellow); font-style: italic; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .fb { margin-top: 8px; font-size: 15px; min-height: 22px; }
  .fb.good { color: var(--green); }
  .fb.oops { color: #ff9a90; }
  .fb .tag { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; border: 1px solid currentColor; border-radius: 999px; padding: 0 8px; margin-right: 6px; }
  .predict .q { font-weight: 600; margin-bottom: 8px; }
  .predict .opts { display: flex; flex-direction: column; gap: 6px; }
  .predict .opt { text-align: left; min-height: 44px; border: 1px solid var(--edge); background: var(--stage); border-radius: 10px; padding: 8px 12px; font-size: 15px; }
  .predict .opt.picked { border-color: var(--yellow); color: var(--yellow); }
  .predict .opt.right { border-color: var(--green); }
  .verdict { margin-top: 8px; font-size: 15px; }
  .donebox { border: 1px solid var(--green); background: #10261a; border-radius: 14px; padding: 12px 14px; }
  .donebox .label { font-weight: 700; font-size: 18px; color: var(--green); margin-bottom: 6px; }

  /* ---------- popups ---------- */
  dialog { border: 1px solid var(--edge); border-radius: 18px; padding: 0; width: min(660px, calc(100vw - 24px)); max-height: calc(100vh - 40px); background: var(--panel); color: var(--text); box-shadow: 0 24px 60px rgba(0, 0, 0, .6); }
  dialog::backdrop { background: rgba(3, 6, 12, .7); }
  .dlg-head { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--edge); }
  .dlg-head h2 { flex: 1; font-size: 20px; font-weight: 650; }
  .dlg-body { padding: 14px 20px 20px; overflow-y: auto; max-height: calc(100vh - 112px); }
  .dlg-body p { margin-bottom: 9px; }
  .dlg-body ol, .dlg-body ul { margin: 4px 0 6px 22px; }
  .dlg-body li { margin-bottom: 6px; }
  .box { border-radius: 14px; padding: 10px 14px; margin: 12px 0; border: 1px solid; }
  .box .label { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 4px; }
  .box p:last-child { margin-bottom: 0; }
  .box.example { border-color: var(--blue); background: #0d2029; } .box.example .label { color: var(--blue); }
  .box.watch { border-color: var(--red); background: #2a1316; } .box.watch .label { color: var(--red); }
  .box.paper { border-color: var(--gold); background: #2a1e0f; } .box.paper .label { color: var(--gold); }
  .box.hint { border-color: var(--yellow); background: #2a2610; } .box.hint .label { color: var(--yellow); }
  .ican-pop { background: var(--stage); border: 1px solid var(--edge); border-radius: 12px; padding: 8px 12px; font-weight: 600; color: var(--yellow); }
  .steps-list .sec { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 12px 0 4px; }
  .steps-list button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; min-height: 44px; border: 1px solid transparent; background: none; border-radius: 10px; padding: 4px 10px; font-size: 15px; }
  .steps-list button:hover { background: var(--panel2); }
  .steps-list button.current { border-color: var(--blue); }
  .steps-list .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--edge); font-size: 12px; line-height: 16px; text-align: center; flex-shrink: 0; }
  .steps-list .done .dot { background: var(--green); border-color: var(--green); color: #0b1a06; }
  .wl { font-family: var(--math); font-size: 19px; margin: 2px 0; }

  /* ---------- tutorial card ---------- */
  .spot { outline: 3px solid var(--yellow) !important; outline-offset: 4px; border-radius: 12px; }
  #coach { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 30; width: min(520px, calc(100vw - 24px)); background: var(--panel2); border: 1px solid var(--yellow); border-radius: 14px; padding: 12px 16px; box-shadow: 0 12px 36px rgba(0, 0, 0, .6); }
  #coach p { font-weight: 600; margin-bottom: 8px; }
  #coach .cactions { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #coach .n { font-size: 13px; font-weight: 700; color: var(--muted); }

  @media (max-width: 1180px) { .btxt { display: none; } .topbtns .btn { min-width: 44px; font-size: 17px; } }
  @media (max-width: 1020px) { .app { grid-template-columns: minmax(0, 1fr) minmax(300px, 360px); } }
  @media (max-height: 700px) {
    .top { padding: 4px 12px; } .brand h1 { font-size: 17px; }
    .strip { min-height: 44px; padding: 2px 12px; } .strip .arrow { min-height: 38px; }
    .main { padding: 8px 10px; gap: 6px; } .side { padding: 8px 10px; gap: 8px; }
    .card { padding: 7px 10px; } .problem { font-size: 24px; } .linein { font-size: 21px; min-height: 44px; }
    .key { min-height: 38px; } .work li { font-size: 19px; }
  }
  @media (max-width: 760px) {
    body { overflow: auto; display: block; } html, body { height: auto; }
    .app { display: flex; flex-direction: column-reverse; }
    .stage { height: 42vh; min-height: 240px; flex: none; }
    .side { border-left: none; overflow: visible; }
    .work { max-height: none; }
  }
  @media (prefers-reduced-motion: reduce) { #beam, .progress .bar span { transition: none; } .work li.new { animation: none; } }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="course-label">Math 9 · Algebra · Linear Equations</div>
    <h1>Equations Trainer</h1>
  </div>
  <div class="progress"><div class="bar"><span id="progFill"></span></div><span class="txt" id="progText"></span></div>
  <div class="topbtns">
    <button type="button" class="btn small" id="bSteps" aria-label="All steps">☰<span class="btxt"> Steps</span></button>
    <button type="button" class="btn small" id="bTask" aria-label="Task">📖<span class="btxt"> Task</span></button>
    <button type="button" class="btn small" id="bHint" aria-label="Hint">💡<span class="btxt"> Hint</span></button>
    <button type="button" class="btn small" id="bPaper" aria-label="In your notes">✎<span class="btxt"> In your notes</span></button>
    <button type="button" class="btn small" id="bTour" aria-label="Tutorial">?<span class="btxt"> Tutorial</span></button>
  </div>
</header>

<div class="strip" aria-live="polite">
  <span class="lab">Goal</span>
  <button type="button" class="arrow" id="stepPrev" aria-label="Previous step">‹</button>
  <span class="txt" id="goal"></span>
  <button type="button" class="arrow" id="stepNext" aria-label="Next step">›</button>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dlg-head"><h2 id="dlgTitle"></h2><button type="button" class="btn small" id="dlgClose">Close ✕</button></div>
  <div class="dlg-body" id="dlgBody"></div>
</dialog>

<div id="coach" role="dialog" aria-label="Tutorial" hidden>
  <p id="coachTxt"></p>
  <div class="cactions"><span class="n" id="coachN"></span>
    <span><button type="button" class="btn small" id="coachSkip">Skip</button> <button type="button" class="btn small primary" id="coachNext">Next</button></span></div>
</div>

<div class="app">
  <section class="main">
    <div class="stage" id="stage"><svg id="svg" viewBox="0 0 640 360" role="img" aria-label="A balance"></svg></div>
    <div class="work" id="work"><h3>Your working</h3><ol id="lines"></ol></div>
  </section>
  <aside class="side">
    <div class="card" id="probCard">
      <div class="pcount"><span id="pLabel"></span><span class="dots" id="pDots"></span></div>
      <div class="story" id="story" hidden></div>
      <div class="problem" id="problem"></div>
    </div>
    <div class="card predict" id="predict" hidden></div>
    <div class="card" id="inputCard">
      <h3 id="inLabel">Next line</h3>
      <input id="lineIn" class="linein" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type the next line of your working">
      <div class="keys" id="keys"></div>
      <div class="acts"><button type="button" class="btn primary" id="bCheck">Check</button><button type="button" class="btn small" id="bShow">Show me</button></div>
      <div class="fb" id="fb" aria-live="polite"></div>
    </div>
    <div class="donebox" id="doneBox" hidden></div>
  </aside>
</div>

<script>
const DEBUG = /[?&]debug=1/.test(location.search);

/* ===================== MODEL START (no DOM) ===================== */
const MODEL = (() => {
  let rand = Math.random;
  function seed(n) { let a = n >>> 0; rand = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rnd = (lo, hi) => lo + Math.floor(rand() * (hi - lo + 1));
  const pick = arr => arr[rnd(0, arr.length - 1)];
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);

  /* ---- exact fractions ---- */
  const F = (n, d) => { d = d == null ? 1 : d; if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return { n: n / g, d: d / g }; };
  const fadd = (p, q) => F(p.n * q.d + q.n * p.d, p.d * q.d);
  const fsub = (p, q) => F(p.n * q.d - q.n * p.d, p.d * q.d);
  const fmul = (p, q) => F(p.n * q.n, p.d * q.d);
  const fdiv = (p, q) => F(p.n * q.d, p.d * q.n);
  const fneg = p => F(-p.n, p.d);
  const fzero = p => p.n === 0;
  const feq = (p, q) => p.n === q.n && p.d === q.d;
  const fnum = p => p.n / p.d;
  const fstr = p => (p.n < 0 ? '−' : '') + (p.d === 1 ? Math.abs(p.n) : Math.abs(p.n) + '/' + p.d);
  function fdec(s) { const [i, f = ''] = s.split('.'); return F(parseInt(i + f || '0', 10), Math.pow(10, f.length)); }

  /* ---- linear expressions {a, b} meaning a·v + b ---- */
  const L = (a, b) => ({ a, b });
  const ladd = (p, q) => L(fadd(p.a, q.a), fadd(p.b, q.b));
  const lsub = (p, q) => L(fsub(p.a, q.a), fsub(p.b, q.b));
  const lneg = p => L(fneg(p.a), fneg(p.b));
  function lmul(p, q) {
    if (!fzero(p.a) && !fzero(q.a)) throw { msg: 'That makes a squared term. Equations here are linear: each term is a number or a number times the variable.' };
    return L(fadd(fmul(p.a, q.b), fmul(q.a, p.b)), fmul(p.b, q.b));
  }
  function ldiv(p, q) {
    if (!fzero(q.a)) throw { msg: 'Dividing by the variable is not used here. Divide by numbers only.' };
    if (fzero(q.b)) throw { msg: 'You cannot divide by 0.' };
    return L(fdiv(p.a, q.b), fdiv(p.b, q.b));
  }

  /* ---- reading a typed line ---- */
  const REL = ['<=', '>=', '<', '>', '='];
  function norm(s) {
    return String(s || '').replace(/[−–—]/g, '-').replace(/[×·*]/g, '*').replace(/÷/g, '/').replace(/≤/g, '<=').replace(/≥/g, '>=').replace(/\s+/g, '').toLowerCase();
  }
  function tokenize(s) {
    const t = []; let i = 0;
    while (i < s.length) {
      const c = s[i];
      if (/[0-9.]/.test(c)) { let j = i; while (j < s.length && /[0-9.]/.test(s[j])) j++; const num = s.slice(i, j); if ((num.match(/\./g) || []).length > 1 || num === '.') throw { msg: 'The number “' + num + '” has too many decimal points.' }; t.push({ k: 'n', v: num }); i = j; }
      else if (/[a-z]/.test(c)) { t.push({ k: 'v', v: c }); i++; }
      else if ('+-*/()'.includes(c)) { t.push({ k: c }); i++; }
      else throw { msg: 'I can’t read “' + c + '”. Use numbers, the variable, + − × ÷, brackets, and one sign like = or <.' };
    }
    return t;
  }
  // Parse an expression to {a, b}. Implicit multiplication: 3x, 2(x + 1), (3/4)x.
  function parseExpr(str, v) {
    const t = tokenize(str); let i = 0;
    const peek = () => t[i];
    function expr() {
      let r = term();
      while (peek() && (peek().k === '+' || peek().k === '-')) { const op = t[i++].k; const q = term(); r = op === '+' ? ladd(r, q) : lsub(r, q); }
      return r;
    }
    function term() {
      let r = factor();
      for (;;) {
        const p = peek();
        if (p && (p.k === '*' || p.k === '/')) { i++; const q = factor(); r = p.k === '*' ? lmul(r, q) : ldiv(r, q); }
        else if (p && (p.k === 'n' || p.k === 'v' || p.k === '(')) { r = lmul(r, factor()); }
        else return r;
      }
    }
    function factor() {
      const p = peek();
      if (!p) throw { msg: 'Something is missing at the end of a side.' };
      if (p.k === '-') { i++; return lneg(factor()); }
      if (p.k === '+') { i++; return factor(); }
      if (p.k === 'n') { i++; return L(F(0), fdec(p.v)); }
      if (p.k === 'v') { i++; if (p.v !== v) throw { msg: 'Use the letter ' + v + ' for the unknown.' }; return L(F(1), F(0)); }
      if (p.k === '(') { i++; const r = expr(); if (!peek() || peek().k !== ')') throw { msg: 'A bracket is not closed.' }; i++; return r; }
      throw { msg: 'Two signs in a row, or a sign with nothing after it.' };
    }
    if (!t.length) throw { msg: 'One side is empty.' };
    const r = expr();
    if (i < t.length) throw { msg: t[i].k === ')' ? 'There is an extra closing bracket.' : 'I can’t read the end of a side.' };
    return r;
  }
  // A whole line: two sides and one relation.
  function parseLine(s, v) {
    const n = norm(s);
    if (!n) return { err: 'Type a line first.' };
    let found = [];
    for (let i = 0; i < n.length; i++) { const two = n.slice(i, i + 2); if (two === '<=' || two === '>=') { found.push([i, two]); i++; } else if ('<>='.includes(n[i])) found.push([i, n[i]]); }
    if (!found.length) return { err: 'A line needs a sign between its two sides: = (or <, >, ≤, ≥ for an inequality).' };
    if (found.length > 1) return { err: 'Use one sign per line. Write each step on its own line.' };
    const [at, rel] = found[0];
    try {
      const lhs = parseExpr(n.slice(0, at), v), rhs = parseExpr(n.slice(at + rel.length), v);
      return { lhs, rhs, rel, raw: n, lraw: n.slice(0, at), rraw: n.slice(at + rel.length) };
    } catch (e) { return { err: e.msg || 'I can’t read that line.' }; }
  }
  const FLIP = { '<': '>', '>': '<', '<=': '>=', '>=': '<=', '=': '=' };

function submit() {
  const s = cur(), p = W.prob, text = $('lineIn').value;
  if (W.solvedNow) return null;
  if (!W.tried) { W.tried = true; $('predict').hidden = true; }
  if (W.phase === 'write') {
    const P = M.parseLine(text, p.v);
    if (P.err) { setFb(P.err, 'oops'); return { ok: false, code: 'parse' }; }
    const r = M.check(p, text);
    if (!r.ok) { setFb(r.code === 'other' || r.code === 'sign' ? 'That line doesn’t match the story. Read it again: what is added on once, and what goes with ' + p.v + '?' : r.msg, 'oops', r.code === 'parse' ? '' : 'check the words'); W.lastBad = r.P && !r.P.err ? r.P : null; draw(); return r; }
    W.phase = 'solve'; W.lastBad = null;
    W.lines.push({ text, why: 'matches the story', isNew: true });
    $('lineIn').value = '';
    if (r.final) return finish();
    setFb('✓ That matches the story. Now solve it.', 'good');
    renderSide(); renderWork(); draw(); return r;
  }
  const r = M.check(p, text);
  if (!r.ok) {
    W.lastBad = r.P && !r.P.err ? r.P : null;
    const tag = { first: 'distribute', negdist: 'signs', lcd: 'every term', inverse: 'opposite operation', divone: 'every term', addx: 'opposite operation', noflip: 'flip', flip: 'flip', sign: 'signs', equalpart: 'boundary' }[r.code];
    setFb(r.msg, 'oops', tag); draw(); return r;
  }
  W.lastBad = null;
  const prev = W.lines[W.lines.length - 1];
  if (prev && M.pretty(prev.text) === M.pretty(text)) { setFb('That is the same as your last line. Do one more step.', ''); return r; }
  W.lines.push({ text, why: r.final ? 'solved' : 'balanced', isNew: true });
  $('lineIn').value = '';
  if (r.final) return finish();
  setFb('✓ Balanced. Keep going.', 'good');
  renderWork(); draw(); $('lineIn').focus();
  return r;
}
function finish() {
  const s = cur(), p = W.prob;
  W.solvedNow = true;
  const x = p.sol.val, xs = M.fstr(x);
  if (p.kind === 'eq') {
    const l = M.at(p.P.lhs, x), r = M.at(p.P.rhs, x);
    W.verify = 'Verify in the first line: left side = ' + M.fstr(l) + ', right side = ' + M.fstr(r) + '. Equal ✓';
  } else {
    const right = p.sol.rel === '>' || p.sol.rel === '>=', t = Math.round(M.fnum(x)) + (right ? 2 : -2);
    const l = M.fnum(M.at(p.P.lhs, M.F(t))), rr = M.fnum(M.at(p.P.rhs, M.F(t)));
    W.verify = 'Test ' + p.v + ' = ' + (t < 0 ? '−' + -t : t) + ' from your answer: ' + fmtN(l) + ' ' + M.RELS[p.P.rel] + ' ' + fmtN(rr) + ' ✓. The green shows every solution.';
  }
  setFb('', '');
  const n = (state.solved[s.id] || 0) + (W.extra && state.done[s.id] ? 0 : 1);
  if (!state.done[s.id]) { state.solved[s.id] = n; if (n >= s.need) state.done[s.id] = true; }
  save();
  if (p.interp) W.interp = { picked: null };
  renderAll();
  return { ok: true, final: true };
}

/* ---------- events ---------- */
$('bCheck').addEventListener('click', submit);
$('lineIn').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
$('lineIn').addEventListener('input', () => { if (W.lastBad) { W.lastBad = null; draw(); } });
$('keys').addEventListener('click', e => {
  const b = e.target.closest('[data-k]'); if (!b) return;
  const inp = $('lineIn'), k = b.dataset.k;
  const s0 = inp.selectionStart == null ? inp.value.length : inp.selectionStart, s1 = inp.selectionEnd == null ? s0 : inp.selectionEnd;
  if (k === 'Clear') inp.value = '';
  else if (k === '⌫') { const a = s0 === s1 ? Math.max(0, s0 - 1) : s0; inp.value = inp.value.slice(0, a) + inp.value.slice(s1); inp.setSelectionRange(a, a); }
  else { const ins = ['=', '<', '>', '≤', '≥', '+', '−', '×'].includes(k) ? ' ' + k + ' ' : k; inp.value = inp.value.slice(0, s0) + ins + inp.value.slice(s1); const c = s0 + ins.length; inp.setSelectionRange(c, c); }
  inp.focus(); inp.dispatchEvent(new Event('input'));
});
$('bShow').addEventListener('click', () => {
  const p = W.prob;
  if (W.phase === 'write') { $('lineIn').value = M.pretty(p.text); setFb('Here is one way to write it. Read it against the story, then press <b>Check</b>.', ''); return; }
  const last = M.parseLine(W.lines[W.lines.length - 1].text, p.v);
  const ns = M.nextStep(last, p.v);
  $('lineIn').value = ns.line; setFb('<b>Next:</b> ' + ns.say + ' Press <b>Check</b>.', '');
});
$('predict').addEventListener('click', e => {
  const b = e.target.closest('[data-pick]'); if (!b) return;
  state.predict[cur().id] = +b.dataset.pick; save(); setFb('', ''); renderSide(); $('lineIn').focus();
});
$('doneBox').addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) return select(g.dataset.go);
  const a = e.target.closest('[data-act]'); const ib = e.target.closest('[data-interp]');
  if (ib) { W.interp.picked = +ib.dataset.interp; renderDone(); return; }
  if (!a) return;
  if (a.dataset.act === 'more') W.extra = true;
  newProblem(); setFb('', ''); renderAll(); $('lineIn').focus();
});
$('stepPrev').addEventListener('click', () => { const i = STEPS.indexOf(cur()); if (i > 0) select(STEPS[i - 1].id); });
$('stepNext').addEventListener('click', () => { const i = STEPS.indexOf(cur()); if (i < STEPS.length - 1) select(STEPS[i + 1].id); });

/* ---------- popups ---------- */
let afterDialog = null;
function openDlg(title, html, then) {
  $('dlgTitle').textContent = title; $('dlgBody').innerHTML = html; afterDialog = then || null;
  const d = $('dlg'); if (d.showModal) { if (!d.open) d.showModal(); } else d.setAttribute('open', '');
  $('dlgBody').scrollTop = 0;
}
function closeDlg() { const d = $('dlg'); if (d.close) d.close(); else { d.removeAttribute('open'); d.dispatchEvent(new Event('close')); } }
$('dlg').addEventListener('close', () => { const f = afterDialog; afterDialog = null; if (f) f(); });
$('dlgClose').addEventListener('click', closeDlg);
$('dlg').addEventListener('click', e => {
  if (e.target === $('dlg')) return closeDlg();
  const g = e.target.closest('[data-go]'); if (g) { closeDlg(); select(g.dataset.go); }
  if (e.target.closest('#bNewStudent') && confirm('Start again from step 1? All the work saved on this device will be erased.')) { state = blank(); save(); closeDlg(); select(state.current); }
});
$('bTask').addEventListener('click', () => { const s = cur(); openDlg(s.sec + ' · ' + s.title, ICAN + '<p style="font-size:13px;color:#a7b4c8">Goes with: ' + s.paper + '</p>' + s.task); });
$('bPaper').addEventListener('click', () => { const s = cur(); openDlg('In your notes', '<div class="box paper"><div class="label">Explain it in your notes</div>' + s.paperTask + '</div>'); });
$('bHint').addEventListener('click', () => {
  const s = cur(); W.hintN = Math.min(s.hints.length, W.hintN + 1);
  openDlg('Hint', s.hints.slice(0, W.hintN).map((h, i) => '<div class="box hint"><div class="label">Hint ' + (i + 1) + '</div><p>' + h + '</p></div>').join('') + (W.hintN < s.hints.length ? '<p style="color:#a7b4c8">Press Hint again for another.</p>' : '<p style="color:#a7b4c8">Still stuck? Close this and press <b>Show me</b> for the next line.</p>'));
});
$('bSteps').addEventListener('click', () => {
  let h = '<div class="steps-list">', sec = '';
  STEPS.forEach((s, i) => {
    if (s.sec !== sec) { sec = s.sec; h += '<div class="sec">' + (sec === 'Mix' ? 'Mixed practice' : sec + ' · ' + s.paper.replace('Notes · ', 'Notes ')) + '</div>'; }
    h += '<button type="button" data-go="' + s.id + '" class="' + (state.done[s.id] ? 'done' : '') + (s.id === state.current ? ' current' : '') + '"><span class="dot">' + (state.done[s.id] ? '✓' : '') + '</span>' + (i + 1) + '. ' + s.title + '<span style="margin-left:auto;font-size:13px;color:#a7b4c8">' + (state.solved[s.id] || 0) + '/' + s.need + '</span></button>';
  });
  openDlg('All steps', h + '</div><div class="acts" style="margin-top:14px"><button type="button" class="btn small" id="bNewStudent">⟲ New student (erase this device’s work)</button></div>');
});

/* ---------- tutorial ---------- */
const TOUR = [['#problem', 'This is the problem to solve.'], ['#lineIn', 'Type the next line of your working here, then press Check.'], ['#keys', 'These keys type the variable, brackets and signs.'], ['#stage', 'The picture checks your line. Level means it still has the same answer as the first line.'], ['#bHint', 'Stuck? A hint opens here. Show me fills in the next line.'], ['#bSteps', 'All the steps and your progress are here.']];
let tour = null;
function unspot() { document.querySelectorAll('.spot').forEach(n => n.classList.remove('spot')); }
function startTour() { endTour(); tour = { steps: TOUR.filter(s => { const n = document.querySelector(s[0]); return n && n.getClientRects().length; }), i: -1 }; $('coach').hidden = false; tourNext(); }
function tourNext() {
  unspot(); tour.i++; const s = tour.steps[tour.i]; if (!s) return endTour();
  const n = document.querySelector(s[0]); n.classList.add('spot'); if (n.scrollIntoView) n.scrollIntoView({ block: 'nearest' });
  $('coachTxt').textContent = s[1]; $('coachN').textContent = (tour.i + 1) + ' of ' + tour.steps.length;
  $('coachNext').textContent = tour.i === tour.steps.length - 1 ? 'Done' : 'Next'; $('coachNext').focus({ preventScroll: true });
}
function endTour() { if (!tour) return; unspot(); $('coach').hidden = true; tour = null; }
$('bTour').addEventListener('click', startTour);
$('coachNext').addEventListener('click', () => { if (tour) tourNext(); });
$('coachSkip').addEventListener('click', endTour);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && tour) endTour(); });

/* ---------- start ---------- */
load();
if (DEBUG) window.TR = { MODEL, STEPS, W: () => W, state: () => state, select, submit, newProblem, testPoint, openDlg, closeDlg, startTour, renderAll };
select(location.hash.slice(1) && STEPS.some(s => s.id === location.hash.slice(1)) ? location.hash.slice(1) : state.current);
</script>
</body>
