<!-- =====================================================================
   PAT QUESTIONS TRAINER (narrow trainer format, see _sims-context.md)
   Math 9 | all strands | PAT prep. The released PAT items (2013, 2015, 2019) that used to sit on the PAT Prep page,
   in the trainer look (user request, 2026-10-30), plus PAT-style generated items so a round is never the same list.
   One PAT strand per tab, 10 items a round, multiple choice (tap, one try) or numerical response (type, two tries):
     N   Number                 powers, rational numbers, order of operations, square roots
     PR  Patterns               equations, inequalities, polynomials, linear relations, word problems
     SS  Shape & Space          area and √, surface area of cubes, circle angles and tangents, similarity and scale
     SP  Stats & Prob           sampling and bias, subjective judgment, predicting from a sample
     PAT Mixed                  any strand, weighted like the PAT blueprint (32 / 36 / 24 / 8)
   Every word problem has a schematic picture of its story (a tape, a road, a bar model, the gong and its chain, the
   cubes in 3-D, the school and its sample); computations show their worked steps instead. The 📖 link follows the
   current item's own topic and section. About 7 in 10 items are released items, kept out for the next 6 items of their strand;
   the rest are generated (exponent chains, perfect-square counts, two plans, saving up, ages, gardens, tickets,
   inscribed angles, scale factors, predictions, fair samples).
   Model: every item's answer and named mistakes are checked in the model tests (extra-pq.js).
   ?debug=1 puts DRILL (and MODEL) on window, turns off saving and motion.
   ===================================================================== -->

<script>
const DEBUG = /[?&]debug=1/.test(location.search);

/* ===== DRILL KIT START (no DOM): exact fractions and seeded random ===== */
const Q = (() => {
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);
  const q = (n, d) => { d = d == null ? 1 : d; if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return { n: n / g, d: d / g }; };
  const of = v => typeof v === 'number' ? (Number.isInteger(v) ? q(v) : dec(String(v))) : v;
  const add = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d + b.n * a.d, a.d * b.d); };
  const sub = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d - b.n * a.d, a.d * b.d); };
  const mul = (a, b) => { a = of(a); b = of(b); return q(a.n * b.n, a.d * b.d); };
  const div = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d, a.d * b.n); };
  const neg = a => { a = of(a); return q(-a.n, a.d); };
  const eq = (a, b) => { if (a == null || b == null) return false; a = of(a); b = of(b); return a.n === b.n && a.d === b.d; };
  const val = a => { a = of(a); return a.n / a.d; };
  const isInt = a => of(a).d === 1;
  function dec(s) { const m = /^(-?)(\d*)\.?(\d*)$/.exec(s); if (!m) return null; const f = m[3] || ''; return q((m[1] ? -1 : 1) * parseInt((m[2] || '0') + f, 10), Math.pow(10, f.length)); }
  // Text a student typed -> fraction, '' for blank, or null if it is not a number.
  function parse(s) {
    s = String(s == null ? '' : s).replace(/[−–—]/g, '-').replace(/\s+/g, '').replace(/^\+/, '');
    if (s === '') return '';
    if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');
    if (/^-?\d+(\.\d+)?$/.test(s) || /^-?\d*\.\d+$/.test(s)) return dec(s);
    const m = /^(-?)\(?(-?\d+)\)?\/\(?(-?\d+)\)?$/.exec(s);
    if (m) { const d = parseInt(m[3], 10); if (d === 0) return null; return q((m[1] ? -1 : 1) * parseInt(m[2], 10), d); }
    return null;
  }
  const str = a => { a = of(a); return (a.n < 0 ? '−' : '') + (a.d === 1 ? Math.abs(a.n) : Math.abs(a.n) + '/' + a.d); };
  let rand = Math.random;
  function seed(n) { let a = n >>> 0; rand = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rnd = (lo, hi) => lo + Math.floor(rand() * (hi - lo + 1));
  const pick = arr => arr[rnd(0, arr.length - 1)];
  const nz = (lo, hi) => { let k; do { k = rnd(lo, hi); } while (k === 0); return k; };
  const chance = p => rand() < p;
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  return { gcd, lcm, q, of, add, sub, mul, div, neg, eq, val, isInt, parse, str, seed, rnd, pick, nz, chance, shuffle };
})();
/* ===== DRILL KIT END ===== */


/* ===================== MODEL START (no DOM) ===================== */
/* PAT questions: the released PAT items (2013, 2015, 2019) from the PAT Prep page, plus PAT-style generated items.
   An item: { id, s (strand), yr, code, topic, sec, fmt: 'mc' | 'nr', ask, stem (HTML), story (true for a word problem),
   opts + a (index) + cues (per option) for mc, a (number) + pre/unit + miss ([[value, cue]]) for nr, cue, steps, pic }. */
const MODEL = (() => {
  const { rnd, pick, chance, shuffle } = Q;
  const near = (g, x, t) => g != null && Math.abs(g - x) <= (t == null ? .001 : t) + 1e-9;
  const B = s => '<b>' + s + '</b>';
  const SUP = n => String(n).split('').map(d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]).join('');
  const r2 = x => Math.round(x * 100) / 100;
  const money = x => '$' + (Number.isInteger(x) ? String(x) : x.toFixed(2));
  const sgn = n => n < 0 ? '− ' + -n : '+ ' + n;
  const LET = ['A', 'B', 'C', 'D'];

  /* ---------- the released items ---------- */
  const BANK = [
    /* Number */
    { id: 'n1', s: 'num', yr: '2019', code: 'PE2', topic: 'pe', sec: 2, fmt: 'nr', ask: 'Evaluate', stem: '2³ × 2⁰', a: 8,
      miss: [[0, 'Any power to 0 is 1'], [6, '2³ means 2 × 2 × 2'], [2, 'Any power to 0 is 1']], cue: 'Any power to 0 is 1', steps: ['2³ × 2⁰', '= 8 × 1', '= 8'] },
    { id: 'n2', s: 'num', yr: '2019', code: 'PE5', topic: 'pe', sec: 5, fmt: 'nr', ask: 'Simplify, then evaluate', stem: '(3²)⁴ ÷ [3(3)(3⁴)]', a: 9,
      miss: [[1, 'Power of a power: multiply'], [81, '3(3)(3⁴) is 3⁶']], cue: 'Write both as powers of 3', steps: ['(3²)⁴ ÷ [3(3)(3⁴)]', '= 3⁸ ÷ 3⁶', '= 3²', '= 9'] },
    { id: 'n3', s: 'num', yr: '2019', code: 'RN2', topic: 'rn', sec: 2, fmt: 'nr', ask: 'Simplest form', stem: '1/6 + 1/3 + 2½', a: 3,
      miss: [[2.5, 'Add the fractions too']], cue: 'Common denominator: 6', steps: ['1/6 + 1/3 + 2½', '= 1/6 + 2/6 + 15/6', '= 18/6', '= 3'] },
    { id: 'n4', s: 'num', yr: '2019', code: 'RN3', topic: 'rn', sec: 3, fmt: 'nr', ask: 'Simplest form', stem: '−½ × (−⅓) × 12', a: 2,
      miss: [[-2, 'Negative × negative is positive']], cue: 'Multiply the fractions first', steps: ['−½ × (−⅓) × 12', '= ⅙ × 12', '= 2'] },
    { id: 'n5', s: 'num', yr: '2019', code: 'RN2', topic: 'rn', sec: 2, fmt: 'nr', ask: 'Evaluate', stem: '13.2 + 0.05 − 5.45', a: 7.8,

    A.el('rect', { x: x + 2, y: y + 2, width: g - 4, height: g - 4, rx: 4, fill: C.blue, 'fill-opacity': i === 0 ? .4 : .14, stroke: C.blue, 'stroke-width': 1.2 }, A.svg);
    if (done(V) && g > 22) lab(A, x + g / 2, y + g / 2, String(it.h), hit, { 'font-size': Math.min(14, g * .45) });
  }
  lab(A, 485, 64, it.N + ' in all', C.blue, { 'font-size': 20 });
  A.el('path', { d: 'M290 200H345', stroke: C.yellow, 'stroke-width': 3, 'marker-end': 'url(#aY)' }, A.svg);
  if (!after(V)) return;
  lab(A, 318, 178, '× ' + it.m, C.yellow, fade(0, { 'font-size': 20 }));
  lab(A, 320, 350, it.N + ' = ' + it.m + ' groups of ' + it.n, C.muted, fade(1, { 'font-size': 17 }));
  if (done(V)) lab(A, 320, 388, it.fmt === 'mc' ? '3/25 = 12% only if the sample is like all 750' : it.m + ' × ' + it.h + ' = ' + it.a, C.green, fade(2, { 'font-size': 19 }));
};
// A Grade 7–9 school: 3 classes per grade, 8 students per class. Each sample is a set of [grade, class, seat].
const SAMPLE = {
  fair: [[0, 0, 1], [0, 1, 6], [0, 2, 3], [1, 0, 4], [1, 1, 0], [1, 2, 7], [2, 0, 2], [2, 1, 5], [2, 2, 1]],
  g9: [0, 1, 2].flatMap(c => [0, 2, 4, 6].map(s => [2, c, s])),
  team: [[1, 0, 2], [1, 2, 5], [2, 0, 1], [2, 1, 3], [2, 1, 6], [2, 2, 4]],
  band: [[0, 1, 2], [1, 1, 3], [1, 1, 7], [2, 2, 0], [2, 2, 5]],
  friends: [[1, 1, 0], [1, 1, 1], [1, 1, 2], [1, 1, 3]],
  lib: [[0, 2, 0], [0, 2, 1], [1, 2, 6], [2, 1, 7], [2, 1, 4]],
  class: [0, 1, 2, 3, 4, 5, 6, 7].map(s => [1, 1, s])
};
PICS.bias = (A, it, V) => {
  const chosen = V.res && V.res.code && V.res.code[0] === 'o' ? it.groups[+V.res.code.slice(1)] : null, show = done(V) ? 'fair' : chosen;
  const inS = (g, c, s) => show && SAMPLE[show].some(p => p[0] === g && p[1] === c && p[2] === s), col = done(V) ? C.green : C.red;
  [7, 8, 9].forEach((gr, g) => {

    [0, 1, 2].forEach(c => {
      const y0 = 84 + c * 88;
      A.el('rect', { x: x0 - 8, y: y0 - 8, width: 136, height: 70, rx: 10, fill: C.panel, stroke: C.edge, 'stroke-width': 1.5 }, A.svg);
      for (let s = 0; s < 8; s++) { const on = inS(g, c, s); dot(A, x0 + 12 + (s % 4) * 32, y0 + 12 + Math.floor(s / 4) * 30, 9, on ? col : C.muted, { 'fill-opacity': on ? 1 : .3, class: on ? 'pop' : null }); }
    });
  });
  if (V.phase === 'show' && chosen && chosen !== 'fair') lab(A, 320, 360, 'your pick misses most students', C.red, { 'font-size': 16 });
  if (!done(V) && chosen) lab(A, 320, 385, 'only these students are asked', C.red, { 'font-size': 17 });
  if (done(V)) lab(A, 320, 385, 'random from every grade: everyone has a chance', C.green, { 'font-size': 17 });
};

/* ---------- tabs ---------- */
const NOTES = {
  pe: 'powers-exponents/math9-powers-notes-v1.html', rn: 'rational-numbers/math9-rational-numbers-notes-v1.html', sr: 'square-roots/math9-square-roots-notes-v1.html',
  le: 'linear-equations/math9-linear-equations-notes-v1.html', lr: 'linear-relations/math9-linear-relations-notes-v1.html', po: 'polynomials/math9-polynomials-notes-v1.html',
  cg: 'circle-geometry/math9-circle-geometry-notes-v1.html', me: 'measurement/math9-measurement-notes-v1.html', si: 'similarity/math9-similarity-notes-v1.html',
  st: 'statistics/math9-statistics-notes-v1.html', pr: 'probability/math9-probability-notes-v1.html'
};
// About 7 in 10 items are released items, the rest generated. A released item does not come back until about
// 6 other items from its strand have been shown, so repeats in a round are rare; missed ones then
// come back more often through the shell's weighting.
const recent = [];
const windowOf = s => Math.min(6, M.BANK.filter(b => b.s === s).length - 2);
function shown(it) { if (!it.src) return; const i = recent.indexOf(it.id); if (i >= 0) recent.splice(i, 1); recent.push(it.id); }
function genStrand(s) {
  const pool = M.BANK.filter(b => b.s === s), skip = recent.filter(id => id[0] === pool[0].id[0]).slice(-windowOf(s));
  const fresh = pool.filter(b => skip.indexOf(b.id) < 0);
  return Q.chance(.7) ? Object.assign({}, Q.pick(fresh.length ? fresh : pool)) : Q.pick(M.GENS[s])();
}
const optHTML = (o, math) => math ? mathText(o) : o;
function makeTab(id, code, name, gen) {
  return {
    id, code, name, sec: 1, notes: '../notes/' + NOTES.rn, link: it => ({ notes: '../notes/' + NOTES[it.topic], sec: it.sec }),
    kind: it => it.fmt === 'mc' ? 'choice' : 'slots', gen, typeOf: it => it.code,
    q: it => { shown(it); return it.ask; },
    prompt: it => (it.src ? '<div class="src">' + it.src + '</div>' : '') + (it.story ? '<div class="story">' + it.stem + '</div>' : mathText(it.stem)),
    choices: it => it.opts.map((o, i) => ({ v: LET[i], label: '<span class="lt">' + LET[i] + '</span>' + optHTML(o, it.om), math: !!it.om, aria: o })),
    slots: it => [it.pre || null, { k: 'v', label: 'answer', wide: true }, it.unit ? { h: '<span style="font-family:inherit;font-size:.7em">' + it.unit + '</span>' } : null].filter(Boolean),
    check: M.check, answer: M.answer,
    draw: (A, it, V) => (PICS[it.pic] || steps)(A, it, V)
  };
}
const WEIGHT = [['num', 32], ['pat', 36], ['ss', 24], ['sp', 8]];
const PAGE = {
  key: 'math9-pat-questions-trainer-v1', course: 'Math 9 · PAT prep', title: 'PAT Questions',
  notes: '../notes/' + NOTES.rn,
  tabs: [
    makeTab('num', 'N', 'Number', () => genStrand('num')),
    makeTab('pat', 'PR', 'Patterns', () => genStrand('pat')),
    makeTab('ss', 'SS', 'Shape & Space', () => genStrand('ss')),
    makeTab('sp', 'SP', 'Stats & Prob', () => genStrand('sp')),
    makeTab('mix', 'PAT', 'Mixed', () => { let r = Q.rnd(0, 99); const s = WEIGHT.find(w => (r -= w[1]) < 0)[0]; return genStrand(s); })
  ]
};
DRILL.boot(PAGE);
