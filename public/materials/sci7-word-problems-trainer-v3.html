   v3 (user request 2026-11-17): v2's flow, with real scenarios like the workbook and unit-test application questions,
   at the Apply and Analyze levels of Bloom's. v2's short stories padded with unrelated sentences are gone.
   A scenario is one Alberta situation (60–110 words, most with a small data table) and 2–3 linked parts:
   part a applies one idea (Apply); parts b and c read the data, predict a chain of effects, judge a claim or pick
   the plan that fixes the cause (Analyze). The details to skip belong to the scenario: a true fact that changes no
   answer, or a data row that did not change. Each part is one item in the round of 10 (about four scenarios).
   Steps per part, each checked (kit: sws.js):
     1 Key facts         tap the sentences and table rows that matter for this part (two tries)
     2 Key idea          the science idea the part needs (one of the unit's ideas; close ideas never offered together)
     3 What can we assume?  on most Analyze parts
     4 Answer            named misconceptions (two tries)
     5 Best explanation  last part: the best of three written answers: complete (claim, evidence, reason),
                         no reasoning, or a misconception. A slip anywhere in the part gives a yellow dot.
   After the answer: the picture (icon cards and arrows, an energy pyramid, or a bar chart of the scenario's data)
   and the reasoning chain, with a 📄 Reading chip to look back.
     7-1 Ecosystems (12 scenarios): beaver dam (7-1-01, 7-1-02), fertilizer in a slough (7-1-04, 7-1-02),
         energy in a lake and extra pike (7-1-02), succession after a fire (7-1-04), pine beetles and cold winters
         (7-1-01, 7-1-04, 7-1-03), burrowing owls and ground squirrels (7-1-02, 7-1-04), Banff elk, aspen and beavers
         (7-1-02, 7-1-04), zebra mussels (7-1-04, 7-1-02), leaf-litter bags (7-1-02), drought and biodiversity
         (7-1-03), caribou, lines and wolves (7-1-02, 7-1-04), a schoolyard quadrat survey and a fair test (7-1-01)
     7-2 Plants (12 scenarios): Elodea, onion and carrot cells (7-2-01), celery in blue water, xylem and phloem
         (7-2-02), van Helmont-style poplar in a tub (7-2-03), CO₂ in Redcliff tomato greenhouses (7-2-03), netted
         saskatoon branches and a cold bloom week (7-2-04), Taber potatoes from tubers and a one-variety disease
         (7-2-04), what wheat seeds need to sprout (7-2-04), clubroot, rotation and muddy tractors (7-2-05), rapeseed
         to canola, GMO canola and a shopper's claim (7-2-05), flax and hemp vs cotton (7-2-05), barley vs beef from a
         Lethbridge feedlot (7-2-03), a Calgary vertical farm with and without minerals (7-2-02, 7-2-03)
         New ideas beside v2's nine: germ (what a seed needs), root (what roots take in), use (food and fibre parts).
   Teacher check: all numbers are made up and change from play to play (inside ranges where every answer holds).
   Real-world claims to confirm: beaver weight (~20 kg), jack pine cones opened by fire, pine beetle larvae killed
   below about −35 °C, burrowing owls nesting in ground-squirrel burrows and wintering in Texas and Mexico, Banff

<script>
const DEBUG = /[?&]debug=1/.test(location.search);

/* ===== DRILL KIT START (no DOM): exact fractions and seeded random ===== */
const Q = (() => {
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);
  const q = (n, d) => { d = d == null ? 1 : d; if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return { n: n / g, d: d / g }; };
  const of = v => typeof v === 'number' ? (Number.isInteger(v) ? q(v) : dec(String(v))) : v;
  const add = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d + b.n * a.d, a.d * b.d); };
  const sub = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d - b.n * a.d, a.d * b.d); };
  const mul = (a, b) => { a = of(a); b = of(b); return q(a.n * b.n, a.d * b.d); };
  const div = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d, a.d * b.n); };
  const neg = a => { a = of(a); return q(-a.n, a.d); };
  const eq = (a, b) => { if (a == null || b == null) return false; a = of(a); b = of(b); return a.n === b.n && a.d === b.d; };
  const val = a => { a = of(a); return a.n / a.d; };
  const isInt = a => of(a).d === 1;
  function dec(s) { const m = /^(-?)(\d*)\.?(\d*)$/.exec(s); if (!m) return null; const f = m[3] || ''; return q((m[1] ? -1 : 1) * parseInt((m[2] || '0') + f, 10), Math.pow(10, f.length)); }
  // Text a student typed -> fraction, '' for blank, or null if it is not a number.
  function parse(s) {
    s = String(s == null ? '' : s).replace(/[−–—]/g, '-').replace(/\s+/g, '').replace(/^\+/, '');
    if (s === '') return '';
    if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');
    if (/^-?\d+(\.\d+)?$/.test(s) || /^-?\d*\.\d+$/.test(s)) return dec(s);
    const m = /^(-?)\(?(-?\d+)\)?\/\(?(-?\d+)\)?$/.exec(s);
    if (m) { const d = parseInt(m[3], 10); if (d === 0) return null; return q((m[1] ? -1 : 1) * parseInt(m[2], 10), d); }
    return null;
  }
  const str = a => { a = of(a); return (a.n < 0 ? '−' : '') + (a.d === 1 ? Math.abs(a.n) : Math.abs(a.n) + '/' + a.d); };
  let rand = Math.random;
  function seed(n) { let a = n >>> 0; rand = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rnd = (lo, hi) => lo + Math.floor(rand() * (hi - lo + 1));
  const pick = arr => arr[rnd(0, arr.length - 1)];
  const nz = (lo, hi) => { let k; do { k = rnd(lo, hi); } while (k === 0); return k; };
  const chance = p => rand() < p;
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  return { gcd, lcm, q, of, add, sub, mul, div, neg, eq, val, isInt, parse, str, seed, rnd, pick, nz, chance, shuffle };
})();
/* ===== DRILL KIT END ===== */

/* ===================== MODEL START (no DOM) ===================== */
/* Science 7 word problems v3: scenarios like the workbook and unit-test application questions.
   A scenario: { p: passage, parts: [part, …], pic }. The passage is a list of sentences S(text, tag) and tables
   TB(head, [[cells, tag], …]). A tag says which parts need the chunk as a key fact:
     'ab'  a key fact for parts a and b      'B'  fine to tap for part b, not needed (evidence that rules a choice out)
