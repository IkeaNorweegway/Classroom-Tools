   HEAT TRAINER (narrow trainer format, see _sims-context.md)
   Science 7 | Heat and Temperature | LO 7-3-01 to 7-3-05. Used after the lesson: it does not teach,
   it points back to the notes (Sections 1–6). One narrow skill per tab, 10 items a round:
     7-3-01 °C ↔ K          type the other scale (K = °C + 273); two scales side by side
     7-3-01 Heat or temp?   cup vs bathtub, pool or lake: more thermal energy, or higher temperature (A, B or same)
     7-3-01 Heat flow       two things touching: heat flows hot to cold, or no flow at the same temperature
     7-3-02 Particles       expands or contracts (power lines, bridges, balloons); why: particles spread out, never grow
     7-3-03 Transfer        conduction, convection or radiation
     7-3-03 Conductors      better conductor or insulator; metal and wood at room temperature are the same temperature
     7-3-04 Heats faster?   sand vs water, pot vs pot of water, Calgary vs Vancouver: water warms and cools slowly
     7-3-05 Insulation      insulation slows heat both ways (the snowman's coat); more insulation loses less heat
   Model and limits: particle pictures are schematic (same particles, spacing changes). Specific heat is qualitative,
   as in the notes; no formula.
   Named mistakes: subtracting 273 for kelvin, negative kelvin, temperature read as amount of heat, cold flowing,
   particles getting bigger, metal "colder" than wood, insulation making heat.
   ?debug=1 puts DRILL (and MODEL) on window, turns off saving and motion.

  .btn.primary:hover:not(:disabled) { background: #7fd3e7; }

  .dots { display: flex; gap: 7px; justify-content: center; margin-top: auto; padding-top: 4px; }
  .dots span { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--edge); }
  .dots span.now { border-color: var(--text); }
  .dots .g { background: var(--green); border-color: var(--green); }
  .dots .y { background: var(--yellow); border-color: var(--yellow); }
  .dots .r { background: var(--red); border-color: var(--red); }
  .done { text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
  .done .score { font-family: var(--math); font-size: 64px; line-height: 1; }
  .done .score small { font-size: 30px; color: var(--muted); }
  .keypad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .keypad button { min-height: 46px; border: 1px solid var(--edge); border-radius: 10px; background: var(--stage); font-family: var(--math); font-size: 22px; }

  /* motion: lines draw themselves in, marks fade or pop in */
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .7s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .fade { animation: fade .45s ease-out both; }
  @keyframes fade { from { opacity: 0; } }

  @keyframes pop { from { opacity: 0; transform: scale(.3); } }

  .nomo .draw { animation: none; stroke-dashoffset: 0; }
  .nomo .fade, .nomo .pop, .nomo .pulse { animation: none; }

  @media (max-width: 1150px) { .brand { display: none; } .app { grid-template-columns: minmax(0, 1fr) 330px; } .tab { padding: 2px 11px; } }
  @media (max-height: 700px) {

  }

    html, body { height: auto; } body { overflow: auto; display: block; }
    .top { flex-wrap: wrap; } .tabs { order: 3; flex-basis: 100%; justify-content: flex-start; } .notes { margin-left: auto; }
    .app { display: block; }
    .stage { height: 52vh; min-height: 260px; }
    .side { border-left: none; border-top: 1px solid var(--edge); overflow: visible; }
  }
  @media (prefers-reduced-motion: reduce) {
    .draw { animation: none; stroke-dashoffset: 0; } .fade, .pop, .pulse { animation: none; }
  }
/* ===== DRILL SHELL CSS END ===== */

  <a class="notes" id="notes" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg><span id="notesTxt"></span></a>
</header>

<div class="app">
  <section class="stage" id="stageWrap"><svg id="svg" viewBox="0 0 640 420" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Picture for this question"></svg></section>
  <aside class="side" id="side">

<script>
const DEBUG = /[?&]debug=1/.test(location.search);

/* ===== DRILL KIT START (no DOM): exact fractions and seeded random ===== */
const Q = (() => {
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);
  const q = (n, d) => { d = d == null ? 1 : d; if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return { n: n / g, d: d / g }; };
  const of = v => typeof v === 'number' ? (Number.isInteger(v) ? q(v) : dec(String(v))) : v;
  const add = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d + b.n * a.d, a.d * b.d); };
  const sub = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d - b.n * a.d, a.d * b.d); };
  const mul = (a, b) => { a = of(a); b = of(b); return q(a.n * b.n, a.d * b.d); };
  const div = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d, a.d * b.n); };
  const neg = a => { a = of(a); return q(-a.n, a.d); };
  const eq = (a, b) => { if (a == null || b == null) return false; a = of(a); b = of(b); return a.n === b.n && a.d === b.d; };
  const val = a => { a = of(a); return a.n / a.d; };
  const isInt = a => of(a).d === 1;
  function dec(s) { const m = /^(-?)(\d*)\.?(\d*)$/.exec(s); if (!m) return null; const f = m[3] || ''; return q((m[1] ? -1 : 1) * parseInt((m[2] || '0') + f, 10), Math.pow(10, f.length)); }
  // Text a student typed -> fraction, '' for blank, or null if it is not a number.
  function parse(s) {
    s = String(s == null ? '' : s).replace(/[−–—]/g, '-').replace(/\s+/g, '').replace(/^\+/, '');
    if (s === '') return '';
    if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');
    if (/^-?\d+(\.\d+)?$/.test(s) || /^-?\d*\.\d+$/.test(s)) return dec(s);
    const m = /^(-?)\(?(-?\d+)\)?\/\(?(-?\d+)\)?$/.exec(s);
    if (m) { const d = parseInt(m[3], 10); if (d === 0) return null; return q((m[1] ? -1 : 1) * parseInt(m[2], 10), d); }
    return null;
  }
  const str = a => { a = of(a); return (a.n < 0 ? '−' : '') + (a.d === 1 ? Math.abs(a.n) : Math.abs(a.n) + '/' + a.d); };
  let rand = Math.random;
  function seed(n) { let a = n >>> 0; rand = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rnd = (lo, hi) => lo + Math.floor(rand() * (hi - lo + 1));
  const pick = arr => arr[rnd(0, arr.length - 1)];
  const nz = (lo, hi) => { let k; do { k = rnd(lo, hi); } while (k === 0); return k; };
  const chance = p => rand() < p;
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  return { gcd, lcm, q, of, add, sub, mul, div, neg, eq, val, isInt, parse, str, seed, rnd, pick, nz, chance, shuffle };
})();
/* ===== DRILL KIT END ===== */

/* ===================== MODEL START (no DOM) ===================== */
const MODEL = (() => {
  const { rnd, pick, chance, shuffle } = Q;
  const val = Q.val;

  /* 7-3-01 Celsius and Kelvin: K = °C + 273 */
  const TEMPS = [-273, -200, -100, -40, -30, -20, -15, -10, -5, 0, 5, 10, 15, 20, 21, 22, 25, 30, 37, 40, 50, 60, 75, 80, 90, 100, 150, 200];
  function genK() { const c = pick(TEMPS), form = chance(.6) ? 'toK' : 'toC'; return { form, c, k: c + 273, v: form === 'toK' ? c + 273 : c }; }
  function checkK(it, r) {
    const x = val(r.v);
    if (x === it.v) return { ok: true };
    if (it.form === 'toK') {
      if (x < 0) return { code: 'neg-k', cue: 'No negative kelvin' };
      if (x === it.c - 273) return { code: 'sub', cue: 'K = °C + 273' };
      if (x === it.c) return { code: 'same', cue: 'Add 273 for kelvin' };
    } else {
      if (x === it.k + 273) return { code: 'add', cue: '°C = K − 273' };
      if (x === it.k) return { code: 'same', cue: 'Subtract 273 for °C' };
    }
    return { code: 'other', cue: 'Kelvin is 273 more than °C' };
  }

  /* 7-3-01 heat (thermal energy) vs temperature */
  const SMALL = [['Cup', '☕'], ['Mug', '☕'], ['Kettle', '🫖']], BIG = [['Bathtub', '🛁'], ['Swimming pool', '🏊'], ['Lake', '🏞️']];
  function genMore() {
    const ask = chance(.55) ? 'thermal' : 'temp', kase = pick(['sameT', 'sameSize', 'hotSmall']);
    let A, B;
    if (kase === 'sameT') { const t = pick([20, 30, 40, 60, 80, 90]); A = { o: pick(SMALL), t, big: false }; B = { o: pick(BIG), t, big: true }; }
    else if (kase === 'sameSize') { const o = pick(SMALL), t1 = pick([20, 30, 40]), t2 = pick([70, 80, 90]); A = { o, t: t1, big: false }; B = { o, t: t2, big: false }; }
    else { A = { o: pick(SMALL), t: pick([80, 85, 90, 95]), big: false }; B = { o: pick(BIG), t: pick([15, 20, 25]), big: true }; }
    if (chance(.5)) [A, B] = [B, A];
    let a;
    if (ask === 'temp') a = A.t === B.t ? 'same' : A.t > B.t ? 'A' : 'B';
    else a = A.big !== B.big ? (A.big ? 'A' : 'B') : A.t > B.t ? 'A' : 'B';
    return { ask, kase, A, B, a };
  }
  function checkMore(it, r) {
    if (r.v === it.a) return { ok: true };
    if (it.ask === 'temp') return it.a === 'same' ? { code: 'temp-amount', cue: 'Same reading: same temperature' } : { code: 'temp-amount', cue: 'Temperature ignores the amount' };
    if (it.kase === 'sameSize') return { code: 'hotter', cue: 'Same amount: hotter has more' };
    return { code: 'thermal-amount', cue: 'More particles: more thermal energy' };
  }

  /* 7-3-01 which way does heat flow (hot to cold; none at the same temperature) */
  const PAIRS = [
    [['Your hand', '🖐️', 34], ['Snowball', '⛄', 0]], [['Soup', '🍲', 80], ['Spoon', '🥄', 20]], [['Ice cube', '🧊', 0], ['Juice', '🧃', 22]],
    [['Warm house', '🏠', 21], ['Winter air', '❄️', -20]], [['Frozen peas', '🧊', -18], ['Your hand', '🖐️', 34]], [['Hot pan', '🍳', 150], ['Egg', '🥚', 5]],
    [['Hot cocoa', '☕', 70], ['Room air', '💨', 21]], [['Metal desk', '🔩', 21], ['Wood desk', '🪵', 21]], [['Drink', '🥤', 21], ['Room air', '💨', 21]]
  ];
  function genFlow() {
    let [L, R] = pick(PAIRS); if (chance(.5)) [L, R] = [R, L];
    return { L, R, a: L[2] === R[2] ? 'none' : L[2] > R[2] ? 'r' : 'l' };
  }
  function checkFlow(it, r) {
    if (r.v === it.a) return { ok: true };
    if (it.a === 'none') return { code: 'none', cue: 'Same temperature: no heat flows' };
    if (r.v === 'none') return { code: 'flows', cue: 'Different temperatures: heat flows' };
    return { code: 'cold-flows', cue: 'Heat flows hot to cold' };
  }

  /* 7-3-02 particle model: expand or contract, and why */
  const SCEN = [
    ['Power lines on a hot day', 'exp'], ['A bridge in July heat', 'exp'], ['Thermometer liquid in a warm room', 'exp'], ['Railroad tracks in summer sun', 'exp'],
    ['A jar lid under hot water', 'exp'], ['Air in a balloon in the sun', 'exp'],
    ['Power lines at −30 °C', 'con'], ['A balloon in a freezer', 'con'], ['A sidewalk on a cold night', 'con'], ['Thermometer liquid outside in winter', 'con'], ['A bridge in January', 'con']
  ];
  function genPart() {
    if (chance(.6)) { const [t, a] = pick(SCEN); return { form: 'scen', t, a, hot: a === 'exp' }; }
    const hot = chance(.6); return { form: 'why', hot, a: hot ? 'apart' : 'closer' };
  }

});
