<!-- =====================================================================
   PLANET EARTH TRAINER (narrow trainer format, see _sims-context.md)
   Science 7 | Planet Earth | LO 7-5-01 to 7-5-06. Used after the lesson: it does not teach,
   it points back to the notes (Sections 1–6). One narrow skill per tab, 10 items a round:
     7-5-01 Layers      name the yellow layer, or match a property (liquid iron and nickel, flows slowly, …)
     7-5-02 Rock type   igneous, sedimentary or metamorphic, from a rock name or how it formed
     7-5-02 Crystals    big crystals: cooled slowly underground; small: fast at the surface (and back)
     7-5-03 Boundaries  divergent, convergent or transform, from plate arrows (top view) or a place or feature
     7-5-04 Earthquake  focus, epicenter (the notes' spelling) or fault in a cross-section
     7-5-04 Volcano     shield or composite, from the shape or a fact
     7-5-05 Surface     weathering, erosion or deposition
     7-5-06 Oldest?     the law of superposition in undisturbed layers: oldest, youngest, which fossil lived first
   Model and limits: layer radii are not to scale (the crust is drawn thicker). Plate arrows are a top view.
   Rock layers are always undisturbed here; the notes cover tilted and folded layers.
   Named mistakes: the top layer called oldest, melting called metamorphic, crystal size backwards, the epicenter put
   underground, boundary types mixed up.
   ?debug=1 puts DRILL (and MODEL) on window, turns off saving and motion.
   ===================================================================== -->
<style>
/* ===== DRILL SHELL CSS START (same in every narrow trainer; see _sims-context.md "Narrow trainer format") ===== */

  /* top bar: name, concept tabs, notes link */

  /* picture on the left, one answer area on the right */
  .app { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }

  .btn.primary { flex: 1; background: var(--blue); border-color: var(--blue); color: #04121a; }
  .btn.primary:hover:not(:disabled) { background: #7fd3e7; }
  .btn.go { background: var(--green); border-color: var(--green); color: #0b1a06; }
  .btn.icon { width: 56px; padding: 0; display: grid; place-items: center; color: var(--muted); }
  .btn.icon svg { width: 24px; height: 24px; }

  .fb .mark { font-size: 32px; font-weight: 800; width: 38px; text-align: center; flex-shrink: 0; }
  .fb.ok { color: var(--green); } .fb.bad { color: #ff9a90; } .fb.info { color: var(--muted); }
  .dots { display: flex; gap: 7px; justify-content: center; margin-top: auto; padding-top: 4px; }
  .dots span { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--edge); }
  .dots span.now { border-color: var(--text); }
  .dots .g { background: var(--green); border-color: var(--green); }
  .dots .y { background: var(--yellow); border-color: var(--yellow); }
  .dots .r { background: var(--red); border-color: var(--red); }
  .done { text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
  .done .score { font-family: var(--math); font-size: 64px; line-height: 1; }
  .done .score small { font-size: 30px; color: var(--muted); }
  .keypad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .keypad button { min-height: 46px; border: 1px solid var(--edge); border-radius: 10px; background: var(--stage); font-family: var(--math); font-size: 22px; }

  /* motion: lines draw themselves in, marks fade or pop in */
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .7s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .fade { animation: fade .45s ease-out both; }
  @keyframes fade { from { opacity: 0; } }
  .pop { transform-box: fill-box; transform-origin: center; animation: pop .4s cubic-bezier(.3, 1.6, .6, 1) both; }
  @keyframes pop { from { opacity: 0; transform: scale(.3); } }
  .pulse { animation: pulse 1.2s ease-in-out 2; }
  @keyframes pulse { 50% { opacity: .35; } }
  .nomo .draw { animation: none; stroke-dashoffset: 0; }
  .nomo .fade, .nomo .pop, .nomo .pulse { animation: none; }

  @media (max-width: 1150px) { .brand { display: none; } .app { grid-template-columns: minmax(0, 1fr) 330px; } .tab { padding: 2px 11px; } }
  @media (max-height: 700px) {
    .top { padding: 5px 12px; } .tab, .notes { min-height: 42px; }

  }
  @media (max-width: 760px) {
    html, body { height: auto; } body { overflow: auto; display: block; }
    .top { flex-wrap: wrap; } .tabs { order: 3; flex-basis: 100%; justify-content: flex-start; } .notes { margin-left: auto; }
    .app { display: block; }
    .stage { height: 52vh; min-height: 260px; }
    .side { border-left: none; border-top: 1px solid var(--edge); overflow: visible; }
  }
  @media (prefers-reduced-motion: reduce) {
    .draw { animation: none; stroke-dashoffset: 0; } .fade, .pop, .pulse { animation: none; }
  }
/* ===== DRILL SHELL CSS END ===== */

<div class="app">

<script>
const DEBUG = /[?&]debug=1/.test(location.search);

/* ===== DRILL KIT START (no DOM): exact fractions and seeded random ===== */
const Q = (() => {
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);
  const q = (n, d) => { d = d == null ? 1 : d; if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return { n: n / g, d: d / g }; };
  const of = v => typeof v === 'number' ? (Number.isInteger(v) ? q(v) : dec(String(v))) : v;
  const add = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d + b.n * a.d, a.d * b.d); };
  const sub = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d - b.n * a.d, a.d * b.d); };
  const mul = (a, b) => { a = of(a); b = of(b); return q(a.n * b.n, a.d * b.d); };
  const div = (a, b) => { a = of(a); b = of(b); return q(a.n * b.d, a.d * b.n); };
  const neg = a => { a = of(a); return q(-a.n, a.d); };
  const eq = (a, b) => { if (a == null || b == null) return false; a = of(a); b = of(b); return a.n === b.n && a.d === b.d; };
  const val = a => { a = of(a); return a.n / a.d; };
  const isInt = a => of(a).d === 1;
  function dec(s) { const m = /^(-?)(\d*)\.?(\d*)$/.exec(s); if (!m) return null; const f = m[3] || ''; return q((m[1] ? -1 : 1) * parseInt((m[2] || '0') + f, 10), Math.pow(10, f.length)); }
  // Text a student typed -> fraction, '' for blank, or null if it is not a number.
  function parse(s) {
    s = String(s == null ? '' : s).replace(/[−–—]/g, '-').replace(/\s+/g, '').replace(/^\+/, '');
    if (s === '') return '';
    if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');
    if (/^-?\d+(\.\d+)?$/.test(s) || /^-?\d*\.\d+$/.test(s)) return dec(s);
    const m = /^(-?)\(?(-?\d+)\)?\/\(?(-?\d+)\)?$/.exec(s);
    if (m) { const d = parseInt(m[3], 10); if (d === 0) return null; return q((m[1] ? -1 : 1) * parseInt(m[2], 10), d); }
    return null;
  }
  const str = a => { a = of(a); return (a.n < 0 ? '−' : '') + (a.d === 1 ? Math.abs(a.n) : Math.abs(a.n) + '/' + a.d); };
  let rand = Math.random;
  function seed(n) { let a = n >>> 0; rand = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rnd = (lo, hi) => lo + Math.floor(rand() * (hi - lo + 1));
  const pick = arr => arr[rnd(0, arr.length - 1)];
  const nz = (lo, hi) => { let k; do { k = rnd(lo, hi); } while (k === 0); return k; };
  const chance = p => rand() < p;
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  return { gcd, lcm, q, of, add, sub, mul, div, neg, eq, val, isInt, parse, str, seed, rnd, pick, nz, chance, shuffle };
})();
/* ===== DRILL KIT END ===== */

/* ===================== MODEL START (no DOM) ===================== */
const MODEL = (() => {
  const { rnd, pick, chance, shuffle } = Q;

  /* 7-5-01 Earth's layers: name the yellow layer, or match a property */
  const LAYERS = ['crust', 'mantle', 'outer', 'inner'];
  const LAYER_NAME = { crust: 'Crust', mantle: 'Mantle', outer: 'Outer core', inner: 'Inner core' };
  const LAYER_FACT = {
    crust: ['Thinnest layer', 'Has oceanic and continental parts', 'The rock we stand on'],
    mantle: ['Hot rock that flows very slowly', 'Convection currents move the plates', 'Thickest layer'],
    outer: ['Liquid iron and nickel', "Makes Earth's magnetic field"],
    inner: ['Solid iron and nickel ball', 'Solid because the pressure is extreme', "At Earth's centre"]
  };
  const LAYER_CUE = { crust: 'Thin outer rock: crust', mantle: 'Thick, slowly flowing rock: mantle', outer: 'Liquid iron and nickel: outer core', inner: 'Solid iron and nickel: inner core' };
  function genLayer() { const a = pick(LAYERS); return chance(.5) ? { form: 'pic', a } : { form: 'fact', a, t: pick(LAYER_FACT[a]) }; }
  const checkLayer = (it, r) => r.v === it.a ? { ok: true } : { code: 'is-' + it.a, cue: LAYER_CUE[it.a] };

  /* 7-5-02 igneous, sedimentary or metamorphic */
  const ROCK = [
    ['Lava cools at the surface', '🌋'], ['Magma cools slowly underground', '🔥'], ['Granite', '🪨'], ['Basalt', '⬛'], ['Obsidian (volcanic glass)', '🖤'], ['Rock melts, then cools', '🌋']
  ].map(([t, i]) => ({ t, i, a: 'ign' })).concat([
    ['Sand pressed and cemented', '🏖️'], ['Layers of shells cemented together', '🐚'], ['Sandstone', '🟫'], ['Shale', '🪨'], ['Limestone', '⬜'], ['Rock with fossils in its layers', '🦴']
  ].map(([t, i]) => ({ t, i, a: 'sed' }))).concat([
    ['Heat and pressure change a rock without melting it', '🔥'], ['Limestone changed into marble', '🏛️'], ['Shale changed into slate', '⬛'], ['Granite changed into gneiss', '🪨'], ['Marble', '🏛️'], ['Slate', '⬛']
  ].map(([t, i]) => ({ t, i, a: 'met' })));
  const ROCK_CUE = { ign: 'Melted rock that cooled: igneous', sed: 'Sediment pressed and cemented: sedimentary', met: 'Heat and pressure, no melting: metamorphic' };

  /* 7-5-02 crystal size: slow cooling underground gives large crystals */
  function genCrys() { const slow = chance(.5); return { form: chance(.6) ? 'pic' : 'cond', slow, seed: rnd(1, 99999), a: slow ? 'slow' : 'fast' }; }
  const checkCrys = (it, r) => r.v === it.a ? { ok: true } : it.slow ? { code: 'slow', cue: 'Slow cooling: crystals grow large' } : { code: 'fast', cue: 'Fast cooling: crystals stay small' };

  /* 7-5-03 plate boundaries */
  const BOUND = ['div', 'conv', 'trans'];
  const BOUND_NAME = { div: 'Divergent', conv: 'Convergent', trans: 'Transform' };
  const BOUND_FACT = {
    div: ['Mid-Atlantic Ridge', 'New seafloor forms', 'A rift opens in Iceland'],
    conv: ['Himalaya Mountains', 'An ocean trench with volcanoes', 'The Rocky Mountains form', 'Cascade volcanoes'],
    trans: ['San Andreas Fault', 'Plates grind past: earthquakes', 'No crust made or destroyed']
  };
  const BOUND_CUE = { div: 'Moving apart: divergent', conv: 'Moving together: convergent', trans: 'Sliding past: transform' };
  function genBound() { const a = pick(BOUND); return chance(.5) ? { form: 'arrows', a, flip: chance(.5) } : { form: 'fact', a, t: pick(BOUND_FACT[a]) }; }
  const checkBound = (it, r) => r.v === it.a ? { ok: true } : { code: 'is-' + it.a, cue: BOUND_CUE[it.a] };

  /* 7-5-04 focus, epicenter (the notes' spelling) or fault */
  const QUAKE = ['focus', 'epi', 'fault'];
  const QUAKE_NAME = { focus: 'Focus', epi: 'Epicenter', fault: 'Fault' };
  const QUAKE_CUE = { focus: 'Underground, where rock breaks: focus', epi: 'Surface point above: epicenter', fault: 'The break in the crust: fault' };
  function genQuake() { return { a: pick(QUAKE), x: rnd(220, 420), d: rnd(110, 200), lean: chance(.5) ? 1 : -1 }; }
  const checkQuake = (it, r) => r.v === it.a ? { ok: true } : { code: 'is-' + it.a, cue: QUAKE_CUE[it.a] };

  /* 7-5-04 shield or composite volcano */
  const VOLC_FACT = { shield: ['Runny lava flows out gently', 'Low-viscosity lava', 'Mauna Loa, Hawaii', 'Kilauea, Hawaii', 'Wide, with gentle slopes'],
    comp: ['Thick lava traps gas: it explodes', 'High-viscosity lava', 'Mt. St. Helens', 'Mt. Fuji', 'A steep cone'] };
  function genVolc() { const a = chance(.5) ? 'shield' : 'comp'; return chance(.5) ? { form: 'shape', a, w: rnd(0, 9), h: rnd(0, 9) } : { form: 'fact', a, t: pick(VOLC_FACT[a]), w: rnd(0, 9), h: rnd(0, 9) }; }
  const checkVolc = (it, r) => r.v === it.a ? { ok: true } : it.a === 'shield' ? { code: 'shield', cue: 'Runny lava, gentle slopes: shield' } : { code: 'comp', cue: 'Thick lava, steep, explosive: composite' };

/* 7-5-04 shield or composite volcano */
function volcano(A, a, w, h, cls) {
  const gy = 370, W = a === 'shield' ? 470 + w * 10 : 230 + w * 8, H = a === 'shield' ? 70 + h * 4 : 200 + h * 5, x = 320, c = a === 'shield' ? 40 : 26;
  const d = a === 'shield' ? `M${x - W / 2} ${gy}Q${x - W * .3} ${gy - H * .9} ${x - c} ${gy - H}h${2 * c}Q${x + W * .3} ${gy - H * .9} ${x + W / 2} ${gy}Z`
    : `M${x - W / 2} ${gy}Q${x - W * .2} ${gy - H * .25} ${x - c} ${gy - H}l${c} 14l${c} -14Q${x + W * .2} ${gy - H * .25} ${x + W / 2} ${gy}Z`;
  const g = el('g', { class: cls || null }, A.svg);
  el('path', { d, fill: '#4a3a33', stroke: '#c9d3e1', 'stroke-width': 2.5 }, g);
  return { g, H, W, gy };
}
