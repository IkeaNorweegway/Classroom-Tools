<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} · Class Slides</title>
{{FONT_LINK}}
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0f1720; }
  body { font-family: 'IBM Plex Sans', Arial, sans-serif; }
  #stage { position: fixed; inset: 0; cursor: pointer; }
  .deck { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  .deck section { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; }
  .deck section:not(.on) { display: none !important; }
  h1 { font-size: 96px; font-weight: 600; line-height: 1.1; }
  h2 { font-size: 64px; font-weight: 600; line-height: 1.15; }
  h3 { font-size: 44px; font-weight: 600; line-height: 1.2; }
  p { font-size: 32px; line-height: 1.4; }
  ul, ol { padding-left: 1.2em; }
  aside { display: none; }
  x-icon, x-shape { display: block; flex: none; }
  x-shape { align-self: center; }
  x-icon svg, x-shape svg { display: block; width: 100%; height: 100%; }
  [data-build-in] { transition: opacity .4s ease; }
  [data-build-in].pending { opacity: 0; }
  .controls {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    display: flex; gap: 6px; align-items: center; padding: 6px;
    background: rgb(15 23 32 / .82); border-radius: 999px; font: 600 14px system-ui, sans-serif; color: #e8edf2;
    opacity: .25; transition: opacity .2s;
  }
  .controls:hover, .controls:focus-within { opacity: 1; }
  .controls button {
    border: 0; background: transparent; color: inherit; font: inherit; padding: 8px 14px; border-radius: 999px; cursor: pointer;
  }
  .controls button:hover, .controls button:focus-visible { background: rgb(255 255 255 / .14); outline: none; }
  .controls .count { padding: 0 8px; font-variant-numeric: tabular-nums; }
  #notes {
    position: fixed; left: 16px; right: 16px; bottom: 72px; max-width: 900px; margin: 0 auto;
    background: #fbfbf8; color: #1b2a3a; font: 17px/1.5 system-ui, sans-serif; padding: 14px 18px;
    border-radius: 12px; box-shadow: 0 8px 30px rgb(0 0 0 / .35); display: none;
  }
  #notes.show { display: block; }
  @media print {
    @page { size: 1920px 1080px; margin: 0; }
    html, body { overflow: visible; height: auto; background: none; }
    #stage { position: static; }
    .deck { position: static; transform: none !important; width: 1920px; height: auto; }
    .deck section, .deck section:not(.on) { display: flex !important; position: relative; break-after: page; }
    [data-build-in].pending { opacity: 1; }
    .controls, #notes { display: none !important; }
  }
</style>
</head>
<body>
<div id="stage" aria-live="polite">
<div class="deck">
{{SLIDES}}
</div>
</div>
<div id="notes" role="note"></div>
<nav class="controls" aria-label="Slide controls">
  <button type="button" id="prev" aria-label="Previous slide">&larr; Back</button>
  <span class="count" id="count"></span>
  <button type="button" id="next" aria-label="Next slide or reveal">Next &rarr;</button>
  <button type="button" id="notesBtn" aria-pressed="false">Notes</button>
  <button type="button" id="full">Full screen</button>
  <button type="button" id="print">Print</button>
</nav>
<script>
(() => {
  // Icon names match the claude.ai Slides type's <x-icon> list, drawn as 24px line icons.
  const ICONS = {
    Activity: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
    Book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
    Chart: '<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
    Chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
    Check: '<path d="M20 6 9 17l-5-5"/>',
    CheckCircle: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/>',
    Clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
    Cloud: '<path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>',
    Code: '<path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/>',
    Database: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/>',
    Globe: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
    GraduationCap: '<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>',
    Home: '<path d="M3 9.5 12 3l9 6.5V20a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
    Key: '<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/>',
    Lightbulb: '<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>',
    Lightning: '<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
    Link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
    Lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
    PaperPlane: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
    Play: '<path d="m6 3 14 9-14 9V3z"/>',
    Search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>',
    Settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
    Star: '<path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>',
    ThumbsUp: '<path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/>',
    Tool: '<path d="M15 12l-8.5 8.5a2.12 2.12 0 0 1-3-3L12 9"/><path d="M17.64 15 22 10.64"/><path d="m20.91 11.7-1.25-1.25c-.6-.6-.93-1.4-.93-2.25v-.86L16.01 4.6a5.56 5.56 0 0 0-3.94-1.64H9l.92.82A6.18 6.18 0 0 1 12 8.4v1.56l2 2h2.47l2.26 1.91"/>',
    Trust: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
    Users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    Verified: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
    Warning: '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
    Wrench: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  };
  // <x-shape> kinds drawn as SVG; rect and rounded keep their painted background.
  const SHAPES = {
    'arrow-right': ['0 0 100 50', '0,15 60,15 60,0 100,25 60,50 60,35 0,35'],
    'arrow-left': ['0 0 100 50', '100,15 40,15 40,0 0,25 40,50 40,35 100,35'],
    'arrow-up': ['0 0 50 100', '15,100 15,40 0,40 25,0 50,40 35,40 35,100'],
    'arrow-down': ['0 0 50 100', '15,0 15,60 0,60 25,100 50,60 35,60 35,0'],
    diamond: ['0 0 100 100', '50,0 100,50 50,100 0,50'],
  };
  document.querySelectorAll('x-icon').forEach((el) => {
    el.setAttribute('aria-hidden', 'true');
    el.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[el.getAttribute('name')] || ''}</svg>`;
  });
  document.querySelectorAll('x-shape').forEach((el) => {
    el.setAttribute('aria-hidden', 'true');
    const kind = el.getAttribute('kind');
    if (kind === 'ellipse') { el.style.borderRadius = '50%'; return; }
    const shape = SHAPES[kind];
    if (!shape) return;
    const fill = el.style.backgroundColor || '#B5562B';
    el.style.background = 'transparent';
    el.innerHTML = `<svg viewBox="${shape[0]}" preserveAspectRatio="none"><polygon points="${shape[1]}" fill="${fill}"/></svg>`;
  });

  const deck = document.querySelector('.deck');
  const slides = [...deck.querySelectorAll(':scope > section')];
  const count = document.getElementById('count');
  const notes = document.getElementById('notes');
  const notesBtn = document.getElementById('notesBtn');
  let i = 0;

  function fit() {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    deck.style.transform = `translate(${(innerWidth - 1920 * s) / 2}px, ${(innerHeight - 1080 * s) / 2}px) scale(${s})`;
  }
  // Entering a slide forwards hides its builds; going back shows them all.
  function show(n, revealAll) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach((s, k) => s.classList.toggle('on', k === i));
    slides[i].querySelectorAll('[data-build-in]').forEach((b) => b.classList.toggle('pending', !revealAll));
    count.textContent = `${i + 1} / ${slides.length}`;
    const aside = slides[i].querySelector('aside');
    notes.textContent = aside ? aside.textContent.trim() : 'No notes for this slide.';
    history.replaceState(null, '', `#${i + 1}`);
  }
  function next() {
    const pending = slides[i].querySelector('[data-build-in].pending');
    if (pending) pending.classList.remove('pending');
    else if (i < slides.length - 1) show(i + 1, false);
  }
  const prev = () => show(i - 1, true);

  document.getElementById('next').addEventListener('click', (e) => { e.stopPropagation(); next(); });
  document.getElementById('prev').addEventListener('click', (e) => { e.stopPropagation(); prev(); });
  notesBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const on = notes.classList.toggle('show');
    notesBtn.setAttribute('aria-pressed', String(on));
  });
  document.getElementById('full').addEventListener('click', (e) => {
    e.stopPropagation();
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.();
  });
  document.getElementById('print').addEventListener('click', (e) => { e.stopPropagation(); window.print(); });
  document.getElementById('stage').addEventListener('click', next);
  addEventListener('keydown', (e) => {
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === 'Home') show(0, false);
    else if (e.key === 'End') show(slides.length - 1, true);
    else if (e.key === 'n' || e.key === 'N') notesBtn.click();
    else if (e.key === 'f' || e.key === 'F') document.getElementById('full').click();
  });
  addEventListener('resize', fit);
  fit();
  show((parseInt(location.hash.slice(1), 10) || 1) - 1, false);
})();
</script>
</body>
</html>
