<!-- =====================================================================
   MATH 9 WORD PROBLEMS TRAINER (narrow trainer format, see _sims-context.md)
   Math 9 | every topic | used after the lessons: it does not teach, each item's 📖 opens its own notes section.
   One tab per topic. The skill on every tab is the same narrow one: turn a short story into the right steps.
   A round of 10 ramps up: items 1–3 are Level 1 (one step), 4–7 Level 2 (two steps), 8–10 Level 3 (three or more).
   Each level draws from three story types, so a tab has nine; Mixed draws from every topic.
     RN Rational   temperatures, balances, depths, rope in eighths, change, a mean, a diver, shares   RN2 RN3 RN5
     SR Roots      side from area, decimal and estimated roots, fences, the Pythagorean theorem in a scene   SR1–SR4
     PE Powers     doubling, cubes, powers of ten, half-life, packing cubes, a chain message   PE1 PE4 PE5 PE7
     LR Relations  phone bill, candle, pay rate; plumber's rate, bowling games, plant table; electrician, balloon, tiles   LR1–LR4
     LE Equations  novels, a fraction of savings, card packs; tickets + fee, fair rides, number trick; gyms, dog run, market   LE1–LE5
     PO Polynomials  triangle perimeter, money kept, lockers; deck, poster, flower bed; shed, cut-out, frame   PO3–PO6
                     (the answer is a polynomial typed into coefficient boxes; the cut-out ends with x substituted)
   The picture is a schematic of the story (a number line, a bar, rectangles or an area model, a triangle in its
   scene, a chain of × steps, a cube, a graph, a table of values, a flow of operations with its undo) above the step
   chain: one row per step, empty until solved. A wrong try names the mistake and turns its step red; Show me fills
   the steps in order.
   Named mistakes (per story type, in the model): subtracting a negative, the sign of a fall or a dive, one step
   left out (the fee, the coldest day, the shared edge, the last subtraction), √ as ÷ 2, area for side, no root,
   adding instead of squaring, the exponent for the value, adding exponents in a power of a power, × 3 for cubed;
   the fee left out or multiplied, slope from totals, the starting value left out, off by one figure, undoing in the
   wrong order, rounding the wrong way, rates added, the middle terms, one term multiplied, subtracting only the
   first term, the shed or photo not taken away, perimeter for area.
   Model: generated stories with exact answers; every answer and every named mistake is checked in the tests.
   Shared parts: wp.js (pictures, step chain, the tab). ?debug=1 puts DRILL (and MODEL) on window, no saving or motion.
   ===================================================================== -->
