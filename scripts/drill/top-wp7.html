<!-- =====================================================================
   SCIENCE 7 WORD PROBLEMS TRAINER (narrow trainer format, see _sims-context.md)
   Science 7 | every unit | used after the lessons: it does not teach, each item's 📖 opens its own notes section.
   These are science problems, not calculations: a short story from an Alberta setting, and one science idea
   (or a chain of them) to apply. One tab per unit plus Mixed. The skill on every tab is the same narrow one:
   turn a short story into the right science reasoning, then tap the answer (one try).
   A round of 10 ramps up: items 1–3 are Level 1 (one step: name the idea in the story), 4–7 Level 2 (two steps:
   apply it to predict or explain one link), 8–10 Level 3 (three steps: a chain of cause and effect, or a fix
   that matches the cause). Each level draws from three story types (Planet Earth Level 1 has four).
     7-1 Ecosystems  biotic/abiotic 7-1-01, role and energy arrow 7-1-02; the 10% pyramid, a food-web link 7-1-02,
                     biodiversity and a pest 7-1-03; a change down a chain, recovery after a disturbance,
                     the fix that matches the cause 7-1-04
     7-2 Plants      cell part under the microscope 7-2-01, xylem or phloem 7-2-02, sexual or asexual 7-2-04;
                     a missing input to photosynthesis, where the mass comes from (van Helmont) 7-2-03,
                     pollinators and seeds 7-2-04; selective breeding or GMO, rotation 7-2-05, less light up a lake chain 7-2-03
     7-3 Heat        conduction/convection/radiation 7-3-03, heat flow (or none) 7-3-01, expand or contract 7-3-02;
                     heat vs temperature 7-3-01, metal feels colder 7-3-03, heat capacity 7-3-04;
                     insulation both ways, a change of state 7-3-02, thermal pollution 7-3-05
     7-4 Structures  type 7-4-01, load and internal force 7-4-02; beam top and bottom (and rebar) 7-4-02,
                     which tips first (CoG and base, tipping angle drawn) 7-4-03, the machine trade-off 7-4-04;
                     the design fix, counterweights and leaning 7-4-03/05, material for the force 7-4-05
     7-5 Earth       rock type 7-5-02, boundary 7-5-03, weathering/erosion/deposition 7-5-05, interior layer 7-5-01;
                     superposition 7-5-06, why quakes (or few in Alberta) 7-5-04, crystal size 7-5-02;
                     marine fossils on peaks 7-5-03, a rock-cycle path 7-5-02, Alberta landforms 7-5-05
   The picture is a schematic of the story (icon cards and arrows, layers, a plant cell, a bent beam with its
   squeezed and stretched sides, two blocks with their centres of gravity) above the reasoning chain: one row per
   step, empty until answered. Any answer fills the chain in order; after a wrong pick, the step that choice broke
   turns red, and the feedback names the misconception.
   Named misconceptions (per story type, in the model): producer as consumer, arrows as "eats", energy growing up
   the chain, "stays the same" in a web, nature always recovers (and never recovers), fixing the count not the
   cause; food from the soil, sunlight as mass, phloem/xylem swapped, flowers fine without pollinators, GMO vs
   breeding, one-season change; cold flowing, particles growing or melting, temperature as total energy, metal
   "colder", insulation making heat, matter destroyed by evaporating; compression/tension swapped, a stronger
   material for a tipping problem, machines making energy; melting called metamorphic, a flood for marine fossils,
   catastrophic uplift, the top layer as oldest, crystal size backwards.
   Model: banks of Alberta scenarios with fixed answers; every answer and misconception is checked in the tests.
   Shared parts: sci.js (cards, arrows, chips) and sw.js (pictures, reasoning chain, the tab).
