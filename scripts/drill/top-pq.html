<!-- =====================================================================
   PAT QUESTIONS TRAINER (narrow trainer format, see _sims-context.md)
   Math 9 | all strands | PAT prep. The released PAT items (2013, 2015, 2019) that used to sit on the PAT Prep page,
   in the trainer look (user request, 2026-10-30), plus PAT-style generated items so a round is never the same list.
   One PAT strand per tab, 10 items a round, multiple choice (tap, one try) or numerical response (type, two tries):
     N   Number                 powers, rational numbers, order of operations, square roots
     PR  Patterns               equations, inequalities, polynomials, linear relations, word problems
     SS  Shape & Space          area and √, surface area of cubes, circle angles and tangents, similarity and scale
     SP  Stats & Prob           sampling and bias, subjective judgment, predicting from a sample
     PAT Mixed                  any strand, weighted like the PAT blueprint (32 / 36 / 24 / 8)
   Every word problem has a schematic picture of its story (a tape, a road, a bar model, the gong and its chain, the
   cubes in 3-D, the school and its sample); computations show their worked steps instead. The 📖 link follows the
   current item's own topic and section. About 7 in 10 items are released items, kept out for the next 6 items of their strand;
   the rest are generated (exponent chains, perfect-square counts, two plans, saving up, ages, gardens, tickets,
   inscribed angles, scale factors, predictions, fair samples).
   Model: every item's answer and named mistakes are checked in the model tests (extra-pq.js).
   ?debug=1 puts DRILL (and MODEL) on window, turns off saving and motion.
   ===================================================================== -->
