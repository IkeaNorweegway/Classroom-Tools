<!-- =====================================================================
   RATIONAL NUMBERS TRAINER (narrow trainer format, see _sims-context.md)
   Math 9 | Number | Rational Numbers. Used after the lesson: it does not teach, it points back to the notes.
   Replaces the Fraction Simulator on the site (that page stays, unlinked).
   One narrow skill per tab, 10 items a round:
     RN1 Compare        <, = or > for two rationals in different forms (fraction, decimal, −3/4 = 3/−4); both shown on a number line
     RN2 Add fractions  a/b ± c/d with signs: rename over the LCD, then jump on a number line ticked in 1/LCD
     RN2 Signs          decimals with negatives; "minus a negative" is rewritten as "plus"
     RN3 Multiply       proper fractions with signs: the sign rule beside an area model
     RN4 Divide         flip the second fraction; a bar shows how many pieces fit
     RN4 Bigger?        is n ÷ f (or n × f) bigger or smaller than n? two bars compared
     RN5 First step     which operation comes first; then every step is shown with the part done boxed
   Named mistakes: comparing sizes of negatives, adding denominators, renaming only the bottom, minus a negative,
   sign rules, top × bottom, not flipping or flipping the first, order of operations (brackets, exponents,
   × ÷ before + −, left to right). Equal unsimplified fractions are accepted.
   ?debug=1 puts DRILL (and MODEL) on window, turns off saving and motion.
   ===================================================================== -->
