<!-- =====================================================================
   PAT WORD PROBLEMS TRAINER (narrow trainer format, see _sims-context.md)
   Math 9 | all strands | PAT prep. Used after the units: it does not teach, each tab points back to its notes section.
   The one narrow trainer that keeps word problems on screen (user request, 2026-10-29): each tab is one PAT-style
   problem type, the story is two short sentences, and the picture is a schematic of the story (a tape, a road, a
   room, a triangle in the scene), not decoration.
   One problem type per tab, 10 items a round, numerical response like PAT Part B:
     RN3 Trip       distance = speed × time for two legs; times in fractions of an hour or in minutes
     SR1 Rug        a square covers p% of a rectangle: area first, then √
     LR4 Bill       total = fee + rate × n, or n from the total (partial variation)
     LE5 Save up    (goal − have) ÷ rate, rounded UP to a whole number
     LE4 Budget     fee + rate × n ≤ budget, rounded DOWN
     LE5 Shares     three people, one unknown: a bar model (t, k·t, k·t ± d)
     LE5 Catch up   two plans, fee + rate × n: when do they cost the same?
     SR3 Ladder     the Pythagorean theorem in a scene (ladder, screen, ramp, shortcut across a park)
     ME2 Paint      surface area of a box, closed or open-topped
     PR1 Predict    a sample result scaled to the whole group
     Mixed          any of the above, as on the PAT
   Named mistakes: minutes read as decimal hours, one leg only, speeds added; area given for the side, √ as ÷ 2, the
   percent left out; the fee left out or multiplied; rounding the wrong way, not taking off what you have; the
   extra amount not taken off first, another person's share; the fee gap not divided, rates added; adding the sides,
   no root, adding for a leg, the diagonal for "how much shorter"; the top counted on an open box, one face of each
   pair, volume for area; part to part, the percent for the count, the sample count.
   Model: exact arithmetic on generated stories; every answer is checked in the model tests (400 per tab).
   ?debug=1 puts DRILL (and MODEL) on window, turns off saving and motion.
   ===================================================================== -->
